# Runs on every pull request. No secrets, no deploy, read-only token.
name: check
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Dash scan
        run: node tests/check.mjs --scan dashes
      - name: Name scan
        run: node tests/check.mjs --scan names
      - name: Secrets scan
        run: node tests/check.mjs --scan secrets
      - name: Check
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: npm run check -- --base "$BASE_REF"
