<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<title>Think Possibility, Not Probability</title>
<style>
/* ===========================================================================
   LIVE DECK: a single-file, keyboard-driven 16:9 presentation.
   Brand tokens below are fallbacks. When served by server.py, /brand.css
   (generated from brand.json) overrides them, so one file re-skins everything.
   =========================================================================== */
:root{
  --brand:#8C10E0; --bright:#6C5CED; --accent:#1E7A3C; --dark:#13004F; --warm:#D97706;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --plane:#E2E8F0; --surf:#FFFFFF; --surf-2:#F8FAFC; --surf-3:#EEF2F6;
  --ink:#0F172A; --ink-2:#475569; --ink-3:#94A3B8; --hair:rgba(15,23,42,.10);
  --no:#B32A2A; --yes:var(--accent);
  --ease:cubic-bezier(.2,.8,.2,1);
}
</style>
<script>if(location.protocol!=="file:"){const l=document.createElement("link");l.rel="stylesheet";l.href="/brand.css";const st=document.currentScript;st.parentNode.insertBefore(l,st);}</script>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--dark);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
kbd{font:600 11px var(--font);padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.12);margin-left:4px}

#viewport{position:fixed;inset:0 0 46px 0;overflow:hidden}
html.proj,html.proj body{background:#0f1a2e;overflow:hidden;cursor:none}
html.proj #viewport{inset:0}
html.proj #stage{border-radius:0;box-shadow:none}
html.proj #bar,html.proj .maisie-ask{display:none!important}
#stage{position:absolute;left:50%;top:50%;width:1440px;height:810px;transform-origin:center;border-radius:14px;overflow:hidden;
  background:var(--surf);box-shadow:0 30px 80px rgba(0,0,0,.45)}
.scene{position:absolute;inset:0;padding:64px 80px 56px;display:flex;flex-direction:column;opacity:0;visibility:hidden;
  transition:opacity .45s var(--ease),visibility 0s .45s;background:var(--surf)}
.scene.on{opacity:1;visibility:visible;transition:opacity .45s var(--ease)}
.scene.dark{background:var(--dark);color:#fff;
  background-image:radial-gradient(1100px 640px at 88% -20%,color-mix(in srgb,var(--bright) 22%,transparent),transparent 62%)}
.kick{font-size:14px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin-bottom:14px}
.dark .kick{color:var(--bright)}
h1{font-size:56px;line-height:1.04;letter-spacing:-.025em;font-weight:700;margin:0;max-width:22ch}
h2{font-size:26px;font-weight:700;letter-spacing:-.01em;margin:0}
.sub{font-size:22px;line-height:1.45;color:var(--ink-2);margin:18px 0 0;max-width:52ch}
.dark .sub{color:rgba(255,255,255,.74)}
.body{flex:1;min-height:0;margin-top:40px;display:flex;flex-direction:column}
.src{position:absolute;left:80px;bottom:22px;font-size:12px;color:var(--ink-3)}

/* left-to-right build: children rise in by position, in order */
.on .stagger>*{animation:inL .6s var(--ease) both}
.on .stagger>*:nth-child(2){animation-delay:.08s}.on .stagger>*:nth-child(3){animation-delay:.16s}
.on .stagger>*:nth-child(4){animation-delay:.24s}.on .stagger>*:nth-child(5){animation-delay:.32s}
.on .stagger>*:nth-child(n+6){animation-delay:.4s}
@keyframes inL{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}

/* logos */
.logos{display:flex;align-items:center;gap:22px}
.logos img{height:34px;width:auto;display:block}.logos img.big{height:44px}
.logos .dv{width:1px;height:34px;background:rgba(255,255,255,.25)}
.phold{display:grid;place-items:center;text-align:center;border:2px dashed var(--hair);border-radius:16px;background:var(--surf-2);color:var(--ink-3);font-size:15px;padding:20px}

/* cover */
.t-cover{justify-content:space-between}
.t-cover h1{font-size:84px;max-width:16ch}
.t-cover .meta{display:flex;gap:28px;font-size:18px;color:rgba(255,255,255,.7)}
.t-cover .meta.col{flex-direction:column;gap:6px;font-size:17px}

/* section */
.t-section{justify-content:center}
.t-section .n{font-size:160px;font-weight:800;letter-spacing:-.05em;line-height:.9;color:var(--bright);opacity:.9;margin-bottom:20px}
.t-section h1{font-size:72px}

/* statement */
.t-statement{justify-content:center}
.t-statement h1{font-size:72px;max-width:20ch}

/* bullets */
.bl{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.bl>div{background:var(--surf-2);border:1px solid var(--hair);border-radius:18px;padding:28px 26px}
.bl .bn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--brand);color:#fff;font-weight:800;font-size:16px;margin-bottom:18px}
.bl h2{font-size:23px;line-height:1.2}
.bl p{font-size:17px;line-height:1.5;color:var(--ink-2);margin:10px 0 0}

/* stats */
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;margin-top:auto;margin-bottom:auto}
.st>div{border-top:3px solid var(--brand);padding-top:22px}
.st>div:nth-child(2){border-color:var(--accent)}.st>div:nth-child(3){border-color:var(--warm)}.st>div:nth-child(4){border-color:var(--bright)}
.st b{display:block;font-size:76px;font-weight:800;letter-spacing:-.04em;line-height:1}
.st span{display:block;font-size:18px;line-height:1.4;color:var(--ink-2);margin-top:14px;max-width:24ch}

/* team */
.tm{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,300px));gap:26px}
.tm.solo{grid-template-columns:340px minmax(0,640px);gap:56px;align-items:center}
.tm.solo h2{margin-top:0;font-size:40px;letter-spacing:-.02em}.tm.solo .r{font-size:20px;margin-top:8px}.tm.solo p{font-size:22px;margin-top:18px}
.tm.solo .ph{font-size:96px}
.tm .ph{width:100%;aspect-ratio:1/1;border-radius:20px;object-fit:cover;background:var(--surf-3);display:grid;place-items:center;
  font-size:64px;font-weight:800;color:var(--brand);letter-spacing:-.03em}
.tm h2{margin-top:18px}.tm .r{font-size:16px;font-weight:700;color:var(--brand);margin-top:4px}
.tm p{font-size:16.5px;line-height:1.5;color:var(--ink-2);margin:10px 0 0}

/* quote */
.t-quote{justify-content:center}
.t-quote blockquote{margin:0;font-size:52px;line-height:1.2;letter-spacing:-.02em;font-weight:600;max-width:26ch}
.t-quote blockquote::before{content:"\201C";display:block;font-size:140px;line-height:.6;color:var(--bright);margin-bottom:10px}
.t-quote cite{display:block;margin-top:30px;font-style:normal;font-size:20px;color:rgba(255,255,255,.7)}

/* image */
.im{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.im img,.im .phold{flex:1;min-height:0;width:100%;object-fit:contain;border-radius:16px}
.im figcaption{font-size:15px;color:var(--ink-2)}

/* demo map */
.cm{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.cc{border-radius:18px;border:1px solid var(--hair);background:var(--surf-2);padding:26px;cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s}
.cc:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(15,23,42,.12)}
.cc .n{font-size:15px;font-weight:800;color:var(--brand)}
.cc .t{font-size:25px;font-weight:700;letter-spacing:-.01em;margin-top:8px;line-height:1.15}
.cc .q{font-size:15px;color:var(--ink-3);margin-top:10px}
.cc .pg{font-size:14px;font-weight:700;color:var(--accent);margin-top:14px;min-height:1em}
.cc .hi{display:inline-block;margin-top:12px;font-size:13px;font-weight:700;color:var(--warm)}

/* chapter: the items the audience asked to see */
.chh{display:flex;gap:26px;align-items:flex-start}
.chn{flex:none;width:92px;height:92px;border-radius:24px;background:var(--dark);color:#fff;display:grid;place-items:center;font-size:36px;font-weight:800;letter-spacing:-.03em}
.chq{display:flex;gap:18px}
.rq{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;overflow:auto}
.rq .r{display:grid;grid-template-columns:72px 1fr auto;gap:20px;align-items:center;padding:18px 22px;border-radius:16px;
  background:var(--surf-2);border:1px solid var(--hair);cursor:pointer;transition:background .35s,border-color .35s,box-shadow .35s}
.rq .r:hover{border-color:color-mix(in srgb,var(--brand) 40%,transparent)}
.rq .r.next{box-shadow:0 0 0 2px var(--brand)}
.rq .r.done{background:color-mix(in srgb,var(--accent) 9%,var(--surf));border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.rq .id{font-size:20px;font-weight:800;color:var(--brand)}.rq .r.done .id{color:var(--accent)}
.rq .qt{font-size:21px;font-weight:600;line-height:1.3}
.rq .qo{font-size:16.5px;color:var(--ink-2);line-height:1.4;max-height:0;opacity:0;overflow:hidden;transition:max-height .5s var(--ease),opacity .4s,margin .3s}
.rq .r.done .qo{max-height:80px;opacity:1;margin-top:6px}
.rq .hi{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;color:var(--warm)}
.go{font-size:14px;font-weight:700;padding:9px 16px;border-radius:99px;white-space:nowrap;background:var(--surf-3);color:var(--ink-2)}
.go.live{background:var(--brand);color:#fff}
.r.done .go{background:var(--accent);color:#fff}
.chf{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:18px;font-size:17px;color:var(--ink-2)}
.nextch{visibility:hidden;font-weight:700;color:#fff;background:var(--accent);padding:10px 18px;border-radius:99px;cursor:pointer}
.nextch.on{visibility:visible}

/* story */
.sy{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;flex:1;min-height:0}
.sy .lbl{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 6px}
.sy p{font-size:19px;line-height:1.5;margin:0}
.sy .big{font-size:96px;font-weight:800;letter-spacing:-.04em;color:var(--brand);line-height:1}
.sy .bigl{font-size:19px;color:var(--ink-2);margin-top:10px;max-width:26ch;line-height:1.4}
.sy blockquote{margin:30px 0 0;padding-left:20px;border-left:4px solid var(--accent);font-size:21px;line-height:1.45;font-style:italic}
.sy cite{display:block;font-style:normal;font-size:15px;color:var(--ink-3);margin-top:10px}
.sy .card{background:var(--surf-2);border:1px solid var(--hair);border-radius:20px;padding:34px}
.sy .here{background:color-mix(in srgb,var(--brand) 7%,var(--surf));border-color:color-mix(in srgb,var(--brand) 25%,transparent)}

/* closing */
.t-closing{justify-content:space-between}
.cl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:40px}
.cl>div{border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:24px;font-size:19px;line-height:1.4;background:rgba(255,255,255,.04)}
.cl b{display:block;font-size:14px;color:var(--bright);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}

/* shared text blocks any scene can add: body, note, hl, callout, band, foot */
.bd{font-size:21px;line-height:1.5;color:var(--ink-2);margin:16px 0 0;max-width:72ch}
.dark .bd{color:rgba(255,255,255,.74)}
.note{font-size:16px;color:var(--ink-2);text-align:center;margin:16px 0 0}
.hl{font-size:24px;line-height:1.35;font-weight:700;margin:28px 0 0}.hl.c{text-align:center}.hl.brand{color:var(--brand)}
.dark .hl{color:#fff}
.co{margin-top:30px;padding:28px 36px;border-radius:14px;background:color-mix(in srgb,var(--brand) 7%,var(--surf));
  border:1px solid color-mix(in srgb,var(--brand) 16%,transparent);text-align:center}
.co small{display:block;font-size:17px;color:var(--ink-2);margin-bottom:8px}.co b{display:block;font-size:24px;line-height:1.4}
.band{margin-top:26px;padding:24px 30px;border-radius:12px;background:var(--dark);color:#fff;text-align:center;font-weight:700;font-size:20px}
.ft{margin:24px 0 0;font-size:18px;font-style:italic;font-weight:600}
.dfoot{position:absolute;left:80px;right:80px;bottom:22px;display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)}
.has-foot .src{left:auto;right:80px;bottom:40px}
.scene.bgimg{background-size:cover;background-position:center}
.t-statement.top{justify-content:flex-start}.t-statement.top h1{font-size:50px;max-width:none}

/* bullets variants: plain (no numbers), cols:2..4, center, layout:"list" or "steps" */
.bl.c2{grid-template-columns:1fr 1fr}.bl.c3{grid-template-columns:repeat(3,1fr)}.bl.c4{grid-template-columns:repeat(4,1fr)}
.bl.center>div{text-align:center}.bl.plain h2{color:var(--brand)}
.bl.list{grid-template-columns:1fr;gap:20px;max-width:900px}
.bl.list>div,.bl.steps>div{display:grid;grid-template-columns:64px 1fr;column-gap:26px;align-items:center}
.bl.list>div{background:none;border:0;padding:0}
.bl.list .bn,.bl.steps .bn{width:64px;height:64px;font-size:24px;margin:0;grid-row:span 2;background:var(--dark)}
.bl.steps .bn{width:48px;height:48px;font-size:20px}
.bl.list h2,.bl.steps h2{align-self:end}.bl.list p,.bl.steps p{margin:4px 0 0}.bl.steps p:empty{display:none}
.bl.steps h2:only-of-type{grid-row:span 2;align-self:center}

/* quote on a light slide, long quotes, no decorative mark */
.t-quote:not(.dark) blockquote::before{color:var(--brand)}
.t-quote blockquote p{margin:0 0 .5em}
.t-quote blockquote.long{font-size:32px;line-height:1.35;font-weight:700;max-width:none}
.t-quote blockquote.noq::before{display:none}

/* compare: two columns of crosses and ticks */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.cmp>div{border:1px solid var(--hair);border-radius:16px;padding:26px 30px;min-height:230px;background:var(--surf)}
.cmp>div.tone-no{border-color:color-mix(in srgb,var(--no) 35%,transparent)}
.cmp>div.tint{background:color-mix(in srgb,var(--brand) 6%,var(--surf))}.cmp>div.grey{background:var(--surf-3)}
.cmp h3{margin:0 0 18px;font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.cmp .tone-no h3{color:var(--no)}.cmp .tone-yes h3{color:var(--yes)}
.cmp ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.cmp li{display:grid;grid-template-columns:28px 1fr;font-size:19px;line-height:1.4}
.cmp li i{font-style:normal;font-weight:800}.cmp .x i{color:var(--no)}.cmp .ok i{color:var(--yes)}
.badge{position:absolute;right:80px;top:64px;background:var(--brand);color:#fff;font-weight:800;font-size:14px;letter-spacing:.12em;padding:8px 30px;border-radius:10px}

/* rows: label and text, or question and answer (answer:true) */
.rw{display:flex;flex-direction:column;gap:12px}
.rw>div{display:grid;grid-template-columns:300px 1fr;gap:30px;align-items:center;padding:18px 24px;border-radius:12px;background:var(--surf-2);border:1px solid var(--hair);font-size:19px}
.rw>div:nth-child(odd){background:color-mix(in srgb,var(--brand) 6%,var(--surf))}
.rw .a{font-weight:700;color:var(--brand)}
.rw.ans>div{grid-template-columns:minmax(0,640px) 1fr;background:none!important;border:0;padding:14px 0;font-size:21px}
.rw.ans .a{font-weight:500;color:var(--ink)}.rw.ans .b{font-weight:800;color:var(--no)}

/* vote: the room picks on their phones, bars fill live */
.vt{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}
.vt>div{position:relative;overflow:hidden;border:1px solid var(--hair);border-radius:16px;padding:28px 24px 30px;text-align:center;background:var(--surf);transition:box-shadow .3s}
.vt .k{font-size:34px;font-weight:800;color:var(--brand)}.vt .t{font-size:21px;font-weight:700;margin-top:10px}
.vt .vn{font-size:15px;color:var(--ink-2);margin-top:8px;min-height:1.3em;font-variant-numeric:tabular-nums}
.vt .vb{position:absolute;left:0;bottom:0;height:7px;background:var(--brand);width:0;transition:width .6s var(--ease)}
.vt>div.lead{box-shadow:0 0 0 2px var(--brand)}
.vhint{font-size:15px;color:var(--ink-2);margin-top:14px;text-align:center}

/* prompt: a copy-ready prompt in a code panel (phones get a Copy button) */
.pr{margin:0;background:var(--code,#1B1233);color:#EDE9F7;border-radius:14px;padding:30px 36px;
  font:17px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;overflow:auto;min-height:0}

/* aside: a picture card next to the text (a QR code, a headshot) */
.asd{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:60px;align-items:center}
.asd figure{margin:0;border-radius:18px;padding:30px;text-align:center;background:color-mix(in srgb,var(--brand) 7%,var(--surf));border:1px solid color-mix(in srgb,var(--brand) 16%,transparent)}
.asd figure img{width:220px;height:auto;display:block;margin:0 auto 16px}
.asd figcaption span{display:block;font-size:15px;color:var(--ink-2)}.asd figcaption span:first-child{font-weight:700;color:var(--ink)}
.asd figcaption span:nth-child(2){font-weight:700;color:var(--brand)}
.corner{position:absolute;right:80px;bottom:60px;width:150px;border-radius:10px;background:#fff;padding:8px}

/* backstage (presenter only, never served to the audience) */
.bk{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;overflow:auto}
.bk label{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:center;font-size:15px;font-weight:700;color:var(--brand)}
.bk input{font:15px var(--font);padding:10px 12px;border:1px solid var(--hair);border-radius:10px;background:var(--surf-2);width:100%}

/* chrome */
#bar{position:fixed;left:0;top:0;height:3px;background:var(--bright);width:0;transition:width .4s var(--ease);z-index:5}
#chrome{position:fixed;left:0;right:0;bottom:0;height:46px;display:flex;align-items:center;gap:10px;padding:0 16px;color:#fff;font-size:14px;z-index:6;transition:opacity .3s}
#chrome.hide{opacity:0}#chrome.hide:hover{opacity:1}
#chrome .mk{height:18px;width:auto;opacity:.9}
#chrome .who{color:rgba(255,255,255,.65);font-weight:500}
#chrome .sp{flex:1}
#chrome button{background:rgba(255,255,255,.08);border:0;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:#fff}
#chrome button:hover{background:rgba(255,255,255,.16)}
#cnt{min-width:64px;text-align:right;color:rgba(255,255,255,.65);font-variant-numeric:tabular-nums}#cnt b{color:#fff}
html{touch-action:manipulation}.zone{position:fixed;top:0;bottom:46px;width:12vw;z-index:3;cursor:pointer}.zone.p{left:0}.zone.n{right:0}
.ovl{position:fixed;inset:0 0 46px 0;z-index:8;background:color-mix(in srgb,var(--dark) 94%,transparent);color:#fff;padding:48px 64px;overflow:auto;display:none}
.ovl.open{display:block}
.ovl h4{margin:0 0 22px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--bright)}
#gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
#gr .th{border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:14px;cursor:pointer;font-size:15px;line-height:1.3}
#gr .th small{display:block;color:rgba(255,255,255,.5);font-size:12px;margin-bottom:6px}
#gr .th.cur{border-color:var(--bright);background:rgba(255,255,255,.06)}
.keys{display:grid;grid-template-columns:1fr auto;gap:12px 40px;max-width:560px;font-size:16px}
#nb{font-size:18px;line-height:1.65;max-width:820px}#nb li{margin-bottom:10px}
#nb li.todo{color:#FFD58A}
#nb .s{margin-top:20px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:14px;color:rgba(255,255,255,.6)}

/* ==== part: theme ==== */
/* ===== theme: Gov AI Pro, elevated. Fonts, tokens, type, cards, badges, tiles, buttons, chrome, background system ===== */
@font-face{font-family:'Fraunces';font-weight:400 700;font-display:swap;src:url(../fonts/fraunces-400.woff2) format('woff2')}
@font-face{font-family:'Fraunces';font-style:italic;font-weight:400 700;font-display:swap;src:url(../fonts/fraunces-500i.woff2) format('woff2')}
@font-face{font-family:'Public Sans';font-weight:400 700;font-display:swap;src:url(../fonts/publicsans-400.woff2) format('woff2')}
:root{
  --navy:#15233b; --navy-2:#1d3155; --navy-deep:#0f1a2e; --ink-soft:#41506b; --teal:#2BB3A3; --lilac:#9B8CF2;
  --orange:#e25c0f; --orange-deep:#c44a06; --gold:#e7a23c; --cream:#f4efe5; --paper:#fbf8f2;
  --grey-1:#c3cdde; --grey-2:#aab4c5; --grey-3:#9aa6ba; --grey-4:#7d899c; --done:#1E7A3C; --err:#B32A2A;
  --brand:var(--orange); --bright:var(--gold); --dark:var(--navy); --warm:var(--orange-deep); --accent:#1E7A3C;
  --ink:var(--navy); --ink-2:var(--ink-soft); --ink-3:#7d899c; --surf:var(--paper); --surf-2:#ffffff; --surf-3:var(--cream);
  --hair:rgba(21,35,59,.10); --code:var(--navy-deep); --no:#B32A2A; --yes:#1E7A3C; --plane:var(--cream);
  --font:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --card-shadow:0 1px 2px rgba(21,35,59,.05),0 18px 40px -28px rgba(21,35,59,.35);
  --card-shadow-hi:0 1px 2px rgba(21,35,59,.06),0 30px 60px -36px rgba(21,35,59,.45);
  --tile-grad:linear-gradient(135deg,#f07a2a,#e25c0f 55%,#c44a06);
  --theme-grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
html,body{background:var(--navy-deep);font-family:var(--font);color:var(--ink)}
#stage{background:var(--navy);font-family:var(--font);box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.04)}

/* scenes are transparent: the stage carries the background */
.scene,.scene.dark,.scene.bgimg{background:transparent!important;z-index:1}
.scene{color:var(--ink)}
.scene.dark{color:#fff}

/* type */
h1{font-family:var(--serif);font-weight:700;font-size:56px;line-height:1.06;letter-spacing:-.015em;font-optical-sizing:auto;color:var(--navy);max-width:22ch}
.scene.dark h1{color:#fff}
h1 em{font-style:italic;font-weight:500;color:var(--orange);letter-spacing:-.01em}
h1.theme-long{font-size:48px;max-width:24ch}
h2{font-family:var(--font);font-weight:700;color:var(--navy);letter-spacing:-.005em}
.scene.dark h2{color:#fff}
.kick{display:flex;align-items:center;gap:12px;font:700 14px/1.2 var(--font);letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:18px}
.kick::before{content:"";flex:none;width:22px;height:1.5px;background:var(--orange);border-radius:1px}
.scene.dark .kick{color:var(--orange)}
.sub{font-family:var(--font);font-size:22px;line-height:1.5;color:var(--ink-soft);margin-top:18px;max-width:56ch}
.scene.dark .sub{color:rgba(255,255,255,.78)}
.bd{font-size:22px;line-height:1.5;color:var(--ink-soft)}
.scene.dark .bd{color:rgba(255,255,255,.78)}
.note{font-size:18px;color:var(--ink-soft)}
.scene.dark .note{color:rgba(255,255,255,.7)}
.hl{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.3;letter-spacing:-.01em;color:var(--navy);margin-top:30px;font-optical-sizing:auto}
.hl.brand{color:var(--orange)}
.scene.dark .hl{color:#fff}
.ft{font-family:var(--serif);font-style:italic;font-weight:500;font-size:22px;line-height:1.4;color:var(--ink-soft);margin-top:24px}
.scene.dark .ft{color:rgba(255,255,255,.8)}
.co{margin-top:30px;padding:26px 34px;border-radius:18px;background:#fff;border:1px solid rgba(21,35,59,.08);box-shadow:var(--card-shadow);text-align:left;position:relative;overflow:hidden}
.co::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--orange)}
.co small{font-size:18px;color:var(--ink-soft);margin-bottom:6px}
.co b{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.35;color:var(--navy)}
.band{margin-top:28px;padding:24px 34px;border-radius:16px;background:linear-gradient(120deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;
  font:600 22px/1.45 var(--font);text-align:left;position:relative;overflow:hidden;box-shadow:0 24px 50px -30px rgba(15,26,46,.7)}
.band::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--gold),var(--orange))}
.scene.dark .band{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.dfoot{color:var(--ink-3);font-size:13px;right:180px}
.src{color:var(--ink-3)}

/* template scene types in the new brand */
.t-cover h1{font-size:84px;max-width:15ch;line-height:1.02}
.t-cover .meta{font-size:18px;color:rgba(255,255,255,.72)}
.t-cover .meta.col{font-size:18px}
.t-section h1{font-size:88px;line-height:1.02}
.t-section .n{font-family:var(--serif);font-weight:500;font-style:italic;color:var(--orange)}
.t-statement h1{font-size:72px;max-width:18ch}
.t-statement.top h1{font-size:56px;max-width:22ch}
.t-statement.top h1.theme-long{font-size:48px}
.logos img{mix-blend-mode:normal}
.scene:not(.dark) .logos img{mix-blend-mode:multiply}
.t-quote blockquote{font-family:var(--serif);font-weight:500;font-size:44px;line-height:1.22;letter-spacing:-.012em;max-width:28ch;font-optical-sizing:auto}
.t-quote blockquote.long{font-family:var(--serif);font-weight:500;font-size:36px;line-height:1.3;max-width:34ch}
.t-quote blockquote::before{font-family:var(--serif);font-style:italic;color:var(--orange);font-size:150px;line-height:.62}
.t-quote cite{font-size:20px}

/* cards */
.bl>div,.cmp>div,.cc,.rq .r,.sy .card,.vt>div,.asd figure{background:#fff;border:1px solid rgba(21,35,59,.08);border-radius:18px;box-shadow:var(--card-shadow);
  transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s var(--ease)}
.bl>div:hover,.cc:hover,.vt>div:hover{box-shadow:var(--card-shadow-hi)}
.bl h2{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.2;color:var(--navy)}
.bl p{font-size:19px;line-height:1.5;color:var(--ink-soft)}
.bl.plain h2{color:var(--orange)}
.bl.list>div{background:none;border:0;box-shadow:none}
/* numbered badges: 40px rounded squares, 1.5px orange border, orange numerals */
.bl .bn,.bl.list .bn,.bl.steps .bn,.theme-badge{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:transparent;border:1.5px solid var(--orange);color:var(--orange);font:600 18px/1 var(--serif);font-variant-numeric:lining-nums}
.bl.list .bn{width:56px;height:56px;border-radius:14px;font-size:24px}
.bl.steps .bn{width:48px;height:48px;font-size:20px}
.scene.dark .theme-badge,.scene.dark .bl .bn{border-color:var(--orange);color:var(--orange)}
/* compare */
.cmp>div{padding:28px 32px;min-height:230px}
.cmp>div.tint{background:#fff}.cmp>div.grey{background:var(--cream);box-shadow:none}
.cmp>div.tone-no{border-color:rgba(179,42,42,.28)}
.cmp h3{font:700 14px/1.2 var(--font);letter-spacing:.2em;color:var(--orange)}
.cmp li{font-size:20px;color:var(--navy)}
/* rows */
.rw>div{background:#fff;border:1px solid rgba(21,35,59,.08);border-radius:14px;box-shadow:var(--card-shadow);font-size:20px;color:var(--navy);transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.rw>div:nth-child(odd){background:#fff}
.rw>div:nth-child(even){background:var(--cream);box-shadow:none}
.rw .a{color:var(--orange-deep)}
.rw.ans>div{box-shadow:none;border-radius:0;border-bottom:1px solid rgba(21,35,59,.08)!important}
.rw.ans .a{color:var(--navy)}
/* closing contact cards (dark) */
.cl>div{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:18px;font-size:20px;color:#fff;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .35s var(--ease),border-color .35s var(--ease),background .35s var(--ease)}
.cl b{font:700 14px/1.2 var(--font);letter-spacing:.2em;color:var(--orange)}
/* vote cards */
.vt .k{font-family:var(--serif);font-weight:600;color:var(--orange)}
.vt .t{font-size:22px;color:var(--navy)}.vt .vn{font-size:18px}
.vt .vb{background:linear-gradient(90deg,var(--orange),var(--gold))}
.vt>div.lead{box-shadow:0 0 0 2px var(--orange),var(--card-shadow-hi)}
/* aside picture card */
.asd figure{padding:28px}
.asd figcaption span{font-size:18px;color:var(--ink-soft);line-height:1.45}
.asd figcaption span:first-child{color:var(--navy)}
.asd figcaption span:nth-child(2){color:var(--orange-deep)}
/* prompt panel */
.pr{background:var(--navy-deep);color:#e9edf5;border-radius:18px;font-size:18px;box-shadow:0 30px 60px -34px rgba(15,26,46,.8);border:1px solid rgba(255,255,255,.06)}
/* demo map and chapter rows */
.cc .n,.rq .id{color:var(--orange);font-family:var(--serif)}
.cc .t{font-family:var(--serif);font-weight:600;color:var(--navy)}
.rq .qt{color:var(--navy)}
.go.live{background:var(--orange)}
.chn{background:var(--navy);font-family:var(--serif);border-radius:20px}
.badge{background:var(--orange);border-radius:10px;font-weight:700;letter-spacing:.18em}

/* icon tiles: 56px, orange gradient, white 1.75px line icon */
.theme-tile{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;flex:none;color:#fff;background:var(--tile-grad);
  box-shadow:0 10px 22px -12px rgba(196,74,6,.75),inset 0 1px 0 rgba(255,255,255,.22)}
.theme-tile svg{width:28px;height:28px;display:block}
.theme-tile.sm{width:44px;height:44px;border-radius:12px}.theme-tile.sm svg{width:22px;height:22px}
.theme-ico{display:inline-block;width:24px;height:24px;vertical-align:middle}
.theme-ico svg{width:100%;height:100%;display:block}
/* buttons */
.theme-btn{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:10px;border:1.5px solid var(--orange);background:var(--orange);color:#fff;
  font:600 17px/1 var(--font);cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .25s var(--ease)}
.theme-btn:hover{transform:translateX(4px);box-shadow:0 12px 26px -14px rgba(226,92,15,.8)}
.theme-btn:active{transform:translateX(4px) scale(.97)}
.theme-btn.ghost{background:transparent;color:var(--navy);border-color:rgba(21,35,59,.28)}
.theme-btn.ghost:hover{border-color:var(--orange);color:var(--orange-deep);box-shadow:none}
.scene.dark .theme-btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)}
/* pill label (for example "AI ASSISTANT") */
.theme-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;font:700 12px/1 var(--font);letter-spacing:.18em;text-transform:uppercase;
  color:var(--orange-deep);background:rgba(226,92,15,.09);border:1px solid rgba(226,92,15,.22)}
.scene.dark .theme-pill{color:var(--gold);background:rgba(231,162,60,.1);border-color:rgba(231,162,60,.3)}
/* portrait: circle crop with a 2px orange ring */
.theme-face{border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--orange),0 12px 30px -16px rgba(15,26,46,.6)}

/* chrome: navy bar, Public Sans */
#chrome{background:linear-gradient(180deg,var(--navy-deep),#0b1424);border-top:1px solid rgba(255,255,255,.06);font-family:var(--font);gap:12px}
#chrome .who{color:rgba(255,255,255,.62);font-weight:500;letter-spacing:.01em}
#chrome button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:9px;font:600 13px var(--font);color:#fff;transition:background .2s,border-color .2s}
#chrome button:hover{background:rgba(226,92,15,.18);border-color:rgba(226,92,15,.5)}
#cnt{font-family:var(--font)}#cnt b{color:var(--gold)}
#bar{background:var(--orange)}
kbd{font-family:var(--font)}
.ovl{background:rgba(15,26,46,.95);font-family:var(--font)}
.ovl h4{color:var(--orange);letter-spacing:.22em}
#gr .th{border-color:rgba(255,255,255,.12);transition:border-color .2s,background .2s}
#gr .th:hover{border-color:rgba(226,92,15,.55)}
#gr .th.cur{border-color:var(--orange);background:rgba(226,92,15,.1)}
#nb li.todo{color:var(--gold)}

/* ===== background system on #stage: dark, light and section registers ===== */
#theme-bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;border-radius:inherit}
.theme-reg{position:absolute;inset:0;opacity:0;overflow:hidden;transition:opacity .6s var(--ease)}
#stage[data-reg="dark"] .theme-rdark,#stage[data-reg="light"] .theme-rlight,#stage[data-reg="section"] .theme-rsection{opacity:1}
#stage:not([data-reg="dark"]) .theme-rdark *,#stage:not([data-reg="light"]) .theme-rlight *,#stage:not([data-reg="section"]) .theme-rsection *{animation-play-state:paused}
#theme-bg.theme-paused *{animation-play-state:paused!important}
.theme-reg>i,.theme-par>i{position:absolute;display:block}
.theme-grain{inset:0;background-image:var(--theme-grain);background-size:240px 240px;opacity:.06;animation:theme-grain 1s steps(6) infinite}
@keyframes theme-grain{from{background-position:0 0}to{background-position:-156px 318px}}

/* dark */
.theme-rdark{background:linear-gradient(160deg,#15233b 0%,#0f1a2e 100%)}
.theme-rdark .theme-grid{inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:48px 48px;background-position:-1px -1px;
  -webkit-mask-image:radial-gradient(1000px 640px at 72% 42%,#000 0%,rgba(0,0,0,.5) 40%,transparent 76%);mask-image:radial-gradient(1000px 640px at 72% 42%,#000 0%,rgba(0,0,0,.5) 40%,transparent 76%)}
.theme-par{position:absolute;inset:0;will-change:translate}
.theme-rdark .theme-glow{width:1400px;height:1400px;right:-560px;top:-760px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(240,122,42,.26) 0%,rgba(226,92,15,.14) 34%,rgba(231,162,60,.05) 60%,transparent 100%);mix-blend-mode:screen;
  animation:theme-drift 40s ease-in-out infinite alternate}
.theme-rdark .theme-glow2{width:900px;height:900px;left:-420px;bottom:-560px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(29,49,85,.9),transparent);opacity:.8}
@keyframes theme-drift{0%{transform:translate(0,0)}50%{transform:translate(-90px,26px)}100%{transform:translate(-160px,8px)}}
.theme-orbits{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.theme-orbits circle{fill:none}
.theme-orbits .theme-o1{stroke:rgba(255,255,255,.10);stroke-width:1}
.theme-orbits .theme-o2{stroke:rgba(255,255,255,.08);stroke-width:1}
.theme-orbits .theme-o3{stroke:rgba(255,255,255,.06);stroke-width:1}
.theme-orbits .theme-o4{stroke:rgba(255,255,255,.09);stroke-width:1;stroke-dasharray:2 10}
.theme-orbits .theme-spin{transform-box:view-box;transform-origin:1080px 400px;animation:theme-spin 120s linear infinite}
.theme-orbits .theme-sat{transform-box:view-box;transform-origin:1080px 400px;animation:theme-spin 60s linear infinite}
.theme-orbits .theme-dot{fill:var(--orange)}
.theme-orbits .theme-halo{fill:rgba(226,92,15,.22)}
.theme-orbits .theme-trail{stroke:url(#theme-trailg);stroke-width:1.5;fill:none;stroke-linecap:round}
@keyframes theme-spin{to{transform:rotate(360deg)}}

/* light */
.theme-rlight{background:var(--paper)}
.theme-rlight .theme-grain{opacity:.06;mix-blend-mode:multiply}
.theme-rlight .theme-dots{inset:0;background-image:radial-gradient(rgba(21,35,59,.10) 1px,transparent 1.4px);background-size:24px 24px;
  -webkit-mask-image:radial-gradient(760px 520px at 92% 8%,#000 0%,transparent 72%);mask-image:radial-gradient(760px 520px at 92% 8%,#000 0%,transparent 72%)}
.theme-rlight .theme-lglow{width:1200px;height:1200px;left:-560px;bottom:-700px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(226,92,15,.09),rgba(231,162,60,.04) 55%,transparent);animation:theme-ldrift 22s ease-in-out infinite alternate}
.theme-rlight .theme-lglow2{width:900px;height:900px;right:-380px;top:-520px;border-radius:50%;background:radial-gradient(closest-side,rgba(244,239,229,.9),transparent)}
@keyframes theme-ldrift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(120px,-18px) scale(1.06)}}
.theme-arcs{position:absolute;inset:0;width:100%;height:100%}
.theme-arcs path{fill:none;stroke:var(--orange);stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:0}
.theme-arcs .theme-arc{stroke-width:1.5;opacity:.18}
.theme-arcs .theme-arc2{stroke-width:1;opacity:.09}
.theme-rlight.theme-go .theme-arc{animation:theme-arcdraw 1.6s var(--ease-out) both,theme-breathe 9s 1.6s ease-in-out infinite alternate}
.theme-rlight.theme-go .theme-arc2{animation:theme-arcdraw 1.9s .15s var(--ease-out) both,theme-breathe 11s 2s ease-in-out infinite alternate}
@keyframes theme-arcdraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes theme-breathe{from{stroke-dashoffset:0}to{stroke-dashoffset:.06}}
/* a slow satellite rides the arc from the bottom edge out through the right edge, as on the dark register */
.theme-arcs .theme-lsat{offset-path:path("M560 846 C 860 770, 1160 600, 1470 250");offset-rotate:0deg;offset-distance:0%;opacity:0}
.theme-arcs .theme-ldot{fill:var(--orange)}
.theme-arcs .theme-lhalo{fill:rgba(226,92,15,.16)}
.theme-rlight.theme-go .theme-lsat{animation:theme-lsat 26s linear 1.4s infinite}
@keyframes theme-lsat{0%{offset-distance:0%;opacity:0}8%{opacity:.9}92%{opacity:.9}100%{offset-distance:100%;opacity:0}}

/* section (photo) */
.theme-rsection{background:var(--navy-deep)}
.theme-rsection .theme-photo{inset:-3%;background:var(--navy-deep);transform:scale(1.04)}
.theme-rsection.theme-go .theme-photo{animation:theme-rack 1.4s var(--ease-out) both,theme-kb 32s 1.4s ease-in-out infinite alternate}
@keyframes theme-rack{from{filter:blur(14px);transform:scale(1.12)}to{filter:blur(0);transform:scale(1.04)}}
@keyframes theme-kb{from{transform:scale(1.04) translateX(0)}to{transform:scale(1.1) translateX(-28px)}}
.theme-rsection .theme-shade{inset:0;background:linear-gradient(90deg,rgba(21,35,59,.85) 0%,rgba(21,35,59,.6) 50%,rgba(21,35,59,.35) 100%),
  linear-gradient(0deg,rgba(15,26,46,.55),transparent 40%)}
.theme-rsection .theme-grain{opacity:.05}

@media (prefers-reduced-motion:reduce){#theme-bg *{animation:none!important}.theme-par{translate:none!important}}
@media print{
  #theme-bg{display:none!important}
  .scene{background:var(--paper)!important}
  .scene.dark{background:linear-gradient(160deg,#15233b,#0f1a2e)!important}
}

/* ==== part: _engine ==== */
/* ===== _engine: build steps, wipe transition, FX kit, typewriter caret, presenter tools, progress bar ===== */
/* build steps: hidden until revealed; a stagger entrance never overrides the hidden state */
.step{opacity:0;transform:translateX(-18px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.step.step-on{opacity:1;transform:none}
/* edge zones step aside while the pointer is over a slide clickable (see 4g) */
body.zone-hot .zone{pointer-events:none}
#stage .stagger>.step{animation:none}
#who ._engine-sep{display:inline-block;width:1px;height:12px;margin:0 10px;vertical-align:-1px;background:rgba(255,255,255,.3)}
/* arrival: the build state is set with transitions held, so nothing collapses or slides back under the wipe */
#stage .scene._engine-snap *,#stage .scene._engine-snap *::before,#stage .scene._engine-snap *::after{transition:none!important}

/* wipe transition: the incoming scene is revealed left to right, the outgoing one fades under it */
#stage .scene.on{z-index:2}
#stage .scene.was{z-index:1;visibility:visible;opacity:0;transition:none;animation:_engine-out .3s ease both}
#stage .scene._engine-in{transition:none;opacity:1;visibility:visible;animation:_engine-wipe .65s cubic-bezier(.77,0,.18,1) both}
@keyframes _engine-wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes _engine-out{from{opacity:1}to{opacity:0}}
#wipe{position:absolute;top:0;bottom:0;left:0;width:3px;z-index:36;pointer-events:none;opacity:0;
  background:var(--gold,#e7a23c);box-shadow:0 0 30px 6px color-mix(in srgb,var(--orange,#e25c0f) 70%,transparent),0 0 8px var(--gold,#e7a23c)}
#wipe._engine-go{animation:_engine-edge .65s cubic-bezier(.77,0,.18,1) both}
@keyframes _engine-edge{0%{opacity:1;transform:translateX(0)}88%{opacity:1}100%{opacity:0;transform:translateX(1440px)}}

/* FX canvas */
#fx{position:absolute;left:0;top:0;width:1440px;height:810px;z-index:50;pointer-events:none;display:none}
#fx._engine-live{display:block}

/* FX.shutter: a six-blade iris plus one soft flash */
._engine-iris{position:absolute;inset:0;z-index:57;pointer-events:none}
._engine-iris svg{display:block;width:100%;height:100%}
._engine-iris rect{fill:var(--navy-deep,#0f1a2e);stroke:rgba(231,162,60,.35);stroke-width:1.5}
._engine-flash{position:absolute;inset:0;z-index:58;pointer-events:none;background:#fff;opacity:0}
._engine-flash._engine-go{animation:_engine-flash .24s linear both}
@keyframes _engine-flash{0%{opacity:0}40%{opacity:.85}100%{opacity:0}}

/* FX.sweep: one light pass, left to right */
.sweep{position:relative}
._engine-sw{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:inherit;z-index:3}
._engine-sw::before{content:"";position:absolute;top:-10%;bottom:-10%;left:0;width:40%;transform:translateX(-120%);
  background:linear-gradient(100deg,transparent 0%,rgba(231,162,60,.22) 35%,rgba(255,255,255,.62) 50%,rgba(231,162,60,.22) 65%,transparent 100%);
  animation:_engine-sweep .7s var(--ease) both}
@keyframes _engine-sweep{to{transform:translateX(320%)}}

/* typewriter caret */
.typing::after{content:"";display:inline-block;width:2px;height:1em;margin-left:3px;vertical-align:-.14em;
  background:var(--orange,#e25c0f);animation:_engine-caret 1s steps(1) infinite}
@keyframes _engine-caret{0%{opacity:1}50%{opacity:0}}

/* S spotlight and B blackout (presenter tools, inside the stage so they scale with it) */
._engine-spot{position:absolute;inset:0;z-index:55;pointer-events:none;opacity:0;transition:opacity .25s var(--ease);
  --x:720px;--y:405px;--r:180px;
  background:radial-gradient(circle var(--r) at var(--x) var(--y),transparent 0,transparent 72%,rgba(8,14,26,.8) 100%)}
._engine-spot._engine-on{opacity:1}
._engine-black{position:absolute;inset:0;z-index:59;pointer-events:none;opacity:0;transition:opacity .4s var(--ease);
  background:var(--navy-deep,#0f1a2e)}
._engine-black._engine-on{opacity:1;pointer-events:auto}

/* progress bar: a 2px orange line with a gold head, and a green spark when an item ticks */
#bar{height:2px;background:var(--orange,#e25c0f);overflow:visible}
#bar::after{content:"";position:absolute;right:-3px;top:-2px;width:14px;height:6px;border-radius:6px;
  background:linear-gradient(90deg,transparent,var(--gold,#e7a23c));box-shadow:0 0 10px 1px var(--gold,#e7a23c)}
._engine-spark{position:fixed;top:-3px;left:0;width:8px;height:8px;border-radius:50%;z-index:7;pointer-events:none;
  background:#1E7A3C;box-shadow:0 0 10px 3px rgba(30,122,60,.8),0 0 2px #fff}

@media print{
  .step{opacity:1!important;transform:none!important;transition:none!important}
  #wipe,#fx,._engine-iris,._engine-flash,._engine-spot,._engine-black,._engine-spark,._engine-sw{display:none!important}
  #stage .scene.was,#stage .scene._engine-in{animation:none!important;clip-path:none!important}
  .typing::after{display:none}
}

/* ==== part: showA ==== */
/* ===========================================================================
   showA: cover, section, closing and quote renderers, the QR scan on the
   connect slide, the Q giant QR overlay, and the global interactions.
   =========================================================================== */

/* ---- cover ---- */
#stage .t-cover{justify-content:center}
.showA-cov{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:48px;align-items:center;height:100%}

.on .showA-w>span{animation:showA-wIn .9s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0) * 110ms + 120ms)}

.showA-art{position:relative;width:460px;height:460px;display:grid;place-items:center;cursor:pointer;border-radius:50%}
.showA-glow{position:absolute;inset:-40px;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(226,92,15,.34),rgba(231,162,60,.10) 55%,transparent 72%)}
.on .showA-glow{animation:showA-breathe 8s ease-in-out infinite alternate}
@keyframes showA-breathe{from{opacity:.55}to{opacity:1}}
.showA-orb{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}

.showA-r1{stroke:rgba(255,255,255,.10);stroke-width:1}
.showA-r2{stroke:rgba(255,255,255,.16);stroke-width:1;stroke-dasharray:2 7;transform-origin:230px 230px}

.showA-sat{transform-origin:230px 230px}
.showA-sat circle{fill:var(--orange,#e25c0f);filter:drop-shadow(0 0 6px rgba(226,92,15,.9))}
.on .showA-sat{animation:showA-spin 60s linear infinite}
@keyframes showA-spin{to{transform:rotate(360deg)}}
.showA-arc{stroke:var(--orange,#e25c0f);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:24 76;stroke-dashoffset:0;
  transform-origin:230px 230px;transform:rotate(-90deg);filter:drop-shadow(0 0 8px rgba(226,92,15,.6))}
.on .showA-arc{animation:showA-arc 1.4s cubic-bezier(.65,0,.35,1) .25s both}
@keyframes showA-arc{from{stroke-dashoffset:100;opacity:0}12%{opacity:1}to{stroke-dashoffset:0;opacity:1}}
.showA-logo{position:relative;width:292px;height:auto;display:block;transition:scale .35s var(--ease)}
.showA-art:hover .showA-logo{scale:1.02}
.on .showA-logo{animation:showA-fade .9s var(--ease) .15s both}
@keyframes showA-fade{from{opacity:0}to{opacity:1}}

/* ---- section ---- */
#stage .t-section{justify-content:center}
.showA-sec{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
  padding:64px 80px 56px;cursor:pointer}

.on .showA-secH{animation:showA-print 1.1s cubic-bezier(.45,0,.25,1) 60ms both}
@keyframes showA-print{from{clip-path:inset(-.3em 100% -.35em -.2em);letter-spacing:.12em}

@keyframes showA-streak{0%{left:0;opacity:0}8%{opacity:1}86%{opacity:1}100%{left:100%;opacity:0}}
.showA-sec .showA-rule{width:220px;margin-top:34px}

#stage .t-closing{justify-content:center}

  box-shadow:0 0 34px rgba(226,92,15,.35);opacity:0;pointer-events:none}
.on .showA-qrcard:is(.step-on,:not(.step))::after{animation:showA-halo 3.2s ease-in-out 1.1s infinite alternate}
@keyframes showA-halo{from{opacity:.12}to{opacity:.9}}
.showA-qrbox{position:relative;overflow:hidden;border-radius:6px}
.showA-qrimg{display:block;width:320px;height:320px;image-rendering:pixelated}
.on .showA-qrcard:is(.step-on,:not(.step)) .showA-qrimg,.showA-big.open .showA-qrimg{animation:showA-qrp .9s steps(33,end) .12s both}
@keyframes showA-qrp{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.showA-scan{position:absolute;top:-6px;bottom:-6px;left:0;width:3px;background:var(--gold,#e7a23c);opacity:0;pointer-events:none;
  box-shadow:0 0 14px 3px rgba(231,162,60,.8)}
.on .showA-qrcard:is(.step-on,:not(.step)) .showA-scan,.showA-big.open .showA-scan{animation:showA-scanx 1.05s linear .12s both}
@keyframes showA-scanx{0%{left:0;opacity:1}86%{left:calc(100% - 3px);opacity:1}100%{left:calc(100% - 3px);opacity:0}}

/* ---- quote ---- */
#stage .t-quote{justify-content:center}

.showA-qm{font-family:var(--serif,'Fraunces',Georgia,serif);font-style:italic;font-weight:600;font-size:170px;line-height:.62;height:78px;

/* ---- connect: the QR scan ---- */
/* the text column sits right under the title (no void above it), and every line answers a click with a light sweep */
#stage .t-statement .asd.showA-cnx{align-items:start;margin-top:32px}

@media (prefers-reduced-motion:reduce){

  background:linear-gradient(90deg,var(--orange,#e25c0f),var(--gold,#e7a23c));box-shadow:0 0 18px -4px rgba(231,162,60,.7);
  transform:scaleX(1);transition:transform .9s cubic-bezier(.3,1.3,.45,1)}
.showB-mt[data-i="1"] .showB-fl{transition-delay:.25s}
.showB-mt.showB-z .showB-fl{transform:scaleX(0);background:#B32A2A;box-shadow:none;
  transition:transform 1.4s cubic-bezier(.4,0,.2,1) .5s,background .9s linear .9s}
.showB-mt.showB-z .showB-ml{color:#B32A2A}
.t-intern:has(.showB-m-t.step:not(.step-on)) .showB-fl{transform:scaleX(0);transition:none}
.t-intern:has(.showB-m-t.step:not(.step-on)) .showB-mt.showB-z .showB-fl{transform:scaleX(1);background:linear-gradient(90deg,var(--orange,#e25c0f),var(--gold,#e7a23c))}
.t-intern:has(.showB-m-t.step:not(.step-on)) .showB-mt.showB-z .showB-ml{color:var(--ink)}
.showB-mt.showB-rs .showB-fl{transform:scaleX(0)!important;transition:none!important}
.showB-mt.showB-z.showB-rs .showB-fl{transform:scaleX(1)!important;background:linear-gradient(90deg,var(--orange,#e25c0f),var(--gold,#e7a23c))!important}
.t-intern.on:not(:has(.showB-m-t.step:not(.step-on))) .showB-z .showB-tr,.showB-z.showB-fk .showB-tr{animation:showB-flick .75s steps(1) 1.95s both}
@keyframes showB-flick{0%,33%,66%{box-shadow:inset 0 0 0 2px #B32A2A;background:rgba(179,42,42,.14)}16%,50%,83%{box-shadow:none;background:rgba(21,35,59,.08)}100%{box-shadow:inset 0 0 0 1.5px rgba(179,42,42,.35);background:rgba(179,42,42,.10)}}
.t-intern .showB-band{margin-top:28px;margin-right:40px;padding:24px 32px;border-radius:14px;background:var(--navy,#15233b);color:#fff;
  font:600 22px/1.4 var(--font);text-align:center;clip-path:inset(0 0 0 0);transition:clip-path .8s cubic-bezier(.77,0,.18,1)}
.showB-band.step{opacity:1;transform:none;clip-path:inset(0 100% 0 0)}
.showB-band.step.step-on{clip-path:inset(0 0 0 0);transition:clip-path .8s cubic-bezier(.77,0,.18,1)}

/* ---- powers ---- */
.t-powers .showB-pb{flex:1;min-height:0;margin-top:44px;display:flex;flex-direction:column}
.showB-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;position:relative}
.showB-pc{position:relative;background:#fff;border:1px solid rgba(21,35,59,.08);border-radius:18px;padding:22px 26px 26px;cursor:pointer;
  box-shadow:0 1px 2px rgba(21,35,59,.05),0 18px 40px -28px rgba(21,35,59,.35);
  transition:transform .6s cubic-bezier(.2,1.25,.3,1),opacity .5s var(--ease),box-shadow .35s var(--ease),filter .5s var(--ease)}
.showB-pc:hover{box-shadow:0 1px 2px rgba(21,35,59,.05),0 30px 60px -36px rgba(21,35,59,.45),0 0 0 4px rgba(226,92,15,.08);translate:4px 0}
.showB-pc.step{opacity:.7;filter:saturate(.35);transform:rotate(var(--r)) translate(var(--dx),var(--dy))}
.showB-pc.step.step-on{transform:none;opacity:1;filter:none;box-shadow:0 1px 2px rgba(21,35,59,.05),0 26px 50px -30px rgba(226,92,15,.55),0 0 0 1.5px rgba(226,92,15,.35)}
.t-powers:has(.showB-p-t.step:not(.step-on)) .showB-pc.step-on{transform:rotate(var(--r)) translate(var(--dx),var(--dy))}
.t-powers:has(.showB-p-t.step:not(.step-on)) .showB-pc.step-on{animation:showB-ign .7s var(--ease)}
@keyframes showB-ign{0%{box-shadow:0 0 0 0 rgba(231,162,60,.7)}100%{box-shadow:0 0 0 18px rgba(231,162,60,0)}}
.showB-row[data-spot] .showB-pc{opacity:.35}
.showB-row[data-spot="1"] .showB-pc[data-k="1"],.showB-row[data-spot="2"] .showB-pc[data-k="2"],.showB-row[data-spot="3"] .showB-pc[data-k="3"]{opacity:1;scale:1.04;z-index:2}
.showB-vg{display:block;width:100%;height:150px;margin-bottom:18px;border-radius:12px;background:var(--cream,#f4efe5);overflow:visible}
.showB-pt{display:flex;align-items:center;gap:16px}
.showB-it{flex:none;width:56px;height:56px;border-radius:14px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,#f07a2a,#e25c0f 55%,#c44a06);box-shadow:0 10px 22px -12px rgba(196,74,6,.8)}
.showB-it svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.showB-pc h2{font:700 34px/1.1 var(--serif,Georgia,serif);letter-spacing:-.01em;color:var(--ink);margin:0}
.showB-pc p{font-size:21px;line-height:1.45;color:var(--ink-2);margin:16px 0 0}
/* vignettes: final state by default, animation plays when the card is live */
.showB-vg .g{fill:rgba(21,35,59,.14)}
.showB-vg .gd{fill:var(--gold,#e7a23c);opacity:.85}
.showB-vg .ln{stroke:var(--gold,#e7a23c);stroke-width:2.5}
.showB-vg .ink{fill:none;stroke:var(--orange,#e25c0f);stroke-width:3;stroke-linecap:round}
.showB-vg .ed{stroke:rgba(21,35,59,.35);stroke-width:2}
.showB-vg .nd{fill:#fff;stroke:var(--orange,#e25c0f);stroke-width:2.5}
.showB-vg .rg{fill:none;stroke:var(--gold,#e7a23c);stroke-width:1.5;opacity:0}
.showB-vg .gd{transform-box:fill-box;transform-origin:left center}
.showB-vg .nd,.showB-vg .rg{transform-box:fill-box;transform-origin:center}
.showB-pc.step:not(.step-on) .showB-vg *{animation:none!important}
.showB-pc.step:not(.step-on) .showB-vg .gd,.showB-pc.step:not(.step-on) .showB-vg .ln{opacity:0}
/* waiting cards keep their drawn vignette (muted by the card), so no thumbnail is blank; igniting redraws it */
.showB-pc.step:not(.step-on) .showB-vg .nib{opacity:0}
.t-powers.on .showB-vg .gd{animation:showB-gfill .5s linear both .1s}
.t-powers.on .showB-vg .ln{animation:showB-scan 1.2s linear both .1s}
@keyframes showB-gfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes showB-scan{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(100px);opacity:0}}
.showB-vg .ink,.showB-vg .ed{stroke-dasharray:1 1;stroke-dashoffset:0}
.t-powers.on .showB-vg .ink{animation:showB-draw 1.3s cubic-bezier(.4,0,.3,1) both .15s}
.t-powers.on .showB-vg .wb{animation:showB-fade .4s var(--ease) both;animation-delay:calc(.35s + var(--i) * .3s)}
.t-powers.on .showB-vg .nib{offset-path:path("M 20 58 C 55 20, 80 96, 120 58 S 190 22, 236 56");offset-rotate:0deg;animation:showB-nib 1.3s cubic-bezier(.4,0,.3,1) both .15s}
@keyframes showB-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes showB-fade{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes showB-nib{0%{offset-distance:0%;opacity:1}92%{opacity:1}100%{offset-distance:100%;opacity:0}}
.showB-vg .nib{opacity:0}
.t-powers.on .showB-vg .nd{animation:showB-pop .38s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(.1s + var(--i) * .16s)}
.t-powers.on .showB-vg .rg{animation:showB-ring .7s var(--ease) both;animation-delay:calc(.1s + var(--i) * .16s)}
.t-powers.on .showB-vg .ed{animation:showB-draw .4s var(--ease) both;animation-delay:calc(.9s + var(--i) * .12s)}
@keyframes showB-pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes showB-ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
.showB-pc.showB-rp .showB-vg *{animation:none!important}
/* direction arrow + hl */
.showB-arw{display:block;width:100%;height:44px;margin-top:26px;overflow:visible}
.showB-arw path{fill:none;stroke:var(--orange,#e25c0f);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:0;
  transition:stroke-dashoffset .8s cubic-bezier(.6,0,.2,1)}
.showB-arw .hd{transition-delay:.7s;transition-duration:.25s}
.showB-arw.step{opacity:1;transform:none}
.showB-arw.step:not(.step-on) path{stroke-dashoffset:1;transition:none}
.t-powers .showB-hl{font:600 40px/1.25 var(--serif,Georgia,serif);color:var(--ink);margin:10px 0 0;letter-spacing:-.01em}
.showB-you{position:relative;display:inline-block;color:var(--orange,#e25c0f);font-style:italic}
.showB-you svg{position:absolute;left:-4%;bottom:-10px;width:108%;height:14px;overflow:visible}
.showB-you path{fill:none;stroke:var(--orange,#e25c0f);stroke-width:3;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:0;transition:stroke-dashoffset .6s var(--ease) .9s}
.showB-hl.step:not(.step-on) .showB-you path{stroke-dashoffset:1;transition:none}
.showB-hl.step.step-on{transition-delay:.45s}

/* ---- brain ---- */
.t-brain .showB-bw{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:48px}
.t-brain .showB-bl{display:flex;flex-direction:column;min-width:0}
.showB-chips{margin-top:44px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 20px}
.showB-chip{position:relative;background:#fff;border:1px solid rgba(21,35,59,.08);border-radius:16px;padding:24px 60px 24px 24px;cursor:pointer;
  box-shadow:0 1px 2px rgba(21,35,59,.05),0 18px 40px -28px rgba(21,35,59,.35);transition:transform .25s var(--ease),box-shadow .3s,background .4s}
.showB-chip:hover{transform:translateX(4px);box-shadow:0 1px 2px rgba(21,35,59,.05),0 26px 50px -30px rgba(21,35,59,.45),0 0 0 4px rgba(226,92,15,.07)}
.showB-chip b{display:block;font:600 21px/1.2 var(--serif,Georgia,serif);color:var(--ink)}
.showB-chip span{display:block;font-size:18px;line-height:1.35;color:var(--ink-2);margin-top:6px}
.showB-chip b,.showB-chip span{transition:opacity .45s var(--ease) .3s}
.showB-chip.step{opacity:1;transform:none}
.showB-chip.step:hover{transform:translateX(4px)}
/* loaded: his words keep full contrast; the green tick, a warm border and an orange left rule say it is in her brain */
.showB-chip::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--orange,#e25c0f);
  opacity:0;transition:opacity .45s var(--ease) .3s}
.showB-chip:not(.step),.showB-chip.step-on{border-color:rgba(226,92,15,.3)}
.showB-chip:not(.step)::before,.showB-chip.step-on::before{opacity:1}
.showB-chip.step:not(.step-on) b,.showB-chip.step:not(.step-on) span{transition:none}
.showB-tk{position:absolute;right:18px;top:50%;width:28px;height:28px;margin-top:-14px;border-radius:50%;background:#1E7A3C;display:grid;place-items:center;
  transform:scale(1);transition:transform .35s cubic-bezier(.2,1.6,.4,1) .55s}
.showB-tk svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.showB-chip.step:not(.step-on) .showB-tk{transform:scale(0);transition:none}
.showB-ghost{position:absolute;z-index:30;pointer-events:none;margin:0;box-shadow:0 20px 40px -18px rgba(226,92,15,.6),0 0 0 2px rgba(226,92,15,.5)!important;background:#fff!important}
.showB-ghost b,.showB-ghost span{opacity:1!important}
/* the ring */
.showB-br{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-bottom:10px}
.showB-rw{position:relative;width:400px;height:400px;flex:none}
.showB-ring{position:absolute;inset:0;width:400px;height:400px;overflow:visible}
.showB-ring .bg{fill:none;stroke:rgba(21,35,59,.10);stroke-width:14}
.showB-ring .ar{fill:none;stroke:var(--orange,#e25c0f);stroke-width:14;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:0;
  transition:stroke-dashoffset .55s var(--ease) .55s}
.showB-ring .ar:nth-of-type(even){stroke:#ec7a2c}
.showB-por{position:absolute;left:90px;top:90px;width:220px;height:220px;border-radius:50%;overflow:hidden;
  box-shadow:0 0 0 2px var(--orange,#e25c0f),0 0 0 8px rgba(226,92,15,.08),0 24px 50px -24px rgba(21,35,59,.5);transition:box-shadow .9s var(--ease)}
.showB-por img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
.showB-rip{position:absolute;left:90px;top:90px;width:220px;height:220px;border-radius:50%;pointer-events:none;
  box-shadow:0 0 0 3px var(--gold,#e7a23c);opacity:0}
.showB-rip.go{animation:showB-rip .75s var(--ease)}
@keyframes showB-rip{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}
.showB-nm{font:700 34px/1 var(--serif,Georgia,serif);color:var(--ink);letter-spacing:-.01em;margin-top:6px}
.showB-pill{font:700 12px/1 var(--font);letter-spacing:.2em;text-transform:uppercase;color:var(--orange,#e25c0f);
  border:1.5px solid rgba(226,92,15,.45);border-radius:999px;padding:8px 14px;background:rgba(226,92,15,.05)}
.t-brain .sub .showB-ul{background:linear-gradient(90deg,var(--orange,#e25c0f),var(--gold,#e7a23c)) no-repeat 0 100%/0% 3px;padding-bottom:4px;
  transition:background-size .9s var(--ease) .9s}
.t-brain:not(:has(.showB-chip.step:not(.step-on))) .sub .showB-ul{background-size:100% 3px}
.t-brain:not(:has(.showB-chip.step:not(.step-on))) .showB-por{box-shadow:0 0 0 2px var(--orange,#e25c0f),0 0 60px 6px rgba(231,162,60,.45),0 24px 50px -24px rgba(21,35,59,.5)}
.t-brain.on:not(:has(.showB-chip.step:not(.step-on))) .showB-ring{animation:showB-spin 1.2s cubic-bezier(.6,0,.2,1) .9s both}
@keyframes showB-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.t-brain:has(.showB-chip[data-k="0"].step:not(.step-on)) .showB-ring .ar[data-k="0"]{stroke-dashoffset:1;transition:none}
.t-brain:has(.showB-chip[data-k="1"].step:not(.step-on)) .showB-ring .ar[data-k="1"]{stroke-dashoffset:1;transition:none}
.t-brain:has(.showB-chip[data-k="2"].step:not(.step-on)) .showB-ring .ar[data-k="2"]{stroke-dashoffset:1;transition:none}
.t-brain:has(.showB-chip[data-k="3"].step:not(.step-on)) .showB-ring .ar[data-k="3"]{stroke-dashoffset:1;transition:none}
.t-brain:has(.showB-chip[data-k="4"].step:not(.step-on)) .showB-ring .ar[data-k="4"]{stroke-dashoffset:1;transition:none}
.t-brain:has(.showB-chip[data-k="5"].step:not(.step-on)) .showB-ring .ar[data-k="5"]{stroke-dashoffset:1;transition:none}
.showB-chip.showB-ld{outline:none}
@media print{.showB-ghost,.showB-rip{display:none}.showB-ring{animation:none!important}}

/* ==== part: showC ==== */
/* ===== showC: stamps (slide 9) and flip (slides 11, 14, 15) ===== */
.t-stamps h1,.t-flip h1{max-width:none}
.t-stamps .body{margin-top:34px;justify-content:center;padding-bottom:40px}

/* stamps: question rows with an answer slot */
.showC-rows{display:flex;flex-direction:column;gap:22px;max-width:1180px}
.showC-row{position:relative;display:grid;grid-template-columns:52px 1fr 190px;align-items:center;gap:22px;min-height:118px;
  padding:14px 18px 14px 26px;background:#fff;border:1px solid rgba(21,35,59,.08);border-radius:18px;cursor:pointer;
  box-shadow:0 1px 2px rgba(21,35,59,.05),0 18px 40px -28px rgba(21,35,59,.35);
  transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.showC-row:hover{transform:translateX(4px);box-shadow:0 1px 2px rgba(21,35,59,.05),0 30px 60px -36px rgba(21,35,59,.45),0 0 0 4px rgba(226,92,15,.08)}
.showC-row:active{transform:translateX(4px) scale(.992)}
.showC-n{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--orange,#e25c0f);color:var(--orange,#e25c0f);
  display:grid;place-items:center;font:600 20px/1 var(--serif,Georgia,serif)}
.showC-q{font-size:24px;line-height:1.35;font-weight:500;color:var(--ink)}
.showC-slot{position:relative;height:76px;border-radius:12px;border:1.5px dashed rgba(21,35,59,.16);display:grid;place-items:center}
.showC-slot:has(.showC-stamp.step:not(.step-on)){border-color:transparent}
.showC-stamp{display:inline-block;font:italic 700 44px/1 var(--serif,Georgia,serif);color:var(--orange-deep,#c44a06);
  border:3px solid var(--orange-deep,#c44a06);border-radius:10px;padding:6px 18px 8px;transform:rotate(-5deg);
  background:rgba(251,248,242,.6);cursor:pointer;transition:opacity .5s var(--ease),box-shadow .3s var(--ease)}
.showC-stamp:hover{box-shadow:0 0 0 6px rgba(226,92,15,.12)}
.showC-stamp.step{transition:opacity .5s var(--ease);transform:rotate(-5deg)}
.showC-stamp.step:not(.step-on){opacity:0}
.showC-stamp.step.step-on{opacity:1;transform:rotate(-5deg)}
.showC-stamp.showC-slam{animation:showC-slam .26s both}
@keyframes showC-slam{
  0%{opacity:0;transform:scale(2.4) rotate(-12deg);animation-timing-function:cubic-bezier(.5,0,.75,0)}
  65%{opacity:1;transform:scale(1) rotate(-5deg);animation-timing-function:cubic-bezier(.2,.8,.2,1)}
  80%{transform:scale(1.04) rotate(-5deg)}
  100%{opacity:1;transform:scale(1) rotate(-5deg)}}
.showC-ring{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;
  border:2px solid var(--orange,#e25c0f);opacity:0;pointer-events:none;animation:showC-ring .6s var(--ease) both}
@keyframes showC-ring{from{opacity:.55;transform:scale(.4)}to{opacity:0;transform:scale(1.5)}}
.t-stamps .showC-hl{max-width:1120px;margin-top:30px;font-size:28px;line-height:1.35;font-weight:700;color:var(--ink)}
.showC-st:has(.showC-hl.step-on) .showC-stamp,.showC-st:has(.showC-hl:not(.step)) .showC-stamp{opacity:.6}
.showC-type::after{content:"";display:inline-block;width:2px;height:1em;margin-left:3px;vertical-align:-.12em;
  background:var(--orange,#e25c0f);animation:showC-caret 1s steps(1) infinite}
@keyframes showC-caret{50%{opacity:0}}

/* flip: kick row with the LIVE badge */
.showC-kr{display:flex;align-items:center;gap:18px;margin-bottom:14px}
.showC-kr .kick{margin:0}
.showC-live{display:inline-flex;align-items:center;gap:9px;padding:6px 14px 6px 12px;border-radius:999px;background:var(--navy,#15233b);
  color:#fff;font:700 16px/1 var(--font);letter-spacing:.16em}
.showC-live i{width:9px;height:9px;border-radius:50%;background:#B32A2A;box-shadow:0 0 0 3px rgba(179,42,42,.28);animation:showC-pulse 1.4s ease-in-out infinite}
@keyframes showC-pulse{50%{opacity:.25}}
.t-flip .body{margin-top:34px}

/* flip: the split */
.showC-fl{position:relative;display:grid;grid-template-columns:1fr 88px 1fr;column-gap:0;width:100%;max-width:1280px;overflow:hidden;border-radius:20px;
  box-shadow:0 1px 2px rgba(21,35,59,.05),0 24px 50px -34px rgba(21,35,59,.4)}
.showC-pane{grid-row:1/-1;border-radius:0;pointer-events:none}
.showC-pl{grid-column:1;background:var(--cream,#f4efe5)}
.showC-pr{grid-column:3;background:#fff;transition:opacity .7s var(--ease)}
.showC-gap{grid-column:2;grid-row:1/-1;background:linear-gradient(90deg,var(--cream,#f4efe5),#fff);pointer-events:none}
.showC-fl:not(:has(.showC-r:is(.step-on,:not(.step)))) .showC-pr{opacity:.55}
.showC-dv{grid-column:2;grid-row:1/-1;justify-self:center;width:1.5px;margin:18px 0;background:linear-gradient(rgba(21,35,59,.05),rgba(21,35,59,.22),rgba(21,35,59,.05));transform-origin:top}
.on .showC-dv{animation:showC-dv .7s var(--ease) .15s both}
@keyframes showC-dv{from{transform:scaleY(0)}to{transform:none}}
.showC-h{margin:0;padding:24px 30px 6px;font:700 18px/1.2 var(--font);letter-spacing:.14em;text-transform:uppercase;align-self:end;position:relative}
.showC-hl-l{grid-column:1;grid-row:1;color:#7d899c}
.showC-hr{grid-column:3;grid-row:1;color:var(--orange,#e25c0f)}
.showC-l,.showC-r{position:relative;display:grid;grid-template-columns:36px 1fr;gap:16px;align-items:center;padding:10px 30px;
  font-size:22px;line-height:1.38;cursor:pointer;transition:transform .35s var(--ease),opacity .6s var(--ease),filter .6s var(--ease),color .6s var(--ease)}
.showC-l{grid-column:1;color:#5d6a80}
.showC-r{grid-column:3;color:var(--ink)}
.showC-l:hover,.showC-r:hover{transform:translateX(4px)}
.showC-l:active,.showC-r:active{transform:translateX(4px) scale(.99)}
.showC-mk{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.showC-mk svg{width:18px;height:18px;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.showC-l .showC-mk{background:rgba(179,42,42,.09);border:1.5px solid rgba(179,42,42,.45)}
.showC-l .showC-mk svg{stroke:#B32A2A}
.showC-r .showC-mk{background:rgba(30,122,60,.09);border:1.5px solid rgba(30,122,60,.5);transition:background .5s var(--ease),border-color .5s var(--ease)}
.showC-r .showC-mk svg{stroke:#1E7A3C}
.showC-r .showC-mk path{stroke-dasharray:24;stroke-dashoffset:0;transition:stroke-dashoffset .45s var(--ease) .35s}
.showC-mk::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid currentColor;opacity:0;pointer-events:none}
.showC-l .showC-mk::after{color:#B32A2A}.showC-r .showC-mk::after{color:#1E7A3C}
.on .showC-l{animation:showC-lin .5s var(--ease) backwards;animation-delay:calc(.3s + var(--i) * .22s)}
.on .showC-l .showC-mk{animation:showC-xin .3s cubic-bezier(.5,0,.75,0) backwards;animation-delay:calc(.5s + var(--i) * .22s)}
.on .showC-l .showC-mk::after{animation:showC-ring2 .55s var(--ease) both;animation-delay:calc(.75s + var(--i) * .22s)}
@keyframes showC-lin{from{opacity:0;translate:-18px 0}to{opacity:1;translate:0 0}}
@keyframes showC-xin{from{opacity:0;transform:scale(2) rotate(-20deg)}to{opacity:1;transform:none}}
@keyframes showC-ring2{from{opacity:.6;transform:scale(.6)}to{opacity:0;transform:scale(1.6)}}
.showC-mk.showC-re{animation:showC-xin .3s cubic-bezier(.5,0,.75,0) both!important}
.showC-mk.showC-re::after{animation:showC-ring2 .55s var(--ease) .25s both!important}
/* right rows: dim until the brain loads */
.showC-r.step{transform:none}
.showC-r.step:not(.step-on){opacity:.5;filter:grayscale(1);color:#7d899c}
.showC-r.step:not(.step-on) .showC-mk{background:transparent;border-color:rgba(21,35,59,.18)}
.showC-r.step:not(.step-on) .showC-mk path{stroke-dashoffset:24;transition:none}
.showC-r.step.step-on:hover{transform:translateX(4px)}
.showC-r::before{content:"";position:absolute;inset:4px 14px;border-radius:12px;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,rgba(231,162,60,0),rgba(231,162,60,.28) 50%,rgba(226,92,15,0));background-size:220% 100%}
.showC-r.showC-flash::before{animation:showC-rsw .9s var(--ease) both}
@keyframes showC-rsw{0%{opacity:1;background-position:120% 0}70%{opacity:1}100%{opacity:0;background-position:-20% 0}}
.showC-per:has(.showC-r[data-i="0"]:is(.step-on,:not(.step))) .showC-l{filter:blur(.6px);opacity:.7}

/* connectors in the gap */
.showC-cn{grid-column:2;align-self:center;height:2px;margin:0 -8px;border-radius:2px;position:relative;
  background:linear-gradient(90deg,rgba(179,42,42,.35),var(--gold,#e7a23c),#1E7A3C);transform-origin:left;
  transition:transform .55s var(--ease) .45s,opacity .3s}
.showC-cn::before,.showC-cn::after{content:"";position:absolute;top:-3px;width:8px;height:8px;border-radius:50%}
.showC-cn::before{left:-2px;background:rgba(179,42,42,.6)}.showC-cn::after{right:-2px;background:#1E7A3C}
.showC-cn.step{opacity:1;transform:scaleX(0)}
.showC-cn.step.step-on{transform:scaleX(1)}

/* the beam */
.showC-beam{position:absolute;top:0;bottom:0;left:0;width:180px;pointer-events:none;opacity:0;z-index:3;
  background:linear-gradient(90deg,rgba(231,162,60,0),rgba(231,162,60,.22) 40%,rgba(226,92,15,.34) 62%,rgba(226,92,15,0));
  transform:translateX(-200px)}
.showC-beam::after{content:"";position:absolute;top:0;bottom:0;left:62%;width:2px;background:var(--gold,#e7a23c);box-shadow:0 0 18px 4px rgba(231,162,60,.55)}
.showC-beam.showC-go{animation:showC-beam 1.1s cubic-bezier(.45,0,.25,1) both}
@keyframes showC-beam{0%{opacity:0;transform:translateX(-200px)}12%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateX(1300px)}}

/* perRow: the paragraph block with three highlighter segments */
.showC-blk{grid-column:1;display:flex;flex-direction:column;gap:11px;padding:12px 30px 14px 82px;align-self:center}
.showC-bar{position:relative;height:9px;border-radius:5px;background:rgba(21,35,59,.12)}
.showC-seg{position:absolute;top:-3px;bottom:-3px;border-radius:4px;background:rgba(226,92,15,.62);transition:opacity .5s var(--ease),background .5s var(--ease)}
.showC-per:has(.showC-r[data-i="0"]:is(.step-on,:not(.step))) .showC-seg[data-i="0"],
.showC-per:has(.showC-r[data-i="1"]:is(.step-on,:not(.step))) .showC-seg[data-i="1"],
.showC-per:has(.showC-r[data-i="2"]:is(.step-on,:not(.step))) .showC-seg[data-i="2"]{background:transparent;outline:1.5px dashed rgba(226,92,15,.45);outline-offset:-1px}
.showC-fly{position:absolute;z-index:4;border-radius:5px;background:linear-gradient(90deg,var(--orange,#e25c0f),var(--gold,#e7a23c));pointer-events:none;
  box-shadow:0 0 16px rgba(231,162,60,.55)}

/* typed: the prompt bar */
.showC-pb{display:flex;align-items:center;gap:16px;max-width:900px;margin-top:22px;padding:16px 16px 16px 22px;border-radius:14px;
  background:var(--navy-deep,#0f1a2e);color:#fff;box-shadow:0 20px 44px -26px rgba(15,26,46,.7);cursor:pointer;
  transition:box-shadow .35s var(--ease),transform .35s var(--ease)}
.showC-pb:hover{transform:translateX(4px);box-shadow:0 20px 44px -26px rgba(15,26,46,.7),0 0 0 4px rgba(226,92,15,.14)}
.showC-pb>svg{flex:none;width:22px;height:22px;fill:none;stroke:var(--orange,#e25c0f);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.showC-pt{flex:1;min-width:0;font:500 22px/1.35 var(--font);min-height:30px}
.showC-key{flex:none;width:44px;height:38px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
.showC-key svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.showC-pb.showC-enter{animation:showC-enter .7s var(--ease)}
.showC-pb.showC-enter .showC-key{animation:showC-key .5s var(--ease)}
@keyframes showC-enter{0%{box-shadow:0 0 0 0 rgba(231,162,60,.7)}100%{box-shadow:0 0 0 18px rgba(231,162,60,0)}}
@keyframes showC-key{0%{background:var(--gold,#e7a23c);transform:scale(.9)}100%{background:rgba(255,255,255,.08);transform:none}}
.t-flip .ft{max-width:1120px}

@media print{
  .showC-stamp.step,.showC-r.step,.showC-cn.step{opacity:1!important;filter:none!important;transform:none!important}
  .showC-stamp{transform:rotate(-5deg)!important}.showC-beam,.showC-fly{display:none}
}
@media (prefers-reduced-motion:reduce){
  .showC-beam,.showC-fly,.showC-ring{display:none}
}

/* ==== part: showD ==== */
/* ===== showD: redteam (12), tell (13), prompt (21 to 25), Maisie guardrail cameo ===== */

/* ---------- redteam ---------- */
.t-redteam h1{max-width:none}
.showD-subm{background:linear-gradient(90deg,rgba(226,92,15,.20),rgba(231,162,60,.24)) no-repeat 0 88%/100% 38%;padding:0 2px;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
.scene.on .showD-subm{animation:showD-marker .8s var(--ease) .45s both}
@keyframes showD-marker{from{background-size:0% 38%}to{background-size:100% 38%}}
.showD-rt{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:28px;margin-top:44px;flex:0 0 auto;max-width:1280px}
.showD-col{position:relative;border-radius:18px;padding:28px 30px 26px;background:#fff;border:1px solid rgba(21,35,59,.08);
  box-shadow:0 1px 2px rgba(21,35,59,.05),0 18px 40px -28px rgba(21,35,59,.35);overflow:hidden}
.showD-col h3{margin:0 0 12px;font:700 16px/1.2 var(--font);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft,#41506b)}
.showD-can h3{color:#1E7A3C}
.showD-doc{position:absolute;right:26px;top:22px;bottom:22px;width:40%;display:flex;flex-direction:column;justify-content:space-between;opacity:.035;pointer-events:none}
.showD-doc i{display:block;height:9px;border-radius:5px;background:var(--navy,#15233b)}
.showD-doc i:nth-child(3n+2){width:82%}.showD-doc i:nth-child(4n){width:64%}
/* the silhouette gives way to her list: two bars fade as each row locks, so only his words remain once the slide settles */
.showD-doc i{transition:opacity .5s var(--ease) .35s}
.showD-can:has(.showD-row[data-k="0"]:is(.step-on,:not(.step))) .showD-doc i:nth-child(-n+2),
.showD-can:has(.showD-row[data-k="1"]:is(.step-on,:not(.step))) .showD-doc i:nth-child(n+3):nth-child(-n+4),
.showD-can:has(.showD-row[data-k="2"]:is(.step-on,:not(.step))) .showD-doc i:nth-child(n+5):nth-child(-n+6),
.showD-can:has(.showD-row[data-k="3"]:is(.step-on,:not(.step))) .showD-doc i:nth-child(n+7){opacity:0}
.showD-row{position:relative;z-index:1;display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:center;padding:16px 10px;margin:0 -10px;
  border-radius:12px;font:500 22px/1.35 var(--font);color:var(--navy,#15233b);cursor:pointer;transition:transform .3s var(--ease),background .3s var(--ease)}
.showD-row:hover{transform:translateX(4px);background:rgba(231,162,60,.10)}
.showD-can .showD-row.step{transition:opacity .45s var(--ease) .42s,transform .45s var(--ease) .42s,background .3s var(--ease)}
.showD-tk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(30,122,60,.12)}
.showD-tk svg{width:18px;height:18px;fill:none;stroke:#1E7A3C;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:0}
.scene.on .showD-row:not(.step:not(.step-on)) .showD-tk svg{animation:showD-draw .38s var(--ease) .55s both}
@keyframes showD-draw{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
.showD-never{cursor:pointer;background:#fff;transition:border-color .4s var(--ease),box-shadow .4s var(--ease),transform .3s var(--ease)}
.showD-never:hover{transform:translateX(4px)}
.showD-never:has(.showD-bar:not(.step:not(.step-on))){border:2px solid #B32A2A;padding:27px 29px 25px;transition-delay:.5s}
.showD-never h3{color:#B32A2A}
.showD-never .showD-row{cursor:inherit;color:var(--ink-soft,#41506b)}
.showD-never .showD-row:hover{transform:none;background:none}
.showD-x{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(179,42,42,.12)}
.showD-x svg{width:14px;height:14px;fill:none;stroke:#B32A2A;stroke-width:3.2;stroke-linecap:round}
.showD-x.step{opacity:0;transform:scale(2.3) rotate(-14deg)}
.showD-x.step.step-on{opacity:1;transform:none;transition:opacity .17s cubic-bezier(.5,0,.75,0),transform .17s cubic-bezier(.5,0,.75,0)}
.showD-x.step.step-on:nth-of-type(n){transition-delay:calc(.5s + var(--k,0) * 90ms)}
.showD-bar{position:relative;height:14px;margin:6px -30px 12px;border-radius:0;
  background:linear-gradient(180deg,#41506b,#1d3155 45%,#15233b);box-shadow:0 6px 14px -6px rgba(21,35,59,.55),inset 0 1px 0 rgba(255,255,255,.18)}
.showD-bar::before,.showD-bar::after{content:"";position:absolute;top:-3px;width:12px;height:20px;border-radius:4px;background:linear-gradient(180deg,#f07a2a,#c44a06)}
.showD-bar::before{left:22px}.showD-bar::after{right:22px}
.showD-bar.step{opacity:1;transform:translateX(-104%)}
.showD-bar.step.step-on{transform:none;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
/* the reticle */
.showD-ret{position:absolute;left:0;top:0;z-index:2;pointer-events:none;opacity:0;
  transition:transform .45s var(--ease),width .45s var(--ease),height .45s var(--ease),opacity .25s}
.showD-ret.on{opacity:1}
.showD-ret .showD-br{position:absolute;width:18px;height:18px;border:2.5px solid var(--orange,#e25c0f)}
.showD-br.a{left:-4px;top:-4px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.showD-br.b{right:-4px;top:-4px;border-left:0;border-bottom:0;border-radius:0 6px 0 0}
.showD-br.c{left:-4px;bottom:-4px;border-right:0;border-top:0;border-radius:0 0 0 6px}
.showD-br.d{right:-4px;bottom:-4px;border-left:0;border-top:0;border-radius:0 0 6px 0}
.showD-ret .showD-cross{position:absolute;left:4px;top:50%;width:38px;height:38px;margin-top:-19px;transition:transform .3s var(--ease),opacity .3s}
.showD-cross svg{width:100%;height:100%;fill:none;stroke:var(--orange,#e25c0f);stroke-width:2}
.showD-ret.lock .showD-brs{animation:showD-lock .16s cubic-bezier(.5,0,.75,0) both}
.showD-ret.lock .showD-cross{transform:scale(.4);opacity:0}
.showD-brs{position:absolute;inset:0}
@keyframes showD-lock{from{transform:scale(1.4,1.9);opacity:.3}to{transform:none;opacity:1}}
.showD-ret.lock::after{content:"";position:absolute;inset:-4px;border-radius:14px;box-shadow:0 0 0 0 rgba(226,92,15,.35);animation:showD-ping .6s var(--ease) .16s both}
@keyframes showD-ping{from{box-shadow:0 0 0 0 rgba(226,92,15,.35)}to{box-shadow:0 0 0 14px rgba(226,92,15,0)}}

/* ---------- tell (dark) ---------- */
.t-tell{justify-content:flex-start}
.t-tell h1.showD-th{font-size:76px;line-height:1.05;max-width:none;margin-top:6px}
.showD-w{display:inline-block;white-space:pre}
.scene.on .showD-w{animation:showD-land .7s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0) * 140ms + 120ms)}
@keyframes showD-land{from{opacity:0;letter-spacing:.3em;filter:blur(8px);transform:translateX(-14px)}to{opacity:1;letter-spacing:-.015em;filter:none;transform:none}}
.showD-tb{font:400 26px/1.55 var(--font);color:rgba(255,255,255,.8);max-width:1180px;margin:34px 0 0}
.showD-mk{color:#fff;cursor:pointer;border-radius:3px;padding:0 1px;margin:0 -1px;
  background:linear-gradient(90deg,rgba(231,162,60,.42),rgba(226,92,15,.38)) no-repeat 0 90%/100% 42%;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size .6s cubic-bezier(.2,.8,.2,1)}
.showD-mk:hover{color:var(--gold,#e7a23c)}
.showD-mk:has(>.step:not(.step-on)){background-size:0% 42%;color:inherit}
.showD-mk.showD-re{transition:none;background-size:0% 42%}
.showD-sd{display:none}
.showD-rw{margin-top:52px;max-width:1280px}
.showD-rw.step{transform:none}
.showD-r0{font:600 22px/1.3 var(--font);color:rgba(255,255,255,.78);margin:0 0 16px;letter-spacing:.01em}
.showD-r0::before{content:"";display:inline-block;width:22px;height:2px;background:var(--orange,#e25c0f);vertical-align:middle;margin-right:14px}
.showD-rail{position:relative;height:170px;border-radius:16px;touch-action:none;cursor:grab;user-select:none;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 22%,rgba(0,0,0,0) 70%,rgba(0,0,0,.28)),linear-gradient(90deg,#1d3155,#41506b);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -2px 0 rgba(0,0,0,.35),0 24px 50px -24px rgba(0,0,0,.7);
