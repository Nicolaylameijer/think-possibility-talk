  display:flex;flex-direction:column;justify-content:center;padding:0 128px;overflow:hidden}
.showD-rail:active{cursor:grabbing}
.showD-rail::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 5px)}
.showD-rv{position:absolute;width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#aab4c5,#41506b 60%,#15233b);box-shadow:0 1px 1px rgba(255,255,255,.18),inset 0 -1px 2px rgba(0,0,0,.5)}
.showD-rv.a{left:22px;top:20px}.showD-rv.b{left:22px;bottom:20px}.showD-rv.c{right:22px;top:20px}.showD-rv.d{right:22px;bottom:20px}
.showD-bolt{position:absolute;top:50%;width:52px;height:52px;margin-top:-26px}
.showD-bolt.l{left:44px}.showD-bolt.r{right:44px}
.showD-bolt svg{width:100%;height:100%}
.showD-en{position:relative;margin:0;font:600 34px/1.3 var(--serif,'Fraunces',Georgia,serif);color:#fff;letter-spacing:-.005em;
  text-shadow:0 -1px 0 rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.14)}
.showD-en + .showD-en{margin-top:6px}
.showD-en.b{font-style:italic;font-weight:500;color:var(--gold,#e7a23c)}
.showD-sw{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.28) 48%,transparent 62%) no-repeat;background-size:40% 100%}
/* the rail's entry, played when its step is revealed (and on arrival when already revealed) */
.scene.on .showD-rw:not(.step:not(.step-on)) .showD-r0{animation:showD-in .5s var(--ease) both}
.scene.on .showD-rw:not(.step:not(.step-on)) .showD-rail{animation:showD-slide .55s cubic-bezier(.2,.8,.2,1) .25s both}
.scene.on .showD-rw:not(.step:not(.step-on)) .showD-bolt{animation:showD-bolt .6s cubic-bezier(.2,1.3,.3,1) .8s both}
.scene.on .showD-rw:not(.step:not(.step-on)) .showD-bolt.r{animation-delay:.95s}
.scene.on .showD-rw:not(.step:not(.step-on)) .showD-en{animation:showD-engrave .5s cubic-bezier(.4,0,.2,1) 1.2s both}
.scene.on .showD-rw:not(.step:not(.step-on)) .showD-en.b{animation-delay:1.75s}
.scene.on .showD-rw:not(.step:not(.step-on)) .showD-sw{animation:showD-sweep 1.2s cubic-bezier(.4,0,.2,1) 1.2s both}
@keyframes showD-in{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes showD-slide{from{transform:translateX(-110%);opacity:.4}to{transform:none;opacity:1}}
@keyframes showD-bolt{from{transform:rotate(-540deg) scale(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes showD-engrave{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes showD-sweep{0%{opacity:1;background-position:-60% 0}100%{opacity:1;background-position:160% 0}}
.showD-dust{position:absolute;width:6px;height:6px;border-radius:50%;background:#e8e1d3;pointer-events:none;z-index:3}

/* ---------- prompt (21 to 25) ---------- */
.t-prompt{justify-content:flex-start}
.showD-pw{margin-top:22px;display:flex;flex-direction:column;align-items:flex-start;gap:22px;max-width:1180px}
.showD-term{position:relative;width:1180px;border-radius:18px;background:var(--navy-deep,#0f1a2e);color:#e9edf5;overflow:hidden;cursor:copy;
  box-shadow:0 1px 2px rgba(21,35,59,.1),0 40px 80px -40px rgba(15,26,46,.75),inset 0 0 0 1px rgba(255,255,255,.06);transition:box-shadow .3s var(--ease),transform .3s var(--ease)}
.showD-term:hover{transform:translateX(4px);box-shadow:0 1px 2px rgba(21,35,59,.1),0 46px 90px -40px rgba(15,26,46,.8),0 0 0 1px rgba(231,162,60,.35)}
.scene.on .showD-term{animation:showD-wipe .65s cubic-bezier(.77,0,.18,1) both}
@keyframes showD-wipe{from{clip-path:inset(0 100% 0 0 round 18px)}to{clip-path:inset(0 0 0 0 round 18px)}}
.showD-tbar{display:flex;align-items:center;gap:22px;padding:18px 28px;background:linear-gradient(180deg,#1d3155,#15233b);
  border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer}
.showD-dots{display:flex;gap:8px;flex:0 0 auto}
.showD-dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.18)}
.showD-dots i:first-child{background:rgba(226,92,15,.55)}
.t-prompt h1.showD-pt{font:600 30px/1.2 var(--serif,'Fraunces',Georgia,serif);color:#fff;margin:0;max-width:none;letter-spacing:-.01em}
.t-prompt h1.showD-pt em{font-style:italic;font-weight:500;color:var(--orange,#e25c0f)}
.showD-tbar:hover .showD-rp{opacity:1;transform:none}
.showD-rp{margin-left:auto;width:22px;height:22px;opacity:.45;transform:translateX(-4px);transition:opacity .3s,transform .3s var(--ease)}
.showD-rp svg{width:100%;height:100%;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.showD-code{padding:24px 36px 28px 0;font:18px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:120px}
.showD-code.sm{font-size:17px}
.showD-l{display:grid;grid-template-columns:72px 1fr;white-space:pre-wrap;word-break:break-word}
.showD-l b{font-weight:400;text-align:right;padding-right:22px;color:rgba(170,180,197,.42);user-select:none;border-right:1px solid rgba(255,255,255,.06);margin-right:24px}
.showD-paste{display:inline-block;padding:0 10px;border-radius:999px;background:rgba(226,92,15,.18);color:#ffb27e;
  box-shadow:0 0 0 1px rgba(226,92,15,.55),0 0 18px rgba(226,92,15,.45);line-height:1.35;animation:showD-glow 2.4s ease-in-out infinite alternate}
@keyframes showD-glow{from{box-shadow:0 0 0 1px rgba(226,92,15,.55),0 0 10px rgba(226,92,15,.25)}to{box-shadow:0 0 0 1px rgba(226,92,15,.75),0 0 22px rgba(226,92,15,.55)}}
.showD-caret{display:inline-block;width:10px;height:1.1em;vertical-align:-.18em;margin-left:1px;background:var(--gold,#e7a23c);animation:showD-blink 1s steps(1) infinite}
@keyframes showD-blink{50%{opacity:0}}
.showD-note{margin:0;font:italic 600 21px/1.4 var(--font);color:var(--ink-soft,#41506b);display:flex;align-items:center;gap:14px}
.showD-note::before{content:"";width:22px;height:2px;background:var(--orange,#e25c0f);flex:0 0 auto}
.showD-toast{position:absolute;right:22px;top:14px;z-index:3;padding:8px 18px;border-radius:10px;background:#1E7A3C;color:#fff;font:700 18px/1.2 var(--font);
  opacity:0;transform:translateX(-12px);pointer-events:none;transition:opacity .25s,transform .35s var(--ease)}
.showD-toast.on{opacity:1;transform:none}
.showD-gsw{position:absolute;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(100deg,transparent 35%,rgba(30,122,60,.35) 50%,transparent 65%) no-repeat;background-size:45% 100%;background-position:-80% 0;opacity:0}
.showD-gsw.go{animation:showD-sweep .7s cubic-bezier(.4,0,.2,1) both}

/* ---------- Maisie guardrail cameo (M) ---------- */
.showD-cam{position:absolute;left:0;top:560px;z-index:55;display:flex;align-items:center;gap:22px;pointer-events:auto;cursor:pointer;
  transform:translateX(-760px);opacity:0;transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .4s}
.showD-cam.in{transform:translateX(96px);opacity:1}
.showD-cam.out{transform:translateX(1560px);opacity:0;transition:transform .8s cubic-bezier(.6,0,.8,.4),opacity .5s .3s}
.showD-trail{position:absolute;right:calc(100% - 60px);top:50%;height:4px;width:0;margin-top:-2px;border-radius:4px;pointer-events:none;
  background:linear-gradient(90deg,rgba(231,162,60,0),rgba(231,162,60,.9));box-shadow:0 0 18px rgba(231,162,60,.6);transition:width .8s var(--ease),opacity .6s .5s}
.showD-cam.in .showD-trail{width:420px;opacity:0}
.showD-cam.out .showD-trail{width:520px;opacity:.9;transition:width .5s var(--ease)}
.showD-av{position:relative;width:132px;height:132px;flex:0 0 auto;border-radius:50%;padding:3px;background:var(--orange,#e25c0f);
  box-shadow:0 0 0 6px rgba(226,92,15,.15),0 24px 50px -20px rgba(15,26,46,.7)}
.showD-av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:2px solid #fff}
.showD-av span{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);white-space:nowrap;padding:4px 10px;border-radius:999px;
  background:var(--navy,#15233b);color:#fff;font:700 11px/1.2 var(--font);letter-spacing:.14em}
.showD-card{position:relative;min-width:520px;max-width:760px;padding:24px 30px;border-radius:18px;background:#fff;color:var(--navy,#15233b);
  border:1px solid rgba(21,35,59,.08);box-shadow:0 30px 60px -30px rgba(15,26,46,.6);border-left:3px solid var(--orange,#e25c0f)}
.showD-card p{margin:0;font:600 28px/1.35 var(--serif,'Fraunces',Georgia,serif);white-space:pre-wrap;min-height:2.7em}
.showD-card::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-10px;border:10px solid transparent;border-left:0;border-right-color:#fff}

@media print{
  .showD-cam,.showD-ret,.showD-toast,.showD-gsw,.showD-caret,.showD-sw{display:none!important}
  .showD-term,.showD-rail,.showD-en,.showD-w,.showD-bar,.showD-x{animation:none!important;clip-path:none!important;transform:none!important;opacity:1!important}
  .showD-mk{background-size:100% 42%!important}
}

/* ==== part: showE ==== */
/* ==== showE: apps (3), race (10), mission (4), record (16), REC light ==== */
.showE-trig{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
.showE-reset,.showE-reset *{transition:none!important;animation:none!important}
.t-apps h1,.t-race h1,.t-mission h1,.t-record h1{max-width:none}
.showE-ix{cursor:pointer;transition:transform .3s var(--ease),box-shadow .3s var(--ease),opacity .4s var(--ease)}

/* ---------- apps ---------- */
.showE-atop{display:flex;align-items:flex-start;gap:48px}
.showE-atop>div:first-child{flex:1;min-width:0}
.showE-atop .sub{max-width:62ch;font-size:21px}
.showE-ring{position:relative;flex:none;width:210px;height:210px;margin:44px 24px 0 0;cursor:pointer;border-radius:50%;
  transition:transform .3s var(--ease),filter .3s var(--ease)}
.showE-ring:hover{transform:translateX(4px);filter:drop-shadow(0 12px 28px rgba(226,92,15,.25))}
.showE-ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.showE-ring .showE-trk{fill:none;stroke:rgba(21,35,59,.10);stroke-width:5}
.showE-ring .showE-arc{fill:none;stroke:var(--orange);stroke-width:5;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:0;
  transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke .4s var(--ease)}
.showE-ring .showE-tk{fill:none;stroke:#1E7A3C;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
.showE-ring .showE-dg{position:absolute;inset:0;display:grid;place-items:center;font:700 76px/1 var(--serif);color:var(--navy);
  font-variant-numeric:tabular-nums;font-optical-sizing:auto;transition:opacity .3s var(--ease)}
.showE-ring .showE-cap{position:absolute;left:0;right:0;bottom:44px;text-align:center;font:700 13px/1 var(--font);letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-soft);transition:opacity .3s}
.showE-ring.showE-run .showE-cap,.showE-ring.showE-done .showE-cap{opacity:0}
.showE-ring.showE-last .showE-arc{stroke:var(--gold)}
.showE-ring .showE-dg.showE-pop{animation:showE-pop .9s var(--ease)}
@keyframes showE-pop{0%{transform:scale(1.12);color:var(--orange-deep)}100%{transform:scale(1)}}
.showE-ring.showE-done .showE-arc{stroke:#1E7A3C}
.showE-ring.showE-done .showE-dg{opacity:0}
.showE-ring.showE-done .showE-tk{opacity:1;stroke-dashoffset:0;transition:stroke-dashoffset .5s .15s var(--ease)}
.showE-ring.showE-done::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid #1E7A3C;animation:showE-flash .9s var(--ease) both}
@keyframes showE-flash{0%{opacity:0;transform:scale(.9)}35%{opacity:.9}100%{opacity:0;transform:scale(1.18)}}
.showE-apps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:30px}
.showE-apps>div{position:relative;overflow:hidden;background:#fff;border:1px solid rgba(21,35,59,.08);border-radius:18px;padding:28px 28px 30px;min-height:150px;
  box-shadow:0 1px 2px rgba(21,35,59,.05),0 18px 40px -28px rgba(21,35,59,.35);display:grid;grid-template-columns:40px 1fr;column-gap:18px;align-items:start}
.showE-apps>div:hover{transform:translateX(4px);box-shadow:0 30px 60px -36px rgba(21,35,59,.45),0 0 0 1px rgba(226,92,15,.25)}
.showE-apps>div:active{transform:translateX(4px) scale(.985)}
.showE-apps .showE-k{grid-row:span 3;width:40px;height:40px;border-radius:11px;border:1.5px solid var(--orange);display:grid;place-items:center;
  font:600 20px/1 var(--serif);color:var(--orange)}
.showE-apps h3{margin:4px 0 0;font:600 26px/1.15 var(--serif);color:var(--navy);font-optical-sizing:auto}
.showE-apps p{margin:8px 0 0;font-size:19px;line-height:1.4;color:var(--ink-soft)}
.showE-apps .vn{margin-top:10px;font:700 15px/1.2 var(--font);color:var(--orange-deep);min-height:1.2em;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.showE-apps .vb{position:absolute;left:0;bottom:0;height:6px;width:0;background:linear-gradient(90deg,var(--orange),var(--gold));transition:width .6s var(--ease)}
.showE-apps>div.lead{box-shadow:0 0 0 2px var(--orange),0 18px 40px -28px rgba(21,35,59,.35)}
.showE-apps>div::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  background:linear-gradient(100deg,transparent 20%,rgba(231,162,60,.22) 50%,transparent 80%)}
.showE-apps>div.showE-hit::before{animation:showE-hit .42s var(--ease)}
@keyframes showE-hit{0%{opacity:0;transform:translateX(-40%)}40%{opacity:1}100%{opacity:0;transform:translateX(40%)}}
.showE-apps>div.showE-tap{animation:showE-tap .45s var(--ease)}
@keyframes showE-tap{0%{box-shadow:0 0 0 0 rgba(226,92,15,.55)}100%{box-shadow:0 0 0 16px rgba(226,92,15,0)}}
.t-apps .hl{margin-top:30px}
.t-apps .ft{margin-top:14px}

/* ---------- race ---------- */
.showE-race{position:relative;margin-top:50px;display:flex;flex-direction:column;gap:18px;padding-right:46px}
.showE-lane{position:relative;display:grid;grid-template-columns:52px 300px 1fr 112px;align-items:center;gap:22px;padding:24px 28px;
  background:#fff;border:1px solid rgba(21,35,59,.08);border-radius:18px;overflow:hidden;
  box-shadow:0 1px 2px rgba(21,35,59,.05),0 18px 40px -28px rgba(21,35,59,.35);
  transition:transform .6s cubic-bezier(.2,1.4,.3,1),opacity .5s var(--ease),box-shadow .4s var(--ease),padding .5s var(--ease)}
.showE-lane:hover{transform:translateX(4px);box-shadow:0 30px 60px -36px rgba(21,35,59,.45),0 0 0 1px rgba(226,92,15,.25)}
.showE-lane:active{transform:translateX(4px) scale(.99)}
.showE-lane .showE-k{width:52px;height:52px;border-radius:13px;border:1.5px solid var(--orange);display:grid;place-items:center;
  font:600 26px/1 var(--serif);color:var(--orange);background:#fff}
.showE-lane .showE-lb{font:600 24px/1.2 var(--serif);color:var(--navy);font-optical-sizing:auto}
.showE-trk2{position:relative;height:40px}
.showE-trk2::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;
  background:repeating-linear-gradient(90deg,rgba(21,35,59,.16) 0 10px,transparent 10px 18px)}
.showE-trk2 .vb{position:absolute;left:0;top:50%;height:8px;margin-top:-4px;border-radius:4px;width:0;
  background:linear-gradient(90deg,rgba(226,92,15,.25),var(--orange));transition:width .7s cubic-bezier(.2,1.4,.3,1)}
.showE-tok{position:absolute;top:50%;left:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#f58a44,var(--orange) 55%,var(--orange-deep));
  box-shadow:0 0 0 4px rgba(226,92,15,.14),0 8px 20px -6px rgba(196,74,6,.6);transition:left .7s cubic-bezier(.2,1.4,.3,1)}
.showE-tok.showE-surge{animation:showE-surge .7s var(--ease)}
@keyframes showE-surge{0%{box-shadow:0 0 0 4px rgba(226,92,15,.14),-26px 0 22px -8px rgba(231,162,60,.8)}100%{box-shadow:0 0 0 4px rgba(226,92,15,.14),0 8px 20px -6px rgba(196,74,6,.6)}}
.showE-lane .vn{justify-self:end;font:700 17px/1.2 var(--font);color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.showE-lane.lead .vn{color:var(--orange-deep)}
.showE-flag{position:absolute;right:0;top:0;bottom:0;width:26px;border-radius:6px;cursor:pointer;opacity:.35;
  background:repeating-conic-gradient(var(--navy) 0 25%,#fff 0 50%) 0 0/13px 13px;
  clip-path:inset(0 0 0 0);transition:opacity .3s var(--ease),transform .3s var(--ease)}
.showE-flag:hover{opacity:.7;transform:translateX(4px)}
.showE-called .showE-flag{opacity:1;animation:showE-wipeD .7s var(--ease) both}
@keyframes showE-wipeD{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.showE-called .showE-lane{opacity:.45;transform:translateX(-12px)}
.showE-called .showE-lane.showE-win{opacity:1;transform:none;padding:32px 28px;
  box-shadow:0 0 0 2px var(--orange),0 30px 60px -30px rgba(196,74,6,.45)}
.showE-lane::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(100deg,transparent 30%,rgba(231,162,60,.35) 50%,transparent 70%)}
.showE-called .showE-lane.showE-win::after{animation:showE-edge 1s .2s var(--ease) both}
@keyframes showE-edge{0%{opacity:1;transform:translateX(-70%)}100%{opacity:0;transform:translateX(70%)}}
.t-race .ft{margin-top:26px}
.t-race .ft.step{transform:none;clip-path:inset(0 100% 0 0);transition:clip-path .8s var(--ease),opacity .3s}
.t-race .ft.step.step-on{clip-path:inset(0 0 0 0)}

/* ---------- mission ---------- */
.showE-mis{display:grid;grid-template-columns:1fr 420px;gap:56px;flex:1;min-height:0}
.showE-ml{min-width:0;display:flex;flex-direction:column}
.showE-msteps{display:flex;flex-direction:column;gap:14px;margin-top:34px}
.showE-mstep{position:relative;display:flex;align-items:center;gap:18px;padding:18px 24px;background:#fff;border-radius:18px;
  border:1px solid rgba(21,35,59,.08);box-shadow:0 1px 2px rgba(21,35,59,.05),0 18px 40px -28px rgba(21,35,59,.35);overflow:hidden}
.showE-mstep:hover{transform:translateX(4px);box-shadow:0 30px 60px -36px rgba(21,35,59,.45),0 0 0 1px rgba(226,92,15,.25)}
.showE-mstep:active{transform:translateX(4px) scale(.99)}
.showE-mstep .showE-k{width:40px;height:40px;flex:none;border-radius:11px;border:1.5px solid var(--orange);display:grid;place-items:center;
  font:600 20px/1 var(--serif);color:var(--orange);transition:background .4s var(--ease),color .4s var(--ease)}
.showE-mstep span{font-size:22px;line-height:1.35;color:var(--navy)}
.showE-mstep.showE-lit .showE-k{background:var(--orange);color:#fff}
.showE-mstep.showE-lit{box-shadow:0 0 0 2px rgba(226,92,15,.55),0 18px 40px -28px rgba(21,35,59,.35)}
.t-mission .hl{margin-top:28px}
.t-mission .co{margin-top:22px}
.showE-mr{position:relative;display:flex;flex-direction:column;align-items:flex-end;padding-top:44px}
.showE-pol{position:relative;overflow:hidden;width:340px;padding:18px 18px 64px;background:#fff;border-radius:6px;cursor:pointer;
  box-shadow:0 2px 4px rgba(21,35,59,.08),0 30px 60px -30px rgba(21,35,59,.5);transform:rotate(2deg);transform-origin:40% 90%}
.showE-pol.step{opacity:0;transform:translateX(-160px) rotate(-9deg);
  transition:opacity .45s var(--ease),transform .9s cubic-bezier(.2,1.25,.3,1)}
.showE-pol.step.step-on{opacity:1;transform:rotate(2deg)}
.showE-pol.step.step-on.showE-hold{opacity:0;transform:translateX(-160px) rotate(-9deg);transition:none}
.showE-pol:hover{filter:drop-shadow(0 0 18px rgba(226,92,15,.22))}
.showE-photo{position:relative;height:300px;border-radius:2px;overflow:hidden;background:#fff4e8;transition:background 1.2s .5s var(--ease)}
.showE-photo::before{content:"";position:absolute;inset:0;background:#9aa6ba;opacity:0;transition:opacity 1.2s .5s var(--ease)}
.showE-pol.step:not(.step-on) .showE-photo::before,.showE-pol.showE-hold .showE-photo::before{opacity:1}
.showE-photo svg{position:absolute;inset:0;width:100%;height:100%}
.showE-photo .showE-ln{fill:none;stroke:var(--navy);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0;
  transition:stroke-dashoffset .9s .7s var(--ease)}
.showE-photo .showE-ln.o{stroke:var(--orange)}
.showE-pol.step:not(.step-on) .showE-ln,.showE-pol.showE-hold .showE-ln{stroke-dashoffset:1}
.showE-pol .showE-scan{position:absolute;left:0;right:0;top:0;height:100%;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,transparent,rgba(231,162,60,.55) 50%,transparent);width:90px}
.showE-pol .showE-scan.showE-go{animation:showE-scan 1.3s var(--ease) 2}
@keyframes showE-scan{0%{opacity:0;transform:translateX(-100px)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateX(360px)}}
.showE-pol .showE-cap2{position:absolute;left:18px;right:18px;bottom:20px;height:3px;border-radius:2px;background:rgba(21,35,59,.08)}
.showE-bub{position:relative;margin-top:26px;width:440px;display:flex;align-items:center;gap:14px;padding:16px 16px 16px 22px;
  background:#fff;border:1px solid rgba(21,35,59,.1);border-radius:18px 18px 6px 18px;box-shadow:0 18px 40px -28px rgba(21,35,59,.45)}
.showE-bub.step{transform:translateX(-24px)}
.showE-bub .showE-tx{flex:1;min-height:1.35em;text-wrap:balance;font-size:20px;line-height:1.35;color:var(--navy)}
.showE-bub .showE-send{flex:none;width:40px;height:40px;border-radius:10px;background:var(--orange);display:grid;place-items:center;color:#fff}
.showE-bub .showE-send svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.showE-bub .showE-send.showE-nudge{animation:showE-nudge .5s var(--ease)}
@keyframes showE-nudge{0%{transform:none}45%{transform:translateX(8px)}100%{transform:none}}
.showE-extra{position:absolute;width:210px;padding:10px 10px 36px;background:#fff;border-radius:5px;pointer-events:none;
  box-shadow:0 2px 4px rgba(21,35,59,.08),0 26px 50px -24px rgba(21,35,59,.55);animation:showE-drop .8s cubic-bezier(.2,1.25,.3,1) both}
@keyframes showE-drop{from{opacity:0;transform:translateX(-120px) rotate(-14deg)}to{opacity:1}}
.showE-extra .showE-mini{position:relative;height:107px;overflow:hidden;background:var(--paper);border-radius:2px}
.showE-extra .showE-mini>div{position:absolute;left:0;top:0;width:1440px;height:810px;transform:scale(.1319);transform-origin:0 0;pointer-events:none}

/* ---------- REC light ---------- */
#rec{position:absolute;top:24px;right:28px;z-index:42;transform-origin:100% 50%;display:none;align-items:center;gap:9px;height:30px;padding:0 13px 0 11px;border-radius:15px;
  background:rgba(21,35,59,.86);color:#fff;font:700 12px/1 var(--font);letter-spacing:.16em;cursor:pointer;user-select:none;
  box-shadow:0 8px 20px -10px rgba(15,26,46,.6);transition:transform .3s var(--ease),box-shadow .3s var(--ease),background .4s,color .4s}
#rec.showE-show{display:flex}
#rec:hover{transform:translateX(-4px);box-shadow:0 8px 22px -8px rgba(179,42,42,.55)}
#stage[data-reg="dark"] #rec,#rec.showE-onDark{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
#rec i{width:9px;height:9px;border-radius:50%;background:#e0413a;box-shadow:0 0 0 3px rgba(224,65,58,.2);animation:showE-blink 1.6s ease-in-out infinite}
@keyframes showE-blink{0%,100%{opacity:1}50%{opacity:.3}}
#rec b{font-weight:600;letter-spacing:.06em;font-variant-numeric:tabular-nums;opacity:.9}
#rec.showE-frozen i{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.2);animation:none}
#rec.showE-ping{animation:showE-ping .6s var(--ease)}
@keyframes showE-ping{0%{box-shadow:0 0 0 0 rgba(224,65,58,.6)}100%{box-shadow:0 0 0 14px rgba(224,65,58,0)}}
#rec.showE-away{opacity:0;pointer-events:none}
@media print{#rec{display:none!important}}

/* ---------- record ---------- */
.showE-rkick{display:flex;align-items:center;gap:18px}
.showE-rkick .kick{margin:0}
.showE-big{display:inline-flex;align-items:center;gap:12px;height:44px;padding:0 20px 0 16px;border-radius:22px;background:var(--navy);color:#fff;
  font:700 18px/1 var(--font);letter-spacing:.16em;cursor:pointer;box-shadow:0 14px 30px -16px rgba(15,26,46,.7);transform-origin:100% 50%}
.showE-big i{width:14px;height:14px;border-radius:50%;background:#e0413a;box-shadow:0 0 0 4px rgba(224,65,58,.22);animation:showE-blink 1.6s ease-in-out infinite}
.showE-big b{font-weight:600;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.showE-rhead{margin-bottom:0}
.showE-rhead h1{margin-top:14px}
.showE-rhead .sub{max-width:64ch}
.showE-flow{position:relative;height:150px;margin-top:26px;display:grid;grid-template-columns:1fr 150px;align-items:center;gap:24px}
.showE-pad{position:absolute;left:0;top:0;z-index:2;width:170px;height:150px;cursor:pointer;transition:transform .7s .5s var(--ease),opacity .6s .55s var(--ease)}
.showE-pad:hover{filter:drop-shadow(0 10px 20px rgba(226,92,15,.2))}
.showE-pad svg{width:100%;height:100%;overflow:visible}
.showE-pad .showE-ln{fill:none;stroke:var(--navy);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.showE-pad .showE-ln.m{stroke:#9aa6ba}
.showE-pad .showE-strk{fill:none;stroke:var(--orange-deep);stroke-width:10;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .38s var(--ease)}
.showE-r:has(.showE-t1.step-on) .showE-strk{stroke-dashoffset:0}
.showE-r:has(.showE-t1.step-on) .showE-pad{transform:translateX(-260px);opacity:0;pointer-events:none}
.showE-wave{position:relative;height:130px;opacity:.12;transition:opacity .6s var(--ease)}
.showE-r:has(.showE-t2.step-on) .showE-wave{opacity:1}
.showE-wave canvas{position:absolute;inset:0;width:100%;height:100%}
.showE-av{position:relative;width:140px;height:140px;border-radius:50%;cursor:pointer;justify-self:end;
  box-shadow:0 0 0 3px var(--orange),0 20px 40px -18px rgba(196,74,6,.6);transition:transform .3s var(--ease),box-shadow .4s var(--ease)}
.showE-av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.showE-av:hover{transform:translateX(4px)}
.showE-r:has(.showE-t2.step-on) .showE-av{box-shadow:0 0 0 3px var(--orange),0 0 0 12px rgba(226,92,15,.12),0 20px 40px -18px rgba(196,74,6,.6)}
.showE-av.showE-boost{animation:showE-ping .6s var(--ease)}
.showE-outs{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:40px}
.showE-out{position:relative;z-index:1;background:#fff;border:1px solid rgba(21,35,59,.08);border-radius:18px;padding:20px 22px;
  box-shadow:0 1px 2px rgba(21,35,59,.05),0 18px 40px -28px rgba(21,35,59,.35);cursor:pointer}
.showE-out.step{transform:none;opacity:0}
.showE-out.step.step-on{opacity:1}
.showE-out:hover{transform:translateX(4px);box-shadow:0 30px 60px -36px rgba(21,35,59,.45),0 0 0 1px rgba(226,92,15,.25)}
.showE-out .theme-tile,.showE-out .showE-tile{width:44px;height:44px;border-radius:12px}
.showE-tile{display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#f07a2a,#e25c0f 55%,#c44a06)}
.showE-tile svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.showE-out h3{margin:14px 0 0;font:600 22px/1.2 var(--serif);color:var(--navy);font-optical-sizing:auto}
.showE-out p{margin:6px 0 0;font-size:18px;line-height:1.35;color:var(--ink-soft)}
.showE-out.showE-pulse{animation:showE-tap .5s var(--ease)}
.showE-cns{position:absolute;left:0;top:0;width:1440px;height:810px;pointer-events:none;overflow:visible;z-index:0}
.showE-cns path{fill:none;stroke:rgba(226,92,15,.45);stroke-width:1.5;stroke-dasharray:1;stroke-dashoffset:0;transition:stroke-dashoffset .6s var(--ease)}
.showE-cns path.step{opacity:1;transform:none;stroke-dashoffset:1}
.showE-cns path.step.step-on{stroke-dashoffset:0}
.t-record .hl{margin-top:26px}

/* ==== part: showF ==== */
/* ==== showF: three (17), handout (19), reps (26) ==== */
.showF-hd h1{max-width:24ch}

/* ---- three ---- */
.showF-3{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:18px;margin-top:26px;max-width:1180px;position:relative;z-index:1}
.showF-row{position:relative;display:flex;align-items:center;min-height:148px;padding:0 40px 0 28px;border-radius:22px;background:#fff;
  border:1px solid rgba(21,35,59,.08);box-shadow:0 1px 2px rgba(21,35,59,.05),0 18px 40px -28px rgba(21,35,59,.35);cursor:pointer;overflow:hidden}
.showF-row::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,var(--orange),var(--gold))}
/* before its click a row is a quiet placeholder: a dashed outline and a hollow numeral */
.showF-row:has(> .showF-in.step:not(.step-on)){background:transparent;box-shadow:none;border-color:transparent}
.showF-row:has(> .showF-in.step:not(.step-on))::before{opacity:0}
.showF-ghost{position:absolute;left:28px;top:50%;transform:translateY(-54%);font:italic 600 130px/1 var(--serif);color:transparent;
  -webkit-text-stroke:1.5px rgba(21,35,59,.2);opacity:0;transition:opacity .4s var(--ease);pointer-events:none}
.showF-row:has(> .showF-in.step:not(.step-on)) .showF-ghost{opacity:1}
.showF-in{display:flex;align-items:center;gap:30px;width:100%}
.showF-in.step{transform:none;transition:opacity .25s var(--ease)}
.showF-num{flex:none;width:118px;text-align:center;font:italic 500 130px/1 var(--serif);font-optical-sizing:auto;letter-spacing:-.02em;margin-top:-14px;
  background:linear-gradient(100deg,var(--orange) 0 38%,var(--gold) 48%,#f6c77a 50%,var(--gold) 52%,var(--orange) 62% 100%);background-size:320% 100%;
  background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 8px}
.showF-tk{flex:none;width:44px;height:44px;border-radius:50%;background:#1E7A3C;display:grid;place-items:center;box-shadow:0 8px 18px -10px rgba(30,122,60,.8)}
.showF-tk svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:0}
.showF-tx h2{font:600 34px/1.15 var(--serif);font-optical-sizing:auto;color:var(--navy);margin:0;letter-spacing:-.01em}
.showF-tx p{font-size:22px;line-height:1.45;color:var(--ink-soft);margin:6px 0 0}
/* the punch: numeral scales in with a gold sweep, the tick lands, the text wipes in */
.showF-in.showF-pop .showF-num{animation:showF-punch .26s cubic-bezier(.2,1.3,.3,1) both,showF-gold .9s .12s var(--ease) both}
.showF-in.showF-pop .showF-tk{animation:showF-land .42s .18s cubic-bezier(.2,1.4,.3,1) both}
.showF-in.showF-pop .showF-tk svg{animation:showF-draw .4s .36s var(--ease) both}
.showF-in.showF-pop .showF-tx{animation:showF-wipe .6s .14s cubic-bezier(.77,0,.18,1) both}
@keyframes showF-punch{from{transform:scale(1.8);opacity:0}40%{opacity:1}to{transform:scale(1);opacity:1}}
@keyframes showF-gold{from{background-position:0 0}to{background-position:100% 0}}
@keyframes showF-land{from{transform:translateX(-14px) scale(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes showF-draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes showF-wipe{from{clip-path:inset(0 100% 0 0);transform:translateX(-12px)}to{clip-path:inset(0 0 0 0);transform:none}}
.showF-3.showF-glow .showF-row{animation:showF-rowglow 1.1s var(--ease) both}
@keyframes showF-rowglow{0%,100%{box-shadow:0 1px 2px rgba(21,35,59,.05),0 18px 40px -28px rgba(21,35,59,.35)}
  40%{box-shadow:0 0 0 2px rgba(231,162,60,.75),0 0 44px -6px rgba(226,92,15,.45),0 18px 40px -28px rgba(21,35,59,.35)}}
.showF-ring{position:absolute;inset:12px;border-radius:26px;border:2px solid var(--gold);pointer-events:none;opacity:0;z-index:3}
.showF-ring.showF-go{animation:showF-ring 1.2s var(--ease) both}
@keyframes showF-ring{0%{opacity:0;transform:scale(.985);box-shadow:inset 0 0 0 0 rgba(231,162,60,0),0 0 0 0 rgba(231,162,60,0)}
  35%{opacity:.95;box-shadow:inset 0 0 60px -10px rgba(231,162,60,.45),0 0 40px 2px rgba(231,162,60,.35)}
  100%{opacity:0;transform:scale(1);box-shadow:inset 0 0 0 0 rgba(231,162,60,0),0 0 0 0 rgba(231,162,60,0)}}

/* ---- handout ---- */
.showF-ho{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:56px;align-items:center;margin-top:26px;max-width:1220px}
.showF-list{display:flex;flex-direction:column;gap:12px}
.showF-hr{position:relative;display:flex;align-items:center;gap:18px;padding:12px 64px 12px 16px;border-radius:16px;background:#fff;
  border:1px solid rgba(21,35,59,.08);box-shadow:0 1px 2px rgba(21,35,59,.05),0 18px 40px -28px rgba(21,35,59,.35);cursor:pointer}
.showF-ht b{display:block;font:600 22px/1.2 var(--serif);font-optical-sizing:auto;color:var(--navy)}
.showF-ht span{display:block;font-size:19px;line-height:1.4;color:var(--ink-soft);margin-top:3px}
.showF-sent{position:absolute;right:18px;top:50%;margin-top:-15px;width:30px;height:30px;border-radius:50%;background:#1E7A3C;display:grid;place-items:center}
.showF-sent svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.showF-sent.step{transform:scale(.3)}
.showF-sent.step.step-on{transform:none;transition:opacity .3s var(--ease),transform .45s cubic-bezier(.2,1.5,.3,1)}
.showF-hr.showF-blink{animation:showF-flash .7s var(--ease)}
@keyframes showF-flash{0%{box-shadow:0 0 0 0 rgba(226,92,15,0),0 18px 40px -28px rgba(21,35,59,.35)}
  30%{box-shadow:0 0 0 2px rgba(226,92,15,.7),0 0 30px -6px rgba(226,92,15,.45)}100%{box-shadow:0 0 0 0 rgba(226,92,15,0),0 18px 40px -28px rgba(21,35,59,.35)}}
.showF-pile{position:relative;height:440px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;cursor:pointer;counter-reset:showF-pg}
.showF-stack{position:relative;width:200px;height:256px}
.showF-stack::before{content:"";position:absolute;inset:-10px;border-radius:20px;border:1.5px dashed rgba(21,35,59,.16)}
.showF-stack::before{transition:opacity .4s var(--ease)}
.showF-stack:not(:has(.showF-page:is(.step-on,:not(.step))))::before{opacity:0}
.showF-count{transition:opacity .35s var(--ease),translate .35s var(--ease)}
.showF-pile:not(:has(.showF-page:is(.step-on,:not(.step)))) .showF-count{opacity:0;translate:-10px 0}
.showF-stack::after{content:"";position:absolute;inset:-70px;border-radius:50%;pointer-events:none;z-index:-1;opacity:0;
  background:radial-gradient(closest-side,rgba(231,162,60,.42),rgba(226,92,15,.12) 55%,transparent);transition:opacity .8s var(--ease)}
.showF-stack:has(.showF-clip:is(.step-on,:not(.step)))::after{opacity:.7}
.showF-stack.showF-glow::after{animation:showF-halo 1.2s var(--ease)}
@keyframes showF-halo{0%{opacity:0;transform:scale(.8)}40%{opacity:1;transform:scale(1.08)}100%{opacity:.7;transform:none}}
.showF-page{--pos:translate(calc(var(--i) * 3px),calc(var(--i) * -3px)) rotate(var(--r));position:absolute;inset:0;pointer-events:none;
  background:#fff;border-radius:14px;border:1px solid rgba(21,35,59,.1);box-shadow:0 2px 4px rgba(21,35,59,.06),0 22px 40px -26px rgba(21,35,59,.45);
  padding:42px 20px 20px;display:flex;flex-direction:column;gap:12px;transform:var(--pos);counter-increment:showF-pg;
  transition:transform .7s cubic-bezier(.2,1.15,.3,1),opacity .35s var(--ease)}
.showF-page b{font:600 19px/1.25 var(--serif);font-optical-sizing:auto;color:var(--navy);margin:4px 0 6px}
.showF-ln{display:block;height:7px;border-radius:4px;background:rgba(21,35,59,.08)}
.showF-ln.s{width:62%}
.showF-page.step{opacity:0;transform:translateX(-320px) rotate(-9deg);counter-increment:none}
.showF-page.step.step-on{opacity:1;transform:var(--pos);counter-increment:showF-pg}
.showF-page.showF-fly{animation:showF-fly .7s cubic-bezier(.2,1.1,.3,1) both}
@keyframes showF-fly{from{opacity:0;transform:translateX(-320px) rotate(-9deg)}35%{opacity:1}to{opacity:1;transform:var(--pos)}}
.showF-stack.showF-fan .showF-page:is(.step-on,:not(.step)){transform:translateX(calc((var(--i) - 2) * 62px)) rotate(calc((var(--i) - 2) * 5deg))}
.showF-clip{position:absolute;left:50%;top:-46px;width:96px;height:64px;margin-left:-48px;z-index:9;filter:drop-shadow(0 6px 8px rgba(21,35,59,.25))}
.showF-clip svg{display:block;width:100%;height:100%}
.showF-stack.showF-fan .showF-clip{opacity:0;transform:translateX(-24px);transition:opacity .25s var(--ease),transform .35s var(--ease)}
.showF-clip.step{transform:translateX(-40px) scale(1.3) rotate(-8deg)}
.showF-clip.step.step-on{transform:none;transition:opacity .2s var(--ease),transform .34s cubic-bezier(.2,1.5,.3,1)}
.showF-clip.showF-snap{animation:showF-snap .42s cubic-bezier(.2,1.5,.3,1) both}
@keyframes showF-snap{0%{opacity:0;transform:translateX(-40px) scale(1.3) rotate(-8deg)}60%{opacity:1;transform:scale(.92)}100%{opacity:1;transform:none}}
.showF-count{padding:10px 20px;border-radius:99px;background:#fff;border:1px solid rgba(21,35,59,.1);box-shadow:0 10px 24px -18px rgba(21,35,59,.5)}
.showF-cn::before{content:counter(showF-pg) " of " attr(data-n);font:700 18px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--navy);font-variant-numeric:tabular-nums}
.showF-count.showF-pop{animation:showF-tickc .45s cubic-bezier(.2,1.5,.3,1)}
@keyframes showF-tickc{from{transform:scale(1.18);box-shadow:0 0 0 3px rgba(226,92,15,.35)}to{transform:none}}

/* ---- reps ---- */
.showF-rp{display:grid;grid-template-columns:1fr 1fr;gap:24px 26px;margin-top:44px;max-width:1220px}
.showF-card{position:relative;background:#fff;border-radius:18px;padding:22px 24px 20px;border:1px solid rgba(21,35,59,.08);cursor:pointer;
  box-shadow:0 1px 2px rgba(21,35,59,.05),0 18px 40px -28px rgba(21,35,59,.35)}
#stage .scene .showF-card{transition:translate .28s var(--ease),transform .45s cubic-bezier(.2,1.3,.3,1),opacity .3s var(--ease),box-shadow .3s var(--ease)}
.showF-pill{display:flex;align-items:center;gap:14px;height:62px;padding:0 10px 0 24px;border-radius:99px;background:var(--paper);border:1.5px solid rgba(21,35,59,.14)}
.showF-q{flex:1;min-width:0;font:600 24px/1.2 var(--font);color:var(--navy);white-space:nowrap;overflow:hidden}
.showF-send{flex:none;width:42px;height:42px;border-radius:50%;background:var(--orange);display:grid;place-items:center;transition:opacity .3s var(--ease)}
.showF-send svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.showF-send.showF-nudge svg{animation:showF-nudge .5s cubic-bezier(.2,1.4,.3,1)}
@keyframes showF-nudge{0%{transform:none}45%{transform:translateX(6px)}100%{transform:none}}
.showF-one{font-size:20px;line-height:1.45;color:var(--ink-soft);margin:14px 6px 0;transition:opacity .45s var(--ease),transform .45s var(--ease)}
.showF-card.showF-pre{opacity:0;transform:translateX(-14px)}
.showF-card.showF-wait .showF-one{opacity:0;transform:translateX(-10px);transition:none}
.showF-card.showF-wait .showF-send{opacity:.35;transition:none}
.showF-rp:is(.showF-spinning,.showF-picked) .showF-card{opacity:.55}
.showF-rp .showF-card.showF-hot{opacity:1;box-shadow:0 0 0 3px var(--orange),0 18px 40px -24px rgba(226,92,15,.55);transition:none}
.showF-rp .showF-card.showF-pick{opacity:1;transform:scale(1.06);z-index:2;box-shadow:0 0 0 3px var(--orange),0 0 50px -8px rgba(226,92,15,.5),0 30px 60px -36px rgba(21,35,59,.45)}
.showF-br{display:flex;align-items:center;gap:44px;margin-top:52px;max-width:1220px}
.showF-blank{flex:none;width:440px;height:84px;border-radius:20px;background:#fff;border:1.5px solid rgba(21,35,59,.16);display:flex;align-items:center;
  justify-content:space-between;padding:0 14px 0 28px;cursor:pointer;box-shadow:0 1px 2px rgba(21,35,59,.05),0 18px 40px -28px rgba(21,35,59,.35);
  transition:opacity .5s var(--ease),transform .5s var(--ease),translate .28s var(--ease),box-shadow .3s var(--ease)}
.showF-blank:hover{translate:4px 0;box-shadow:0 0 0 1px rgba(226,92,15,.24),0 26px 50px -30px rgba(226,92,15,.6)}
.showF-blank .showF-send{opacity:.35}
.showF-caret{width:3px;height:36px;border-radius:2px;background:var(--orange)}
.scene.on .showF-caret{animation:showF-caret 1.06s steps(1) infinite}
@keyframes showF-caret{50%{opacity:0}}
.showF-blank.showF-blink{animation:showF-flash .8s var(--ease)}
.showF-hl.hl{margin:0;flex:1;min-width:0}
.showF-hl.step{transform:none;clip-path:inset(0 100% 0 0);transition:clip-path .9s cubic-bezier(.77,0,.18,1),opacity .2s var(--ease)}
.showF-hl.step.step-on{clip-path:inset(0 0 0 0)}

@media (prefers-reduced-motion:reduce){
  [class*="showF-"],[class*="showF-"]::before,[class*="showF-"]::after,[class*="showF-"] svg{animation:none!important}
}
@media print{
  [class*="showF-"],[class*="showF-"]::before,[class*="showF-"]::after,[class*="showF-"] svg{animation:none!important}
  .showF-ring{display:none}
}

/* ==== part: journey ==== */
/* ===== journey: the Probability to Possibility rail and the J journey map ===== */
#journey-rail{position:absolute;left:80px;top:16px;width:1280px;height:30px;z-index:40;cursor:pointer;
  --jr-ink:rgba(21,35,59,.30);--jr-txt:rgba(21,35,59,.62);--jr-hollow:var(--paper,#fbf8f2);
  font-family:'Public Sans',var(--font,system-ui),sans-serif;opacity:1;transition:opacity .5s var(--ease,cubic-bezier(.2,.8,.2,1))}
#journey-rail.journey-dark{--jr-ink:rgba(255,255,255,.45);--jr-txt:rgba(255,255,255,.72);--jr-hollow:var(--navy,#15233b)}
#journey-rail.journey-off{opacity:0;pointer-events:none}
#journey-rail.journey-watch{pointer-events:none;cursor:default}
.journey-end{position:absolute;top:0;line-height:16px;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--jr-txt);transition:color .5s var(--ease,ease)}
.journey-end.journey-in{left:0}.journey-end.journey-out{right:0;letter-spacing:.18em;margin-right:-.18em}
.journey-end.journey-reached{color:var(--orange,#e25c0f)}
.journey-track{position:absolute;left:72px;right:72px;top:7.25px;height:1.5px;background:var(--jr-ink);border-radius:1px;
  transition:background .5s var(--ease,ease)}
.journey-fill{position:absolute;left:0;top:0;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);
  background:linear-gradient(90deg,rgba(226,92,15,.25),var(--orange,#e25c0f));border-radius:1px;
  transition:transform .7s cubic-bezier(.2,1.25,.3,1)}
.journey-stn{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;
  border:1.5px solid var(--jr-ink);background:var(--jr-hollow);transition:background .4s,border-color .4s,transform .4s var(--ease,ease)}
.journey-stn.journey-passed{background:var(--orange,#e25c0f);border-color:var(--orange,#e25c0f)}
.journey-stn.journey-here{transform:scale(1.25)}
.journey-trav{position:absolute;top:50%;left:0;width:0;height:0;transform:translateX(0);
  transition:transform .7s cubic-bezier(.2,1.25,.3,1)}
.journey-dot{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--orange,#e25c0f);
  box-shadow:0 0 0 3px rgba(226,92,15,.18),0 0 14px 3px rgba(226,92,15,.45)}
.journey-trail{position:absolute;right:0;top:-.75px;width:54px;height:1.5px;transform-origin:100% 50%;
  background:linear-gradient(90deg,rgba(231,162,60,0),var(--gold,#e7a23c) 70%,var(--orange,#e25c0f));
  transition:transform .7s var(--ease,ease),opacity .7s}
.journey-trav.journey-moving .journey-trail{transform:scaleX(2.2)}
.journey-ping{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--orange,#e25c0f);opacity:0}
.journey-trav.journey-pinged .journey-ping{animation:journey-ping .7s var(--ease,ease)}
@keyframes journey-ping{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
.journey-ttl{position:absolute;left:0;top:17px;height:14px;white-space:nowrap;font-size:13px;line-height:14px;font-weight:600;
  color:var(--jr-txt);transform:translateX(0);transition:transform .7s cubic-bezier(.2,1.25,.3,1)}
.journey-ttl span{position:absolute;left:0;top:0;opacity:0;transform:translateX(-8px);
  transition:opacity .45s var(--ease,ease),transform .45s var(--ease,ease)}
.journey-ttl span.journey-show{opacity:1;transform:none}
#journey-rail:hover .journey-dot{box-shadow:0 0 0 4px rgba(226,92,15,.25),0 0 22px 6px rgba(226,92,15,.55)}
#journey-rail:hover .journey-track{background:color-mix(in srgb,var(--jr-ink) 60%,var(--orange,#e25c0f))}
#journey-rail:hover .journey-ttl{color:var(--orange,#e25c0f)}
#journey-rail:active .journey-dot{transform:scale(.85)}

/* the map overlay (J) */
#journey-map{position:absolute;inset:0;z-index:60;display:none;overflow:hidden;color:#fff;cursor:default;
  font-family:'Public Sans',var(--font,system-ui),sans-serif;
  background:radial-gradient(900px 620px at 92% 4%,rgba(226,92,15,.22),transparent 62%),
    radial-gradient(700px 520px at 6% 104%,rgba(231,162,60,.08),transparent 60%),
    linear-gradient(160deg,var(--navy,#15233b) 0%,var(--navy-deep,#0f1a2e) 100%)}
#journey-map.journey-open{display:block;animation:journey-fade .45s var(--ease,ease) both}
#journey-map.journey-closing{display:block;animation:journey-fadeout .3s var(--ease,ease) both;pointer-events:none}
@keyframes journey-fade{from{opacity:0}to{opacity:1}}
@keyframes journey-fadeout{from{opacity:1}to{opacity:0}}
.journey-grid{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:48px 48px;-webkit-mask-image:radial-gradient(900px 600px at 50% 50%,#000,transparent 75%);mask-image:radial-gradient(900px 600px at 50% 50%,#000,transparent 75%)}
.journey-grain{position:absolute;inset:-40px;pointer-events:none;opacity:.06;background-size:180px 180px;
  animation:journey-grain 1s steps(6) infinite}
@keyframes journey-grain{0%{background-position:0 0}20%{background-position:-37px 21px}40%{background-position:23px -44px}
  60%{background-position:-12px 36px}80%{background-position:41px 9px}100%{background-position:0 0}}
#journey-map.journey-paused *{animation-play-state:paused!important}
.journey-head{position:absolute;left:80px;top:64px}
.journey-head .journey-kick{font-size:14px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--orange,#e25c0f);
  display:flex;align-items:center;gap:12px;margin-bottom:14px}
.journey-head .journey-kick::before{content:"";width:22px;height:1.5px;background:var(--orange,#e25c0f)}
.journey-head h2{margin:0;font-family:'Fraunces',var(--serif,Georgia),serif;font-optical-sizing:auto;font-weight:700;font-size:56px;
  line-height:1.04;letter-spacing:-.015em;color:#fff}
.journey-head h2 em{font-style:italic;font-weight:500;color:var(--orange,#e25c0f)}
.journey-svg{position:absolute;left:0;top:0;width:1440px;height:810px;pointer-events:none;overflow:visible}
.journey-arc{fill:none;stroke:rgba(255,255,255,.22);stroke-width:2;stroke-linecap:round}
.journey-arc-glow{fill:none;stroke:rgba(231,162,60,.10);stroke-width:14;stroke-linecap:round;filter:blur(6px)}
.journey-arc-done{fill:none;stroke:url(#journey-grad);stroke-width:3.5;stroke-linecap:round}
.journey-open .journey-arc,.journey-open .journey-arc-glow{animation:journey-draw 1.2s cubic-bezier(.65,0,.35,1) both}
@keyframes journey-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.journey-mend{position:absolute;font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.62);white-space:nowrap}
.journey-mend.journey-reached{color:var(--orange,#e25c0f)}
.journey-open .journey-mend{animation:journey-pop .5s var(--ease,ease) both}
.journey-st{position:absolute;width:0;height:0;cursor:pointer}
.journey-open .journey-st{animation:journey-pop .55s cubic-bezier(.2,1.3,.3,1) both}
@keyframes journey-pop{from{opacity:0;transform:translateX(-14px) scale(.7)}to{opacity:1;transform:none}}
.journey-bdg{position:absolute;left:-24px;top:-24px;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;
  font-family:'Fraunces',var(--serif,Georgia),serif;font-weight:600;font-size:20px;font-variant-numeric:lining-nums;
  border:1.5px solid rgba(255,255,255,.5);color:rgba(255,255,255,.85);background:var(--navy,#15233b);
  transition:transform .3s var(--ease,ease),box-shadow .3s var(--ease,ease),background .3s,border-color .3s}
.journey-st.journey-passed .journey-bdg{background:var(--orange,#e25c0f);border-color:var(--orange,#e25c0f);color:#fff}
.journey-st.journey-here .journey-bdg{background:var(--orange,#e25c0f);border-color:var(--gold,#e7a23c);color:#fff;
  box-shadow:0 0 0 5px rgba(226,92,15,.22),0 0 34px 6px rgba(226,92,15,.45)}
.journey-halo{position:absolute;left:-36px;top:-36px;width:72px;height:72px;border-radius:18px;border:1.5px solid var(--gold,#e7a23c);
  opacity:0;pointer-events:none}
.journey-st.journey-here .journey-halo{animation:journey-pulse 2.4s ease-in-out infinite}
@keyframes journey-pulse{0%,100%{opacity:.15}50%{opacity:.75}}
.journey-lbl{position:absolute;top:34px;left:-24px;width:300px}
.journey-st.journey-left .journey-lbl{left:auto;right:40px;top:-50px;text-align:right}
.journey-lbl b{display:block;font-family:'Fraunces',var(--serif,Georgia),serif;font-optical-sizing:auto;font-weight:600;font-size:24px;
  line-height:1.15;letter-spacing:-.01em;color:#fff;transition:color .3s}
.journey-lbl small{display:block;margin-top:6px;font-size:18px;font-weight:500;color:rgba(255,255,255,.66);font-variant-numeric:tabular-nums}
.journey-st.journey-passed .journey-lbl small,.journey-st.journey-here .journey-lbl small{color:var(--gold,#e7a23c)}
.journey-st:hover .journey-bdg,.journey-st.journey-focus .journey-bdg{transform:translateX(4px) scale(1.06);
  box-shadow:0 0 0 5px rgba(231,162,60,.25),0 0 30px 8px rgba(231,162,60,.35)}
.journey-st:hover .journey-lbl b,.journey-st.journey-focus .journey-lbl b{color:var(--gold,#e7a23c)}
.journey-st:active .journey-bdg{transform:translateX(4px) scale(.94)}
.journey-mtrav{position:absolute;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 40% 40%,#fff 0 18%,var(--gold,#e7a23c) 30%,var(--orange,#e25c0f) 70%);
  box-shadow:0 0 0 4px rgba(226,92,15,.25),0 0 26px 8px rgba(226,92,15,.55)}
#journey-map.journey-jump .journey-st.journey-target .journey-bdg{animation:journey-flash .35s var(--ease,ease)}
@keyframes journey-flash{50%{transform:scale(1.18);box-shadow:0 0 0 10px rgba(231,162,60,.3),0 0 44px 12px rgba(231,162,60,.6)}}
@media print{#journey-rail,#journey-map{display:none!important}}

/* ==== part: maisie ==== */
/* ===== maisie: the live Maisie layer (Ask button, popover, cards, marks, edits, bubble, toasts) ===== */
.maisie-ui{font-family:var(--font);color:var(--navy);-webkit-font-smoothing:antialiased}
.maisie-ui button{font-family:var(--font);cursor:pointer}
.maisie-av{display:block;border-radius:50%;object-fit:cover;background:var(--cream)}

/* Ask Maisie button, bottom right of the stage */
.maisie-ask{position:absolute;right:28px;bottom:26px;z-index:45;width:64px;height:64px}
.maisie-fab{position:relative;width:64px;height:64px;padding:0;border:0;border-radius:50%;background:#fff;
  box-shadow:0 0 0 2px var(--orange),0 14px 30px -12px rgba(15,26,46,.55);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.maisie-fab .maisie-av{width:64px;height:64px;transition:filter .4s var(--ease),opacity .4s var(--ease)}
.maisie-fab:hover{transform:translateX(-4px);box-shadow:0 0 0 2px var(--orange),0 0 0 8px rgba(226,92,15,.16),0 18px 36px -12px rgba(15,26,46,.6)}
.maisie-fab:active{transform:translateX(-4px) scale(.94)}
.maisie-ring{position:absolute;inset:-6px;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .3s var(--ease);
  background:conic-gradient(from 0deg,rgba(226,92,15,0),var(--orange) 55%,var(--gold) 80%,rgba(231,162,60,0));
  -webkit-mask:radial-gradient(circle,transparent 34px,#000 35px);mask:radial-gradient(circle,transparent 34px,#000 35px)}
.maisie-busy .maisie-ring{opacity:1;animation:maisie-spin .9s linear infinite}
@keyframes maisie-spin{to{transform:rotate(360deg)}}
.maisie-pill{position:absolute;right:40px;top:12px;height:40px;display:flex;align-items:center;gap:8px;padding:0 36px 0 18px;border-radius:20px;
  background:var(--navy);color:#fff;font-size:15px;font-weight:700;letter-spacing:.02em;white-space:nowrap;pointer-events:none;
  clip-path:inset(0 0 0 100% round 20px);transition:clip-path .45s var(--ease)}
.maisie-pill kbd{background:rgba(255,255,255,.14);color:#fff}
.maisie-ask:hover .maisie-pill,.maisie-ask.maisie-open .maisie-pill{clip-path:inset(-16px -16px -16px -16px round 20px)}
/* a paper ring and a lifted shadow, so the pill reads as floating even over a navy band */
.maisie-pill{box-shadow:0 0 0 2px rgba(251,248,242,.96),0 14px 28px -10px rgba(15,26,46,.6)}
.maisie-ask.maisie-dk .maisie-pill{box-shadow:0 0 0 1.5px rgba(255,255,255,.28),0 14px 28px -10px rgba(0,0,0,.7)}
.maisie-count{position:absolute;left:-4px;top:-4px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--orange);color:#fff;
  font-size:13px;font-weight:700;display:none;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff;pointer-events:none}
.maisie-count.on{display:flex;animation:maisie-pop .5s cubic-bezier(.2,1.3,.3,1) both}
@keyframes maisie-pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.maisie-off .maisie-fab{box-shadow:0 0 0 2px #aab4c5,0 14px 30px -12px rgba(15,26,46,.45)}
.maisie-off .maisie-fab .maisie-av{filter:grayscale(1);opacity:.55}
.maisie-live-dot{position:absolute;right:1px;bottom:3px;width:14px;height:14px;border-radius:50%;background:#1E7A3C;box-shadow:0 0 0 2.5px #fff;pointer-events:none}
.maisie-off .maisie-live-dot{background:#9aa6ba}

/* popover */
.maisie-pop{position:absolute;right:28px;bottom:104px;z-index:48;width:420px;max-height:640px;overflow:auto;display:none;padding:22px 22px 20px;
  background:#fff;border-radius:18px;border:1px solid rgba(21,35,59,.08);box-shadow:0 1px 2px rgba(21,35,59,.06),0 30px 70px -30px rgba(15,26,46,.6)}
.maisie-pop.open{display:block;animation:maisie-in .35s var(--ease) both}
@keyframes maisie-in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.maisie-hd{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.maisie-hd .maisie-av{width:40px;height:40px;box-shadow:0 0 0 2px var(--orange)}
.maisie-hd .maisie-tt{flex:1;min-width:0}
.maisie-hd b{display:block;font-size:18px;font-weight:700;color:var(--navy);line-height:1.25}
.maisie-hd small{display:block;font-size:14px;color:#7d899c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.maisie-x{width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:#7d899c;font-size:20px;line-height:1;transition:background .2s,color .2s}
.maisie-x:hover{background:var(--cream);color:var(--navy)}
.maisie-row{display:flex;gap:10px;margin-bottom:14px}
.maisie-b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:10px;border:1.5px solid var(--orange);
  background:var(--orange);color:#fff;font-size:15px;font-weight:700;transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s,opacity .2s}
.maisie-b:hover{transform:translateX(3px);box-shadow:0 10px 22px -12px rgba(226,92,15,.9)}
.maisie-b:active{transform:translateX(3px) scale(.97)}
.maisie-b.ghost{background:#fff;color:var(--navy);border-color:rgba(21,35,59,.18)}
.maisie-b.ghost:hover{border-color:var(--navy);box-shadow:0 10px 22px -14px rgba(21,35,59,.5)}
.maisie-b[disabled]{opacity:.45;pointer-events:none}
.maisie-b svg{width:18px;height:18px;flex:none}
.maisie-row .maisie-b:first-child{flex:1}
.maisie-form{display:flex;gap:8px}
.maisie-in{flex:1;min-width:0;height:46px;padding:0 14px;border-radius:10px;border:1.5px solid rgba(21,35,59,.16);background:var(--paper);
  font:500 16px var(--font);color:var(--navy);outline:none;transition:border-color .2s,box-shadow .2s}
.maisie-in:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(226,92,15,.14);background:#fff}
.maisie-in::placeholder{color:#9aa6ba}
.maisie-send{width:46px;height:46px;flex:none;padding:0}
.maisie-st{margin-top:12px;font-size:16px;line-height:1.45;color:var(--ink-soft);min-height:0}
.maisie-st:empty{display:none}
.maisie-st.reply{padding-left:12px;border-left:3px solid var(--orange);color:var(--navy)}
.maisie-st.err{color:#B32A2A;font-weight:600}
.maisie-think{font-weight:700;background:linear-gradient(90deg,#9aa6ba 0%,#9aa6ba 35%,var(--orange) 50%,#9aa6ba 65%,#9aa6ba 100%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:maisie-shim 1.3s linear infinite}
@keyframes maisie-shim{from{background-position:100% 0}to{background-position:-120% 0}}
.maisie-offline{font-size:16px;line-height:1.45;color:var(--ink-soft);background:var(--cream);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.maisie-pl{margin-top:16px;padding-top:14px;border-top:1px solid rgba(21,35,59,.1)}
.maisie-pl>b{display:block;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#7d899c;margin-bottom:10px}
.maisie-pl .maisie-toast{box-shadow:none;border:1px solid rgba(21,35,59,.1);border-left:3px solid var(--orange);margin-bottom:8px;animation:none}

/* pending toasts, top right below the journey rail and the REC pill */
.maisie-toasts{position:absolute;right:28px;top:66px;z-index:47;width:380px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.maisie-toast{pointer-events:auto;background:#fff;border-radius:14px;padding:14px 16px 14px 18px;position:relative;overflow:hidden;
  border:1px solid rgba(21,35,59,.08);box-shadow:0 1px 2px rgba(21,35,59,.06),0 22px 44px -26px rgba(15,26,46,.6);
  animation:maisie-toastin .5s var(--ease) both;transition:opacity .3s var(--ease),transform .3s var(--ease)}
.maisie-toast::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--orange)}
@keyframes maisie-toastin{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:none}}
.maisie-toast.maisie-go{opacity:0;transform:translateX(44px)}
.maisie-toast.maisie-wait{opacity:.6;pointer-events:none}
.maisie-tfrom{font-size:13px;font-weight:600;color:#7d899c;margin-bottom:6px}
.maisie-tfrom b{color:var(--navy);font-weight:700}
.maisie-kind{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--orange-deep);
  background:rgba(226,92,15,.1);border-radius:6px;padding:2px 7px;margin-right:6px;vertical-align:1px}
.maisie-tgt{font-size:14px;font-weight:600;color:var(--ink-soft)}
.maisie-ttx{font-size:17px;line-height:1.4;color:var(--navy);margin:8px 0 12px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.maisie-tb{display:flex;gap:8px}
.maisie-tb .maisie-b{height:36px;padding:0 14px;font-size:14px}
.maisie-tb kbd{background:rgba(255,255,255,.2);color:inherit;margin-left:2px}
.maisie-tb .ghost kbd{background:rgba(21,35,59,.08)}
.maisie-tmore{pointer-events:auto;align-self:flex-end;font-size:13px;font-weight:700;color:#fff;background:var(--navy);border-radius:12px;padding:4px 12px}

/* context cards dock, inside the scene, right edge */
.maisie-dock{position:absolute;right:28px;top:108px;z-index:30;width:380px;display:flex;flex-direction:column;align-items:flex-end;gap:10px;max-height:600px;pointer-events:none}
.maisie-dock{transition:transform .35s var(--ease)}
.maisie-dock>*{pointer-events:auto}
.maisie-chips{display:flex;gap:8px}
.maisie-tab{display:none;position:relative;width:48px;height:48px;padding:0;border:0;border-radius:50%;background:#fff;cursor:pointer;
  box-shadow:0 0 0 2px var(--orange),0 12px 26px -12px rgba(15,26,46,.6);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.maisie-tab .maisie-av{width:48px;height:48px}
.maisie-tab b{position:absolute;left:-6px;top:-6px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--orange);color:#fff;
  font:700 12px/22px var(--font);text-align:center;box-shadow:0 0 0 2px #fff}
.maisie-tab:hover{transform:translateX(-4px);box-shadow:0 0 0 2px var(--orange),0 0 0 8px rgba(226,92,15,.15),0 16px 30px -12px rgba(15,26,46,.65)}
.maisie-tucked .maisie-tab{display:block;animation:maisie-tabin .45s var(--ease) both}
.maisie-tucked .maisie-card,.maisie-tucked .maisie-chips{display:none!important}
.maisie-tucking .maisie-card,.maisie-tucking .maisie-chips{animation:maisie-tuckout .38s var(--ease) both!important}
@keyframes maisie-tabin{from{opacity:0;transform:translateX(30px) scale(.8)}to{opacity:1;transform:none}}
@keyframes maisie-tuckout{to{opacity:0;transform:translateX(60px)}}
.dark .maisie-tab{box-shadow:0 0 0 2px var(--orange),0 12px 26px -10px rgba(0,0,0,.7)}
.dark .maisie-tab b{box-shadow:0 0 0 2px var(--navy)}
.maisie-dock.maisie-all{overflow:auto;padding:4px 4px 8px 20px;margin-right:-4px}
.maisie-card{position:relative;width:100%;text-align:left;background:#fff;color:var(--navy);border-radius:16px;padding:14px 18px 16px 21px;cursor:pointer;
  border:1px solid rgba(21,35,59,.08);box-shadow:0 1px 2px rgba(21,35,59,.06),0 24px 48px -28px rgba(15,26,46,.55);
  transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.maisie-card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--orange)}
.maisie-card:hover{transform:translateX(-4px);box-shadow:0 0 0 1px rgba(226,92,15,.25),0 30px 60px -32px rgba(15,26,46,.6)}
.maisie-card.maisie-old{display:none}
.maisie-all .maisie-card.maisie-old{display:block}
.maisie-ch{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.maisie-ch .maisie-av{width:36px;height:36px;box-shadow:0 0 0 2px var(--orange)}
.maisie-ch span{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--orange-deep)}
.maisie-ct{margin:0;font-size:18px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.maisie-card.maisie-open .maisie-ct,.maisie-ct.typing{display:block;-webkit-line-clamp:unset}
.dark .maisie-card{background:#1d3155;color:rgba(255,255,255,.92);border-color:rgba(255,255,255,.08)}
.dark .maisie-ch span{color:var(--gold)}
.scene.on .maisie-card{animation:maisie-cardin .5s var(--ease) both}
.scene.on .maisie-card:nth-child(3){animation-delay:.12s}
@keyframes maisie-cardin{0%{opacity:0;transform:translateX(56px);box-shadow:8px 0 0 -2px var(--gold),0 0 40px rgba(231,162,60,.55)}
  60%{opacity:1;box-shadow:3px 0 0 -1px var(--gold),0 0 30px rgba(231,162,60,.4)}
  100%{opacity:1;transform:none}}
.maisie-more{height:32px;padding:0 14px;border:0;border-radius:16px;background:var(--navy);color:#fff;font:700 14px var(--font);cursor:pointer;
  box-shadow:0 10px 20px -12px rgba(15,26,46,.7);transition:transform .2s var(--ease)}
.maisie-more:hover{transform:translateX(-4px)}
.dark .maisie-more{background:var(--orange)}

/* marks: a translucent orange band that sweeps in left to right */
.maisie-mark{color:inherit;background:linear-gradient(90deg,rgba(226,92,15,.26),rgba(231,162,60,.34)) no-repeat 0 0/100% 100%;
  border-radius:4px;padding:0 .1em;margin:0 -.1em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.dark .maisie-mark{background-image:linear-gradient(90deg,rgba(226,92,15,.5),rgba(231,162,60,.45))}
.scene.on .maisie-mark{animation:maisie-mark .9s var(--ease) .4s both}
@keyframes maisie-mark{from{background-size:0% 100%}to{background-size:100% 100%}}

/* edits: underline sweep plus the "edited by Maisie" tag */
.maisie-ed{background:linear-gradient(90deg,var(--orange),var(--gold)) no-repeat 0 100%/100% 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;
  padding-bottom:2px;animation:maisie-ul .8s var(--ease) .35s both}
@keyframes maisie-ul{from{background-size:0% 3px}to{background-size:100% 3px}}
.maisie-edwipe{animation:maisie-wipe .7s cubic-bezier(.77,0,.18,1) both}
@keyframes maisie-wipe{from{clip-path:inset(-10% 100% -10% 0)}to{clip-path:inset(-10% -2% -10% 0)}}
.maisie-tag{position:absolute;z-index:31;display:flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 4px;border-radius:16px;background:#fff;
  color:var(--navy);font:600 14px var(--font);white-space:nowrap;pointer-events:none;box-shadow:0 0 0 1.5px rgba(226,92,15,.5),0 12px 24px -14px rgba(15,26,46,.6);
  animation:maisie-in .4s var(--ease) both;transition:opacity .5s var(--ease),transform .5s var(--ease)}
.maisie-tag .maisie-av{width:24px;height:24px}
.maisie-tag.maisie-go{opacity:0;transform:translateX(16px)}
.dark .maisie-tag{background:var(--navy-2);color:#fff}

/* say bubble, bottom left of the stage */
.maisie-say{position:absolute;left:28px;bottom:26px;z-index:46;display:none;align-items:flex-end;gap:12px;max-width:640px;pointer-events:none;transition:bottom .45s var(--ease)}
.maisie-say.on{display:flex;animation:maisie-sayin .55s var(--ease) both}
.maisie-say.maisie-go{animation:maisie-sayout .5s var(--ease) both}
@keyframes maisie-sayin{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes maisie-sayout{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-60px)}}
.maisie-say>.maisie-av{width:56px;height:56px;flex:none;box-shadow:0 0 0 2px var(--orange),0 12px 26px -12px rgba(15,26,46,.6)}
.maisie-bub{position:relative;background:#fff;color:var(--navy);border-radius:18px 18px 18px 6px;padding:14px 20px 16px;
  box-shadow:0 1px 2px rgba(21,35,59,.06),0 26px 50px -28px rgba(15,26,46,.6);border:1px solid rgba(21,35,59,.08)}
.maisie-bub p{margin:0;font-size:20px;line-height:1.45;min-height:1.45em;white-space:pre-wrap;display:grid}
.maisie-bub p>span{grid-area:1/1}.maisie-ghost{visibility:hidden}
.maisie-toasts.maisie-hide,.maisie-toasts.maisie-hide *{opacity:0;pointer-events:none!important}.maisie-toasts{transition:opacity .25s var(--ease)}
.maisie-to{display:inline-block;margin-bottom:6px;font-size:13px;font-weight:700;letter-spacing:.06em;color:#fff;background:var(--orange);border-radius:10px;padding:2px 10px}
.maisie-to:empty{display:none}
.maisie-dk .maisie-bub{background:var(--navy-2);color:#fff;border-color:rgba(255,255,255,.1)}

/* voice chip and small notes, beside the button */
.maisie-voice{position:absolute;right:28px;bottom:104px;z-index:48;max-width:460px;display:none;align-items:center;gap:12px;padding:12px 18px;
  border-radius:24px;background:var(--navy);color:#fff;font-size:17px;line-height:1.35;box-shadow:0 0 0 1px rgba(255,255,255,.16),0 20px 40px -20px rgba(15,26,46,.8)}
.maisie-voice.on{display:flex;animation:maisie-in .3s var(--ease) both}
.maisie-voice i{width:10px;height:10px;flex:none;border-radius:50%;background:var(--orange);box-shadow:0 0 0 4px rgba(226,92,15,.3);animation:maisie-blink 1.1s ease-in-out infinite}
.maisie-voice b{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);flex:none}
@keyframes maisie-blink{50%{opacity:.35}}
.maisie-note{position:absolute;right:104px;bottom:38px;z-index:48;max-width:420px;padding:10px 16px;border-radius:12px;background:var(--navy);color:#fff;
  font-size:15px;font-weight:600;line-height:1.35;opacity:0;transform:translateX(-10px);transition:opacity .3s var(--ease),transform .3s var(--ease);pointer-events:none}
.maisie-note.on{opacity:1;transform:none}

@media print{.maisie-ask,.maisie-pop,.maisie-toasts,.maisie-say,.maisie-voice,.maisie-note,.maisie-tag{display:none!important}
  .maisie-card{animation:none!important;break-inside:avoid}.maisie-mark,.maisie-ed{animation:none!important}}
@media (prefers-reduced-motion:reduce){.maisie-mark{background-size:100% 100%}.maisie-ed{background-size:100% 3px}}

@media print{
  @page{size:1440px 810px;margin:0}
  html,body{height:auto;overflow:visible;background:#fff}
  #viewport{position:static;display:block;overflow:visible}#stage{position:static;transform:none!important;width:auto;height:auto;border-radius:0;box-shadow:none;overflow:visible}
  .scene{position:relative;width:1440px;height:810px;opacity:1;visibility:visible;break-after:page}
  .scene.private,#chrome,#bar,.zone,.ovl{display:none!important}
  .on .stagger>*{animation:none}
}
/* ==== part: showG ==== */
/* ===========================================================================
   showG: the scene types for "Think Possibility, Not Probability" (open, confess, ladder, where, system, move,
   cards, close, walkout), the Effects levels (html[data-fx]: calm, standard, full).
   Calm and clean by default: white space, one idea per scene, orange used sparingly.
   =========================================================================== */
.showG-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.showG-hd{position:relative;z-index:2}
#stage .showG-hd h1{max-width:1120px}
#stage .showG-hd .sub{max-width:62ch}
.showG-in{opacity:1}
.on .showG-in{animation:showG-rise .75s var(--ease-out) both;animation-delay:calc(var(--d,0) * 90ms + 60ms)}
@keyframes showG-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes showG-fade{from{opacity:0}to{opacity:1}}

/* ---- the curve: the cover draws it, the confession keeps it ---- */
.showG-curvew{position:absolute;left:0;right:0;bottom:0;height:100%}
.showG-curve{display:block;width:100%;height:100%;overflow:visible}
.showG-curve .ln{fill:none;stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke}
.showG-curve .base{stroke:rgba(255,255,255,.16);stroke-width:1;vector-effect:non-scaling-stroke}
.scene:not(.dark) .showG-curve .base{stroke:rgba(21,35,59,.14)}
.showG-curve .f{transition:opacity .7s var(--ease)}
.showG-curve .f-mid{fill:#aab4c5;opacity:.30}
.showG-curve .f-edge{fill:#e25c0f;opacity:.26}
.scene:not(.dark) .showG-curve .f-mid{fill:#7d899c;opacity:.22}
.scene:not(.dark) .showG-curve .f-edge{fill:#e25c0f;opacity:.2}
.t-open.on .showG-curve .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:showG-draw 1.2s var(--ease-out) .25s forwards}
.t-open.on .showG-curve .fills{animation:showG-fade .9s ease-out .55s both}
@keyframes showG-draw{to{stroke-dashoffset:0}}

/* ---- open (the cover) ---- */
.t-open{padding-bottom:0}
.showG-open{position:relative;flex:1;min-height:0}
.showG-open .logos{position:relative;z-index:2}
.showG-ct{position:relative;z-index:2;margin-top:58px;max-width:860px}
#stage .t-open h1{font-size:88px;line-height:1.03;max-width:none;color:#fff;margin:0;letter-spacing:-.018em}
#stage .t-open .kick{margin-bottom:22px}
#stage .t-open .sub{font-size:30px;line-height:1.35;color:rgba(255,255,255,.86);margin:30px 0 0;max-width:30ch}
.showG-meta{display:flex;flex-direction:column;gap:6px;margin-top:34px;font-size:19px;line-height:1.4;color:rgba(255,255,255,.68)}
.showG-meta b{color:#fff;font-weight:600}
.showG-port{position:absolute;right:20px;top:34px;margin:0;width:260px;text-align:center;z-index:2}
.showG-port img{width:230px;height:230px;object-fit:cover;object-position:50% 24%;display:block;margin:0 auto 16px}
.showG-port figcaption{font-size:17px;line-height:1.35;color:rgba(255,255,255,.76)}
.t-open .showG-curvew{left:-80px;right:-80px;bottom:0;height:176px;z-index:0}

/* ---- confess ---- */
.showG-conf{display:flex;flex-direction:column;flex:1;min-height:0}
.showG-cw{position:relative;margin-top:36px;height:156px;flex:none}
.showG-cw .showG-curvew{left:0;right:0;bottom:0;height:100%}
.showG-clab{position:absolute;font:700 14px/1 var(--font);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap}
.showG-clab.mid{left:50%;top:-4px;transform:translateX(-50%)}
.showG-clab.edge{bottom:30px;color:var(--orange-deep)}
.showG-clab.edge.l{left:6%}.showG-clab.edge.r{right:6%}
.showG-two{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:30px}
.showG-card{background:#fff;border:1px solid rgba(21,35,59,.08);border-radius:18px;box-shadow:var(--card-shadow);padding:26px 32px 28px}
.showG-card h3{margin:0 0 14px;font:700 14px/1.2 var(--font);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
.showG-card.alt h3{color:var(--orange-deep)}
.showG-card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.showG-card li{font:500 25px/1.3 var(--serif);color:var(--navy);letter-spacing:-.005em}
.showG-conf:has([data-col="1"].step-on):not(:has([data-col="2"].step-on)) .showG-curve .f-edge{opacity:.08}
.showG-conf:has([data-col="1"].step-on):not(:has([data-col="2"].step-on)) .showG-curve .f-mid{opacity:.5}
.showG-conf:has([data-col="2"].step-on) .showG-curve .f-mid{opacity:.1}
.showG-conf:has([data-col="2"].step-on) .showG-curve .f-edge{opacity:.46}

/* ---- live bars (the room, live): reusable for any scene that has bars + poll ---- */
.showG-live{display:flex;flex-direction:column;flex:1;min-height:0}
.showG-bars{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:44px;flex:1;min-height:0;margin:10px 28px 0}
.showG-bar{display:flex;flex-direction:column;min-height:0;min-width:0}
.showG-bar .trk{position:relative;flex:1;min-height:0;border-bottom:2px solid #41506b}
.showG-bar .fill{position:absolute;left:0;right:0;bottom:0;height:calc(var(--h) * 1%);border-radius:5px 5px 0 0;border-top:4px solid var(--teal);
  background:linear-gradient(180deg,rgba(43,179,163,.95),rgba(43,179,163,.16));transition:height 1.1s cubic-bezier(.2,.8,.2,1)}
.showG-bar.ask .fill{border-top-color:#f07a2a;background:linear-gradient(180deg,rgba(240,122,42,.95),rgba(240,122,42,.12))}
.showG-bar .pct{position:absolute;left:0;right:0;top:12px;text-align:center;font:600 44px/1 var(--serif);color:#fff;opacity:1;transition:opacity .4s}
.showG-bar .ico{position:absolute;left:50%;width:96px;height:96px;margin-left:-48px;color:#fff;bottom:calc(var(--h) * 1% + 12px);transition:bottom 1.1s cubic-bezier(.2,.8,.2,1)}
.showG-bar.ask .ico{color:#f07a2a}
.showG-bar h3{margin:16px 0 0;text-align:center;font:600 26px/1.15 var(--serif);color:#fff;letter-spacing:0}
.showG-bar.ask h3{color:#f07a2a}
.showG-bar p{margin:6px 0 0;text-align:center;font:400 17px/1.3 var(--font);color:#9aa6ba}
.showG-bars .wait{position:absolute;left:0;right:0;top:34%;text-align:center;font:italic 500 34px/1.2 var(--serif);color:rgba(255,255,255,.55);pointer-events:none;opacity:0;transition:opacity .5s}
.showG-bars[data-empty="1"] .wait{opacity:1}
.showG-bars[data-empty="1"] .pct{opacity:0}
.showG-foot{display:flex;align-items:center;justify-content:center;margin-top:14px;font:600 16px var(--font);color:var(--teal)}
.showG-foot i{width:9px;height:9px;border-radius:50%;background:currentColor;margin-right:10px;box-shadow:0 0 0 5px rgba(43,179,163,.18)}
@media (prefers-reduced-motion:reduce){.showG-bar .fill,.showG-bar .ico{transition:none}}
/* ---- ladder ---- */
.showG-lad{display:flex;flex-direction:column;flex:1;min-height:0}
.showG-lad{position:relative}
.tqr-panel{position:absolute;inset:-64px -80px;background:var(--navy-deep,#0f1a2e);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:5;text-align:center}

.showG-stp:nth-child(1){min-height:170px}.showG-stp:nth-child(2){min-height:236px}.showG-stp:nth-child(3){min-height:302px}

.showG-stp p{margin:12px 0 0;font-size:20px;line-height:1.45;color:var(--ink-soft)}

/* ---- s3 ladderFarm: the farm ladder (scene id ladder, farm:true). Every state hangs off .step-on triggers via :has(), so go back and restore just work ---- */
.s3L{position:absolute;inset:0;overflow:hidden;--s3o:#e25c0f}
.s3L .s3-t{position:absolute;left:0;top:0;width:0;height:0;overflow:hidden;opacity:0!important;transform:none!important;pointer-events:none}
.s3L .s3-copy{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.s3-track{position:absolute;inset:0;transition:transform .95s cubic-bezier(.6,.05,.2,1)}
.s3L:has(.s3-t4.step-on) .s3-track{transform:translateX(-1245px);transition-delay:3.2s}   /* round 2: one beat, the climb plays first and the track shifts to the phones after it */
.s3-page{position:absolute;inset:0;padding:64px 80px 56px;background:var(--paper,#f6f1e7);z-index:3;transform-origin:20% 100%;
  transition:transform .75s cubic-bezier(.5,0,.9,.4),opacity .6s ease .12s,visibility 0s linear .8s}
.s3L:has(.s3-t4.step-on) .s3-page{transform:translateY(130px) rotate(-5deg) scale(.97);opacity:0;visibility:hidden;pointer-events:none}
.s3-base{position:absolute;left:60px;width:780px;top:640px;height:2px;background:rgba(21,35,59,.22)}
.s3-bar{position:absolute;bottom:170px;width:150px;border-radius:14px 14px 0 0;transform-origin:50% 100%;transform:scale(1,0);
  background:linear-gradient(180deg,#34c3b1,#1c7f94);box-shadow:0 14px 28px rgba(21,35,59,.14);transition:transform .8s cubic-bezier(.2,.9,.25,1)}
.s3-lab{position:absolute;top:652px;width:184px;opacity:0;transform:translateY(8px);transition:opacity .5s ease .3s,transform .5s ease .3s}
.s3-lab b{display:block;font:600 24px/1.1 var(--serif);color:var(--navy,#15233b);letter-spacing:-.01em}
.s3-lab small{display:block;margin-top:8px;font:700 12px/1.2 var(--font);letter-spacing:.2em;color:var(--ink-soft,#5b6880)}
.s3-lab span{display:block;margin-top:3px;font:500 15px/1.3 var(--font);color:var(--ink-soft,#5b6880)}
.s3L:has(.s3-t1.step-on) .s3-b1,.s3L:has(.s3-t2.step-on) .s3-b2,.s3L:has(.s3-t3.step-on) .s3-b3{transform:none}
.s3L:has(.s3-t1.step-on) .s3-l1,.s3L:has(.s3-t2.step-on) .s3-l2,.s3L:has(.s3-t3.step-on) .s3-l3{opacity:1;transform:none}
.s3-b4{background:linear-gradient(180deg,#3fd2bd,#178a86)}
.s3-farm{position:absolute;left:860px;top:262px;width:500px;height:380px;border-radius:20px;overflow:hidden;background:#eaf1f4;
  box-shadow:0 18px 40px rgba(21,35,59,.16);opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
.s3L:has(.s3-t1.step-on) .s3-farm{opacity:1;transform:none}
.s3-farm svg{display:block;width:100%;height:100%}
.s3-farm .fl{opacity:0;transition:opacity .7s ease}
.s3L:has(.s3-t1.step-on):not(:has(.s3-t2.step-on)) .s3-farm .f1,
.s3L:has(.s3-t2.step-on):not(:has(.s3-t3.step-on)) .s3-farm .f2,
.s3L:has(.s3-t3.step-on) .s3-farm .f3{opacity:1}
.s3-page .s3-hl{position:absolute;left:860px;top:664px;width:500px;margin:0;font-size:21px;line-height:1.35}
/* night: what is left once the page falls away */
.s3-night{position:absolute;left:0;top:0;width:1440px;height:810px;overflow:hidden;z-index:1;background:radial-gradient(ellipse at 50% 105%,#24406a 0%,#0f1a2e 62%,#08101d 100%)}
.s3-night::after{content:"";position:absolute;inset:0;background:rgba(6,10,20,.66);opacity:0;transition:opacity .9s ease;pointer-events:none;z-index:6}
.s3L:has(.s3-t4.step-on) .s3-night::after{opacity:1;transition-delay:3.2s}
.s3-streak{position:absolute;inset:0;opacity:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.09) 0 2px,transparent 2px 46px);
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 30%,#000 70%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 30%,#000 70%,transparent 100%)}
.on .s3L:has(.s3-t4.step-on) .s3-streak{opacity:1;animation:s3-streak .45s linear .25s 5}
@keyframes s3-streak{from{background-position:0 0}to{background-position:0 46px}}
.s3-aiw{position:absolute;left:580px;width:280px;bottom:0;height:640px;overflow:hidden;z-index:2}
.s3-aib{position:absolute;inset:0;border-radius:20px 20px 0 0;transform:translateY(100%);
  background:linear-gradient(180deg,#f58a2e 0%,#e25c0f 55%,#b9430a 100%);box-shadow:0 0 60px rgba(245,138,46,.55)}
.s3-aib::before{content:"";position:absolute;left:14%;top:0;bottom:0;width:10%;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));border-radius:6px}
/* ---- v4 a: the AI bar label (Generative Artificial Intelligence, then the other names), no small circle, no talk bubble */
.s3-ai{position:absolute;left:0;right:0;top:30px;padding:0 22px;text-align:center;color:#fff}
.s3-ai b{display:block;font:600 36px/1.08 var(--serif);letter-spacing:-.01em;opacity:0}

.s3-ai span{display:block;margin-top:14px;font:700 16px/1.3 var(--font);letter-spacing:.06em;color:#ffe3c9;opacity:0}
