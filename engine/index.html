.on .s3L:has(.s3-t4.step-on) .s3-aib{animation:s3-climb 1.8s cubic-bezier(.3,.2,.65,.85) .25s forwards}
.on .s3L:has(.s3-t4.step-on) .s3-ai b{animation:s3-pop .5s cubic-bezier(.2,1.4,.3,1) 2.05s forwards}
.on .s3L:has(.s3-t4.step-on) .s3-ai small{animation:s3-pop .5s cubic-bezier(.2,1.4,.3,1) 2.4s forwards}
.on .s3L:has(.s3-t4.step-on) .s3-ai span{animation:s3-pop .5s cubic-bezier(.2,1.4,.3,1) 2.75s forwards}
@keyframes s3-climb{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes s3-pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.s3-cb{position:absolute;bottom:600px;width:34px;height:24px;border-radius:12px 12px 12px 3px;background:rgba(255,255,255,.88);opacity:0;z-index:2}
.on .s3L:has(.s3-t4.step-on) .s3-cb{animation:s3-rise 2.6s ease-out calc(2.1s + var(--d,0s)) 1 both}
@keyframes s3-rise{0%{opacity:0;transform:translateY(40px) scale(.5)}20%{opacity:.95}100%{opacity:0;transform:translateY(-330px) scale(1.15)}}
.s3-flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:5;pointer-events:none}
.on .s3L:has(.s3-t4.step-on) .s3-flash{animation:s3-flash .7s ease-out 2.05s 1 both}
@keyframes s3-flash{0%{opacity:.5}100%{opacity:0}}
.s3-fx{position:absolute;inset:0;width:1440px;height:810px;z-index:4;pointer-events:none}
/* the shifted panel */

/* ---- where (dark) ---- */

.scene.dark.t-where .hl{color:var(--gold)}
/* ---- v3 2am: where, the clicked 2 a.m. story. One frame per click; the frame is read from which trigger is on (pure CSS, survives re-render). ---- */
.showW{position:relative}
.showW .showW-tg{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
.showW .showW-svg{display:block;width:100%;flex:1;min-height:0;margin-top:20px;overflow:visible}
.showW .showW-svg text{font-family:var(--font)}
.showW .showW-svg text.ser{font-family:var(--serif)}
.showW .w{opacity:0;transform:translateY(12px) scale(.97);transform-box:fill-box;transition:opacity .5s var(--ease),transform .5s var(--ease)}
/* v4 a23b: Maisie rolls in from the right; faces and mouths follow the frame. Written before the frame rules so the shown state wins. */
.showW .w[data-q="bot"]{transform:translateX(280px);transition:opacity .5s var(--ease),transform 1.2s var(--ease)}
.showW .f-happy,.showW .f-dot,.showW .m-frown,.showW .m-open,.showW .m-smile{opacity:0}
/* v4 b: frames follow data-f (set by the autoplay controller), not the clicks */
.showW:not([data-f]) .v0,
.showW[data-f="1"] .v1,
.showW[data-f="2"] .v2,
.showW[data-f="3"] .v3,
.showW[data-f="4"] .v4,
.showW[data-f="5"] .v5,
.showW[data-f="6"] .v6{opacity:1;transform:none}
.showW:is([data-f="3"],[data-f="4"]) .f-happy,.showW[data-f="5"] .f-dot,.showW[data-f="2"] .m-frown,.showW[data-f="3"] .m-open,.showW[data-f="5"] .m-smile{opacity:1}
.showW[data-f="5"] .w[data-q="bld"]{opacity:.35}
.showW[data-f="5"] .w[data-q="tbl"]{opacity:.5}
@media (prefers-reduced-motion:reduce){.showW .w{transition:none!important}}
.showW-pause{position:absolute;right:6px;top:0;font:700 12px/1 var(--font);letter-spacing:.2em;text-transform:uppercase;color:var(--orange-deep);border:1.5px solid var(--orange);border-radius:99px;padding:7px 12px;background:#fff;display:none}
.showW[data-paused="1"] .showW-pause{display:block}

/* ---- system ---- */

/* ---- s5: the system, four circles with a CSS dive per move (scene id system). P1..P5 are the five clicks. ---- */
.s5{position:relative;--cd:.9s}   /* v4 a23 step: a chosen circle takes --cd to reach the centre of the page, then the dive starts */
.s5-rot{display:flex;flex-direction:column;flex:1;min-height:0;height:100%}
.s5-t{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
.s5-stage{position:relative;flex:1;min-height:0;margin-top:6px}
.s5-circles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);gap:22px;align-items:center;justify-items:center;transform-origin:var(--ox,50%) var(--oy,50%)}
.s5-c{display:flex;flex-direction:column;align-items:center;text-align:center;opacity:0;transform:translateY(16px)}
.s5-disc{position:relative;width:176px;height:176px;border-radius:50%;border:2px solid var(--orange);background:#fff;box-shadow:var(--card-shadow);display:grid;place-items:center;color:var(--orange);transition:background .5s,color .5s,box-shadow .5s,border-color .5s,transform .8s cubic-bezier(.3,.7,.3,1)}
.s5-disc::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(226,92,15,.28)}
.s5-disc .showG-ic{width:64px;height:64px;margin:0;color:inherit}
.s5-n{position:absolute;left:-6px;top:-6px;width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:600 21px/1 var(--serif)}
.s5-c h2{font:600 32px/1.1 var(--serif);color:var(--navy);margin:22px 0 0;letter-spacing:-.01em}
.s5-c .role{margin-top:8px;font:700 12px/1 var(--font);letter-spacing:.18em;text-transform:uppercase;color:var(--orange-deep)}
.s5-cap{position:absolute;left:0;right:0;bottom:-6px;margin:0;text-align:center;font:500 27px/1.3 var(--serif);color:var(--navy);opacity:0}
.s5-foot{margin-top:18px;opacity:0}
.s5-b{max-width:760px;padding:18px 24px;border-radius:22px;font:500 27px/1.3 var(--serif);display:flex;gap:16px;align-items:flex-start;opacity:0}
.s5-b small{display:block;font:700 12px/1 var(--font);letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px;opacity:.7}
.s5-me{align-self:flex-end;background:var(--orange);color:#fff;border-bottom-right-radius:6px}
.s5-ai{align-self:flex-start;background:var(--lilac);color:#0f1a2e;border-bottom-left-radius:6px}
.s5-av{width:58px;height:58px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--lilac)}
.s5-ov{position:absolute;left:-80px;right:-80px;top:-64px;bottom:-56px;opacity:0;pointer-events:none;z-index:5}
.s5-dk{background:radial-gradient(ellipse at 50% 50%,#1b2d4d 0%,#0f1a2e 55%,#070d18 100%);overflow:hidden;z-index:4}
.s5-tun{position:absolute;left:50%;top:50%;width:1900px;height:1900px;margin:-950px 0 0 -950px;border-radius:50%;opacity:0;
  background:repeating-radial-gradient(circle,transparent 0 70px,rgba(240,122,42,.34) 71px 74px,transparent 75px 150px);transform:scale(.3)}
.s5-tun2{background:repeating-radial-gradient(circle,transparent 0 110px,rgba(155,140,242,.3) 111px 113px,transparent 114px 220px)}
.s5-arena{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:6}
.s5-arena{padding:0 300px}
.s5-arena .s5-av{width:104px;height:104px;margin-bottom:6px}
.s5-arena .s5-b{box-shadow:0 18px 40px -18px rgba(0,0,0,.6)}
.s5-lab{position:absolute;left:80px;top:64px;font:700 14px/1 var(--font);letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
/* v4 a23b multiply: the coin payout, six beats (steps 4 to 9). Ten Maisies, one idea each; each coin flips into a Maisie head and offers a chip. */
.s5-mx{opacity:1;z-index:5;overflow:visible;transition:opacity .4s}
.s5-mt[data-tag]{position:relative;padding-bottom:40px}
.s5-mt[data-tag]::after{content:attr(data-tag);position:absolute;left:50%;bottom:7px;transform:translateX(-50%);white-space:nowrap;padding:4px 10px;border-radius:999px;background:#0f1a2e;color:#ffe3c9;border:1.5px solid var(--orange);font:700 13px/1.1 var(--font);letter-spacing:.02em}
.s5-mc{position:absolute;width:242px;display:flex;flex-direction:column;align-items:center;gap:15px}
.mx-hs{width:64px;height:64px;flex:none}
.s5-mh{width:64px;height:64px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--lilac);flex:none}
.s5-mt{margin:0;width:100%;box-sizing:border-box;height:152px;padding:14px 8px 16px;border-radius:18px;background:var(--lilac);color:#0f1a2e;font:500 23px/1.3 var(--serif);text-align:center;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 26px -16px rgba(60,40,140,.45);opacity:0;transform:translateY(-16px) scale(.6);transform-origin:50% 0;transition:opacity .45s ease .3s,transform .55s cubic-bezier(.3,.8,.3,1) .3s}
.s5-hl2{position:absolute;left:0;right:0;top:656px;margin:0;font:500 34px/1.25 var(--serif);color:var(--navy);text-align:center;opacity:0;transform:translateY(10px);transition:opacity .6s ease .35s,transform .6s ease .35s}
.s5-mlab{position:absolute;left:80px;top:62px;margin:0;opacity:0;transition:opacity .5s ease .2s}
.mx-ex{position:absolute;left:0;top:0;width:0;height:0}
.mx-k{position:absolute;left:0;top:0;width:64px;height:64px;perspective:700px;pointer-events:none;
  --x:var(--x0);--y:var(--y0);--sc:0;--rz:0deg;--op:0;--ay:0deg;--sa:0deg;--sl:80px;--so:0;
  transform:translate(var(--x),var(--y)) scale(var(--sc));opacity:var(--op);
  transition:transform .95s cubic-bezier(.2,.8,.25,1),opacity .5s ease}
.mx-z{position:absolute;inset:0;transform-style:preserve-3d;transform:rotate(var(--rz));transition:transform .95s cubic-bezier(.2,.8,.25,1)}
.mx-b{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(var(--ay));transition:transform .8s cubic-bezier(.3,.7,.3,1)}
.mx-r,.mx-f,.mx-bk{position:absolute;left:0;top:0;width:100%;height:100%;box-sizing:border-box;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mx-r{backface-visibility:visible;-webkit-backface-visibility:visible;background:linear-gradient(90deg,#9f6209,#e0a043 45%,#a8680c)}
.mx-f{background:radial-gradient(circle at 34% 28%,#fbd98a 0,#efb44e 38%,#e7a23c 62%,#c98318 100%);border:4.5px solid #c27a12;box-shadow:inset 0 0 0 1px rgba(255,236,190,.65);transform:translateZ(3.9px)}
.mx-f::before{content:"";position:absolute;inset:2.5px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(150,84,8,.5) 0 2.2deg,transparent 2.2deg 7.5deg);-webkit-mask:radial-gradient(circle,transparent 0,transparent 21px,#000 21px);mask:radial-gradient(circle,transparent 0,transparent 21px,#000 21px)}
.mx-f .showG-ic{position:absolute;left:25%;top:25%;width:50%;height:50%;margin:0;color:#a5540a;stroke-width:2}
.mx-bk{transform:rotateY(180deg) translateZ(3.9px);object-fit:cover;box-shadow:0 0 0 3px var(--lilac)}
.mx-st{position:absolute;left:32px;top:19px;height:26px;width:var(--sl);transform-origin:0 50%;transform:rotate(var(--sa));opacity:var(--so);background:linear-gradient(to right,rgba(240,176,74,.9),rgba(240,176,74,0));clip-path:polygon(0 8%,100% 50%,0 92%);transition:transform .95s cubic-bezier(.2,.8,.25,1),opacity .5s ease,width .95s ease}
.mx-sp{position:absolute;color:var(--gold);opacity:0;transform:scale(.3);transition:opacity .5s ease .5s,transform .6s ease .5s}
.mx-sp svg{width:100%;height:100%;display:block}
.mx-glow{position:absolute;left:calc(var(--ox3,50%) + var(--tx3,0px));top:calc(var(--oy3,50%) + var(--ty3,0px));width:760px;height:760px;margin:-380px 0 0 -380px;border-radius:50%;background:radial-gradient(circle,rgba(240,176,74,.55) 0,rgba(240,176,74,.18) 45%,transparent 70%);opacity:0;z-index:-1;pointer-events:none;transition:opacity .7s ease .3s}

/* P1 the four circles arrive */
.on .s5:has(.s5-t1.step-on):not(:has(.s5-t2.step-on)) .s5-c{animation:s5-in .7s var(--ease-out,ease-out) both;animation-delay:calc(var(--k,0) * 140ms)}
.on .s5:has(.s5-t1.step-on):not(:has(.s5-t2.step-on)) .s5-foot{animation:s5-fade .6s ease .9s both}
.s5-c1{--k:0}.s5-c2{--k:1}.s5-c3{--k:2}.s5-c4{--k:3}
@keyframes s5-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes s5-fade{from{opacity:0}to{opacity:1}}
/* later states: circles and foot are simply there (the animation of an earlier click is not replayed) */
.on .s5:has(.s5-t2.step-on):not(:has(.s5-t3.step-on)) .s5-c,.on .s5:has(.s5-t3.step-on):not(:has(.s5-t4.step-on)) .s5-c,.on .s5:has(.s5-t4.step-on):not(:has(.s5-t10.step-on)) .s5-c,.on .s5:has(.s5-t10.step-on) .s5-c{opacity:1;transform:none}
.on .s5:has(.s5-t10.step-on) .s5-foot{animation:s5-fade .6s ease 2.8s both}
.on .s5:has(.s5-t2.step-on):not(:has(.s5-t10.step-on)) .s5-foot{animation:none;opacity:1}

/* dive: the circles scale into the chosen one and fade, the dark tunnel takes over, then everything flies back */
/* ---- v4 a: every dive holds on its inside state; the next click is what leaves it */
@keyframes s5-centre{from{transform:translate(0,0) scale(1)}to{transform:translate(var(--tx,0px),var(--ty,0px)) scale(1)}}
@keyframes s5-dive{0%{transform:translate(var(--tx,0px),var(--ty,0px)) scale(1);opacity:1}16%,100%{transform:translate(var(--tx,0px),var(--ty,0px)) scale(3.6);opacity:0}}
@keyframes s5-dk{0%,5%{opacity:0}17%,100%{opacity:1}}
@keyframes s5-tun{0%{transform:scale(.25);opacity:0}15%{opacity:.9}100%{transform:scale(1.7);opacity:0}}
@keyframes s5-box{0%,17%{opacity:0}24%,100%{opacity:1}}
@keyframes s5-pop{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
@keyframes s5-capin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes s5-glow{0%,100%{background:#fff;color:var(--orange);box-shadow:var(--card-shadow)}20%,60%{background:var(--orange);color:#fff;box-shadow:0 0 0 10px rgba(226,92,15,.2),0 0 50px 6px rgba(240,122,42,.55)}}
@keyframes s5-ham{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}

/* P2 Challenge, 11 s */
.on .s5:has(.s5-t2.step-on):not(:has(.s5-t3.step-on)) .s5-circles{--ox:var(--ox1,12.5%);--oy:var(--oy1,50%);--tx:var(--tx1,0px);--ty:var(--ty1,0px);animation:s5-centre var(--cd) cubic-bezier(.4,0,.2,1) both,s5-dive 11s cubic-bezier(.5,0,.3,1) var(--cd) forwards}
.on .s5:has(.s5-t2.step-on):not(:has(.s5-t3.step-on)) .s5-dk{animation:s5-dk 11s ease var(--cd) both}
.on .s5:has(.s5-t2.step-on):not(:has(.s5-t3.step-on)) .s5-tun{animation:s5-tun 1.5s linear var(--cd) infinite}
.on .s5:has(.s5-t2.step-on):not(:has(.s5-t3.step-on)) .s5-tun2{animation:s5-tun 1.5s linear calc(var(--cd) + .75s) infinite}
.on .s5:has(.s5-t2.step-on):not(:has(.s5-t3.step-on)) .s5-arena{animation:s5-box 11s ease var(--cd) both}
/* v5 bugs: the three exchanges used to pop on a timer (3.5 s, 5.8 s, 8.1 s after the click), so a press during the dive jumped to the Invert and the Challenge was never seen.
   Now each press shows one of them (data-xch 1 to 3 on .s5, set by _forward) and only the press after the third leaves for the Invert. */
.on .s5:has(.s5-t2.step-on):not(:has(.s5-t3.step-on)):is([data-xch="1"],[data-xch="2"],[data-xch="3"]) .s5-arena .s5-d1,
.on .s5:has(.s5-t2.step-on):not(:has(.s5-t3.step-on)):is([data-xch="2"],[data-xch="3"]) .s5-arena .s5-d2,
.on .s5:has(.s5-t2.step-on):not(:has(.s5-t3.step-on))[data-xch="3"] .s5-arena .s5-d3{animation:s5-pop .6s ease both}
.on .s5:has(.s5-t2.step-on):not(:has(.s5-t3.step-on)):is([data-xch="1"],[data-xch="2"],[data-xch="3"]) .s5-arena .s5-d1,.on .s5:has(.s5-t2.step-on):not(:has(.s5-t3.step-on)):is([data-xch="2"],[data-xch="3"]) .s5-arena .s5-d2,.on .s5:has(.s5-t2.step-on):not(:has(.s5-t3.step-on))[data-xch="3"] .s5-arena .s5-d3{opacity:1;transform:none}   /* with reduced motion the animation is off, so the exchange still shows */
.on .s5:has(.s5-t2.step-on):not(:has(.s5-t3.step-on)) .s5-c1 .s5-disc{background:var(--orange);color:#fff}
/* P3 Invert (v4 a23b): five beats driven by a player that sets data-iv 1 to 5 on .s5. Light scheme only, no dark wash. */
.on .s5:has(.s5-t3.step-on):not(:has(.s5-t4.step-on)) .s5-circles{animation:s5-fade .7s ease both}
.s5-bd,.s5-card,.s5-world,.s5-ui{position:absolute;left:-80px;top:-64px;width:1440px;height:810px;pointer-events:none}
.s5-bd{z-index:1;opacity:0;transition:opacity .7s ease;background:radial-gradient(ellipse 70% 60% at 6% 100%,rgba(240,160,110,.18),transparent 70%),radial-gradient(ellipse 60% 50% at 100% 0%,rgba(231,162,60,.12),transparent 70%),#f4efe5}
.s5-card{perspective:2600px;transform-origin:50% 50%;transition:transform 1.1s cubic-bezier(.5,0,.2,1),opacity .7s ease}
.s5[data-iv] .s5-card{z-index:2}
.s5-fl{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.3s cubic-bezier(.55,0,.25,1)}
.s5-front,.s5-backf{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:14px}
.s5-backf{transform:rotateY(180deg);overflow:hidden;box-shadow:0 34px 60px -30px rgba(21,35,59,.55),0 4px 14px rgba(21,35,59,.14)}
.s5-bp{display:block;width:1440px;height:810px}
.s5-bp text.t{font-family:var(--serif)}.s5-bp text.f{font-family:var(--font)}
.s5-paper{position:absolute;inset:0;border-radius:14px;opacity:0;background:#fbf8f2;box-shadow:0 34px 60px -30px rgba(21,35,59,.55),0 4px 14px rgba(21,35,59,.14);transition:opacity .5s ease}
.s5-turn{position:absolute;inset:0;padding:64px 80px 56px;box-sizing:border-box;display:flex;flex-direction:column;transition:transform 1.4s cubic-bezier(.65,0,.25,1)}
.s5-mai{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;opacity:0;transform:scale(.4);box-shadow:0 0 0 4px var(--lilac),0 10px 26px -10px rgba(21,35,59,.5);transition:opacity .45s ease,transform .6s cubic-bezier(.3,1.4,.5,1)}

/* ---- v4 b: summary slide cards ---- */

    setting() { return lv; },

const $ = (s, r = document) => r.querySelector(s) || (r === document && STASH ? STASH.querySelector(s) : null),

  story: "Where we have done this", problem: "Their problem", straight: "The straight answer", youWillSee: "What you will see",

const LSK = DECK.id + "-links-v1", LSD = DECK.id + "-done-v1";
const _ls = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || "") || d; } catch (e) { return d; } };

function logos(dark) {
  return DECK.logos.map((l, i) => (i ? '<i class="dv"></i>' : "") +
    `<img class="${l.big ? "big" : ""}" src="${esc(dark ? l.dark || l.light : l.light || l.dark)}" alt="${esc(l.alt)}">`).join("");
}
const initials = n => String(n || "").split(/\s+/).map(w => w[0] || "").join("").slice(0, 2).toUpperCase();
/* emTitle: the escaped title with the scene's payoff phrase (s.em) wrapped in <em> (orange italic in the theme). */
const emTitle = (s, t) => { const e = esc(t == null ? (s.title || "") : t); if (!s || !s.em) return e;
  const m = esc(s.em), k = e.indexOf(m); return k < 0 ? e : e.slice(0, k) + "<em>" + m + "</em>" + e.slice(k + m.length); };
window.emTitle = emTitle;
const head = s => `<div>${s.kick ? `<div class="kick">${esc(s.kick)}</div>` : ""}<h1>${emTitle(s)}</h1>${s.sub ? `<p class="sub">${esc(s.sub)}</p>` : ""}</div>`;
const list = x => Array.isArray(x) ? x : (x ? [x] : []);
/* optional text blocks, in this order: body (paragraphs), note (small, centered), hl (bold line; hlStyle "brand" and/or "c"),
   callout (tinted box; with two or more lines the first is small), band (dark bar), foot (italic line) */
const more = s => list(s.body).map(p => `<p class="bd">${esc(p)}</p>`).join("")
  + (s.note ? `<p class="note">${esc(s.note)}</p>` : "")
  + (s.hl ? `<p class="hl ${esc(s.hlStyle || "")}">${esc(s.hl)}</p>` : "")
  + (s.callout ? `<div class="co">${list(s.callout).map((c, i, a) => a.length > 1 && !i ? `<small>${esc(c)}</small>` : `<b>${esc(c)}</b>`).join("")}</div>` : "")
  + (s.band ? `<div class="band">${esc(s.band)}</div>` : "")
  + (s.foot ? `<p class="ft">${esc(s.foot)}</p>` : "");
const aside = a => `<figure>${a.img ? `<img src="${esc(a.img)}" alt="${esc(a.alt || "")}">` : ""}<figcaption>${list(a.cap).map(c => `<span>${esc(c)}</span>`).join("")}</figcaption></figure>`;
const promptFor = id => (DECK.prompts || []).find(p => p.id === id) || {};
const pollFor = id => (DECK.polls || []).find(p => p.id === id) || { options: [] };
let VOTES = {};

const R = {
  cover: s => `<div class="logos">${logos(true)}</div>
    <div class="stagger"><div class="kick">${esc(s.kick || "")}</div><h1>${esc(s.title || DECK.title)}</h1>
    <p class="sub">${esc(s.sub || "For " + DECK.audience)}</p></div>
    <div class="meta${s.meta ? " col" : ""}">${(s.meta ? list(s.meta) : [DECK.presenter, DECK.date]).map(m => `<span>${esc(m)}</span>`).join("")}</div>`,
  section: s => `<div class="stagger">${s.n ? `<div class="n">${esc(s.n)}</div>` : ""}${head(s)}${more(s)}</div>${s.img ? `<img class="corner" src="${esc(s.img)}" alt="${esc(s.alt || "")}">` : ""}`,
  statement: s => s.aside ? `${head(s)}<div class="body asd"><div class="stagger">${more(s)}</div>${aside(s.aside)}</div>`
    : `<div class="stagger">${head(s)}${more(s)}</div>`,
  bullets: s => { const cls = ["bl", "stagger", s.cols ? "c" + s.cols : "", s.plain ? "plain" : "", s.center ? "center" : "", s.layout || ""].join(" ");
    return `${head(s)}<div class="body"><div class="${cls}">${(s.items || []).map((b, i) =>
      `<div>${s.plain ? "" : `<div class="bn">${i + 1}</div>`}<h2>${esc(b[0])}</h2><p>${esc(b[1] || "")}</p></div>`).join("")}</div>${more(s)}</div>`; },
  compare: s => `${head(s)}${s.badge ? `<span class="badge">${esc(s.badge)}</span>` : ""}<div class="body"><div class="cmp stagger">${(s.cols || []).map((c, i) => {
      const mark = c.mark || (i ? "ok" : "x"), tone = c.tone || (mark === "x" ? "no" : "brand");
      return `<div class="${mark} tone-${esc(tone)} ${esc(c.fill || "")}"><h3>${esc(c.h)}</h3><ul>${(c.items || []).map(x =>
        `<li><i>${mark === "x" ? "&#10005;" : "&#10003;"}</i><span>${esc(x)}</span></li>`).join("")}</ul></div>`; }).join("")}</div>${more(s)}</div>`,
  rows: s => `${head(s)}<div class="body"><div class="rw stagger${s.answer ? " ans" : ""}">${(s.rows || []).map(r =>
    `<div><span class="a">${esc(r[0])}</span><span class="b">${esc(r[1] || "")}</span></div>`).join("")}</div>${more(s)}</div>`,
  vote: s => { const v = pollFor(s.poll);
    return `${head({ ...s, title: s.title || v.q, sub: s.sub || v.sub })}<div class="body"><div class="vt stagger" data-vote="${esc(s.poll)}">${v.options.map(o =>
      `<div data-opt="${esc(o[0])}"><div class="k">${esc(o[0])}</div><div class="t">${esc(o[1] || "")}</div><div class="vn"></div><i class="vb"></i></div>`).join("")}</div>
      ${VIEW === "local" ? "" : `<p class="vhint">${esc(L.voteHint)}</p>`}${more(s)}</div>`; },
  prompt: s => { const p = promptFor(s.p);
    return `${head({ ...s, title: s.title || "Prompt: " + (p.t || "") })}<div class="body"><pre class="pr">${esc(p.text || "")}</pre>${more({ foot: p.note, ...s })}</div>`; },
  stats: s => `${head(s)}<div class="body"><div class="st stagger">${(s.stats || []).map(x =>
    `<div><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join("")}</div></div>${s.src ? `<div class="src">${esc(s.src)}</div>` : ""}`,
  team: s => { const solo = DECK.team.length === 1, ph = p => p.photo ? `<img class="ph" src="${esc(p.photo)}" alt="${esc(p.name)}">` : `<div class="ph">${esc(initials(p.name))}</div>`,

    return `${head(s)}<div class="body"><div class="tm stagger${solo ? " solo" : ""}">${solo ? ph(DECK.team[0]) + `<div>${txt(DECK.team[0])}</div>`
      : DECK.team.map(p => `<div>${ph(p)}${txt(p)}</div>`).join("")}</div></div>`; },
  quote: s => { const q = list(s.q), long = q.join(" ").length > 140;
    return `<div class="stagger">${s.kick ? `<div class="kick">${esc(s.kick)}</div>` : ""}<blockquote class="${long ? "long" : ""} ${s.plain ? "noq" : ""}">${q.map(p => `<p>${esc(p)}</p>`).join("")}</blockquote>${s.by ? `<cite>${esc(s.by)}</cite>` : ""}${more(s)}</div>`; },
  image: s => `${head(s)}<div class="body"><figure class="im" style="margin:0">${s.src ? `<img src="${esc(s.src)}" alt="${esc(s.alt || "")}">`

  demomap: s => `${head(s)}<div class="body"><div class="cm stagger">${DECK.chapters.map((c, i) => `
    <div class="cc" data-ch="${i}"><div class="n">${esc(c.n)}</div><div class="t">${esc(c.t)}</div>

      ${c.reqs.some(r => r[2]) ? `<span class="hi">&#9733; ${esc(L.highlightedHere)}</span>` : ""}

      <h1 style="font-size:48px;max-width:26ch">${esc(c.t)}</h1></div></div>
      <div class="body" style="margin-top:30px"><div class="rq stagger">${c.reqs.map(r => `
        <div class="r" data-req="${esc(r[0])}"><div class="id">${esc(r[0])}</div>
          <div><div class="qt">${esc(r[1])}</div>${r[2] ? `<span class="hi">&#9733; ${esc(L.highlighted)}</span>` : ""}

          <span class="go">${esc(L.markShown)}</span></div>`).join("")}</div>
      <div class="chf"><span>${esc(c.line || "")}</span>
        <span class="nextch" data-nextch="${s.ch}">${esc(L.allShown)}${s.ch < DECK.chapters.length - 1 ? ". " + esc(L.nextChapter) : ""} &rarr;</span></div></div>`; },
  story: s => { const p = DECK.stories[s.ch] || {}, c = DECK.chapters[s.ch];
    if (p.honest) return `<div><div class="kick">${esc(c.n)} ${esc(c.t)}</div><h1>${esc(p.honest.h)}</h1></div>
      <div class="body"><div class="sy"><div class="card"><div class="lbl" style="margin-top:0">${esc(L.straight)}</div><p>${esc(p.honest.d)}</p></div>
      ${p.here ? `<div class="card here"><div class="lbl" style="margin-top:0">${esc(L.youWillSee)}</div><p>${esc(p.here)}</p></div>` : ""}</div></div>`;
    return `<div><div class="kick">${esc(p.label || L.story)}</div><h1>${esc(p.who || "")}</h1>
      ${p.st || p.tag ? `<p class="sub" style="margin-top:10px">${esc([p.st, p.tag].filter(Boolean).join(", "))}</p>` : ""}</div>
      <div class="body"><div class="sy stagger"><div>${p.logo ? `<img src="${esc(p.logo)}" alt="" style="height:44px;margin-bottom:10px">` : ""}
        ${p.problem ? `<div class="lbl">${esc(L.problem)}</div><p>${esc(p.problem)}</p>` : ""}
        ${p.quote ? `<blockquote>&ldquo;${esc(p.quote)}&rdquo;<cite>${esc(p.by || "")}</cite></blockquote>` : ""}</div>
      <div style="display:flex;flex-direction:column;gap:22px">${p.stat && p.stat[0] ? `<div class="card"><div class="big">${esc(p.stat[0])}</div><div class="bigl">${esc(p.stat[1] || "")}</div></div>` : ""}
        ${p.here ? `<div class="card here"><div class="lbl" style="margin-top:0">${esc(L.here)}</div><p>${esc(p.here)}</p></div>` : ""}</div></div></div>`; },
  closing: s => `<div class="logos">${logos(true)}</div><div class="stagger">${head(s)}</div>
    <div class="cl stagger">${(s.items || []).map(x => `<div><b>${esc(x[0])}</b>${esc(x[1])}</div>`).join("")}</div>`,
  backstage: s => `${head(s)}<div class="body"><div class="bk">${allReqs().map(r => `
    <label>${esc(r[0])}<input data-lk="${esc(r[0])}" placeholder="https://" value="${esc(linkFor(r[0]))}"></label>`).join("")}</div></div>`
};
const DARK = new Set(["cover", "section", "quote", "closing"]);

const stage = $("#stage");
let cur = 0, els = [];
function build() {
  stage.innerHTML = ""; els = [];
  SCENES.forEach((s, i) => {
    const el = document.createElement("section");
    const dark = s.dark === false ? false : (DARK.has(s.t) || !!s.dark || !!s.bg);
    el.className = "scene t-" + s.t + (dark ? " dark" : "") + (isPrivate(s) ? " private" : "")
      + (s.t === "statement" && (s.body || s.callout || s.aside) ? " top" : "") + (DECK.footer && !dark ? " has-foot" : "");
    if (s.bg) { el.classList.add("bgimg");
      el.style.backgroundImage = `linear-gradient(90deg,color-mix(in srgb,var(--dark) 78%,transparent) 30%,transparent 80%),url("${String(s.bg).replace(/["\\]/g, "")}")`; }
    el.dataset.dark = dark ? "1" : "";
    renderInto(el, s, i);
    stage.appendChild(el); els.push({ i, el });
  });
  $("#gr").innerHTML = SCENES.map((s, i) => `<div class="th" data-i="${i}"><small>${i + 1}${isPrivate(s) ? ", presenter only" : ""}</small>${esc(sceneTitle(s))}</div>`).join("");
}
/* Renders one scene into its section, then runs every SCENE_HOOKS function (el, scene, index) so modules can
   decorate it. rerenderScene(i) re-renders one scene in place (Maisie's live edits use it). */
window.SCENE_HOOKS = window.SCENE_HOOKS || [];
function renderInto(el, s, i) {
  const dark = !!el.dataset.dark;
  try { el.innerHTML = (R[s.t] || R.statement)(s)
      + (!dark ? `<div class="dfoot"><span>${esc(DECK.footer || "")}</span><span>${SCENES.slice(0, i + 1).filter(x => !isPrivate(x)).length}</span></div>` : ""); }
  catch (e) { el.innerHTML = `<div class="phold">Scene ${i + 1} (${esc(s.t)}) failed: ${esc(e.message)}</div>`; }
  window.SCENE_HOOKS.forEach(f => { try { f(el, s, i); } catch (e) { console.warn("scene hook", e); } });
}
window.rerenderScene = i => { const x = els.find(e => e.i === i); if (x) { renderInto(x.el, SCENES[i], i); refreshDemo(); } };
function sceneTitle(s) {
  if (s.t === "chapter" || s.t === "story") { const c = DECK.chapters[s.ch] || {}; return (s.t === "story" ? "Story: " : "") + (c.n || "") + " " + (c.t || ""); }
  return s.title || s.q || s.t;
}

function refreshDemo() {
  $$("#stage .rq").forEach(box => {
    const rows = $$(".r", box); let nextSet = false;
    rows.forEach(r => { const q = r.dataset.req, done = !!DONE[q], url = linkFor(q);
      r.classList.toggle("done", done); r.classList.remove("next");
      if (!done && !nextSet) { r.classList.add("next"); nextSet = true; }
      const g = $(".go", r);
      g.className = "go" + (url && VIEW !== "watch" ? " live" : "");
      g.textContent = done ? (url && VIEW !== "watch" ? "Open again \u2197" : L.shown) : (url && VIEW !== "watch" ? "Open live demo \u2197" : (VIEW === "watch" ? L.comingUp : L.markShown)); });
    const nc = box.parentElement.querySelector(".nextch");
    if (nc) nc.classList.toggle("on", VIEW !== "watch" && rows.length > 0 && rows.every(r => DONE[r.dataset.req]));
  });
  $$("#stage [data-chprog]").forEach(el => { const c = DECK.chapters[+el.dataset.chprog], d = c.reqs.filter(r => DONE[r[0]]).length;
    el.textContent = d ? (d === c.reqs.length ? "All " + d + " " + lower(L.shown) : d + " of " + c.reqs.length + " " + lower(L.shown)) : ""; });
  emit("tick");
}

function paintVotes() {
  $$("#stage [data-vote]").forEach(box => { const t = VOTES[box.dataset.vote] || {}, n = Object.values(t).reduce((a, b) => a + b, 0),
      top = Math.max(0, ...Object.values(t));
    $$("[data-opt]", box).forEach(o => { const c = t[o.dataset.opt] || 0;
      $(".vn", o).textContent = n ? c + (c === 1 ? " vote" : " votes") : "";
      $(".vb", o).style.width = (n ? c / n * 100 : 0) + "%"; o.classList.toggle("lead", n > 0 && c === top); }); });
}

function go(i) {
  if (window.__LOCKED && i !== window.__START) return;          /* audience view: pinned to the speaker's slide */
  cur = Math.max(0, Math.min(els.length - 1, i));
  els.forEach(x => x.el.classList.toggle("on", x.i === cur));
  const s = SCENES[cur];
  $("#bar").style.width = ((cur + 1) / els.length * 100) + "%";
  $("#cnt").innerHTML = `<b>${cur + 1}</b> / ${els.length}`;
  $$("#gr .th").forEach(t => t.classList.toggle("cur", +t.dataset.i === cur));
  $("#nb").innerHTML = ((s.notes || []).length ? `<ul>${s.notes.map(n => `<li${/^TODO/.test(n) ? ' class="todo"' : ""}>${esc(n)}</li>`).join("")}</ul>` : "<em>No notes.</em>")
    + (s.src ? `<div class="s">Source: ${esc(s.src)}</div>` : "");
  if (VIEW !== "watch") try { history.replaceState(null, "", location.pathname + location.search + "#" + (cur + 1)); } catch (e) {}
  /* DECK.autoTick: arriving on a slide ticks the items listed in its ticks field */
  if (VIEW !== "watch" && DECK.autoTick && list(s.ticks).some(q => !DONE[q])) { list(s.ticks).forEach(q => DONE[q] = true); saveLS(); refreshDemo(); }
  emit("slide");
}

/* clicks inside the stage */
stage.addEventListener("click", e => {
  const cc = e.target.closest("[data-ch]");
  if (cc) { const k = SCENES.findIndex(s => s.t === "chapter" && s.ch === +cc.dataset.ch); if (k >= 0) go(k); return; }
  if (VIEW === "watch") return;
  const nx = e.target.closest("[data-nextch]");
  if (nx) { const n = +nx.dataset.nextch + 1, k = SCENES.findIndex(s => s.t === "chapter" && s.ch === n);
    go(k >= 0 ? k : Math.min(cur + 1, els.length - 1)); return; }
  const r = e.target.closest(".r[data-req]");
  if (r) { const q = r.dataset.req, url = linkFor(q);
    if (url) window.open(url, "_blank", "noopener");
    if (DONE[q] && !url) delete DONE[q]; else DONE[q] = true;
    saveLS(); refreshDemo(); }
});
stage.addEventListener("input", e => { const i = e.target.closest("[data-lk]"); if (!i) return;
  const v = i.value.trim(); if (v) LS_LINKS[i.dataset.lk] = v; else delete LS_LINKS[i.dataset.lk]; saveLS(); refreshDemo(); });

/* T or Enter ticks the next item on the current chapter slide (or in the slide's ticks list); Shift+T unticks the last one */
function tickNext(undo) {
  const s = SCENES[cur]; if (!s) return;
  const ids = s.t === "chapter" ? DECK.chapters[s.ch].reqs.map(r => r[0]) : list(s.ticks);
  const q = undo ? ids.filter(x => DONE[x]).pop() : ids.find(x => !DONE[x]);
  if (!q) return; if (undo) delete DONE[q]; else DONE[q] = true;
  saveLS(); refreshDemo();
}

/* chrome, overlays, keyboard */
const closeAll = () => $$(".ovl").forEach(o => o.classList.remove("open"));
const toggle = id => { const o = $(id), w = o.classList.contains("open"); closeAll(); if (!w) o.classList.add("open"); };
function fit() { stage.style.transform = PROJ ? `translate(-50%,-50%) scale(${Math.min(innerWidth / 1440, innerHeight / 810)})`
    : `translate(-50%,-50%) scale(${Math.min(innerWidth / 1440, (innerHeight - 46) / 810) * 0.97})`; }
$("#zn").onclick = () => go(cur + 1); $("#zp").onclick = () => go(cur - 1);
$("#bo").onclick = () => toggle("#ovlG"); $("#bn").onclick = () => toggle("#ovlN"); $("#bh").onclick = () => toggle("#ovlH");
$("#gr").addEventListener("click", e => { const t = e.target.closest(".th"); if (t) { go(+t.dataset.i); closeAll(); } });
addEventListener("resize", fit);
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target && e.target.matches && e.target.matches("input,textarea")) return;
  switch (e.key) {
    case "ArrowRight": case "PageDown": case " ": e.preventDefault(); go(cur + 1); break;
    case "ArrowLeft": case "PageUp": e.preventDefault(); go(cur - 1); break;
    case "Home": go(0); break; case "End": go(els.length - 1); break;
    case "o": case "O": toggle("#ovlG"); break;
    case "n": case "N": if (VIEW !== "watch") toggle("#ovlN"); break;
    case "h": case "H": $("#chrome").classList.toggle("hide"); break;
    case "?": toggle("#ovlH"); break;
    case "f": case "F": document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); break;
    case "Escape": closeAll(); break;
    case "t": case "T": case "Enter":
      if (VIEW === "watch" || (e.key === "Enter" && e.target && e.target.closest && e.target.closest("button,a"))) break;
      e.preventDefault(); tickNext(e.shiftKey); break;
  }
});

/* ===========================================================================
   LiveDeck: the only surface presenter.js and watch.js touch.
   Any deck can join the live layer by exposing this object (see the skill's
   references/deck-contract.md).
   =========================================================================== */
const _on = {};
function emit(ev) { (_on[ev] || []).forEach(f => { try { f(); } catch (e) {} }); }
window.LiveDeck = {
  view: VIEW,
  total: () => allReqs().length,
  count: () => els.length,
  slide: () => cur,
  publicSlide() { let n = 0; for (let i = 0; i < cur; i++) if (!isPrivate(SCENES[i])) n++; return n; },
  go: i => go(i),

        const k = n.nodeValue.toLowerCase().indexOf(low); if (k < 0) continue;
        const r = document.createRange(); r.setStart(n, k); r.setEnd(n, k + want.length);
        const mk = document.createElement("mark"); mk.className = "maisie-mark"; mk.dataset.id = m.id || "";
        try { r.surroundContents(mk); } catch (e) {} break;
      }
    });
  }
  function applyMarks(marks) {
    SCENES.forEach((s, i) => {
      const sig = JSON.stringify(marks[sid(i)] || []);
      if (sig === (Z.marksSig[i] || "[]")) return;
      Z.marksSig[i] = sig; const el = secOf(i); if (el) markScene(el, i);
    });
  }
  window.SCENE_HOOKS = window.SCENE_HOOKS || [];
  window.SCENE_HOOKS.push((el, s, i) => { if (!Z.st) return; paintDock(el, i); if (marksFor(i).length) markScene(el, i); });

  /* ---------- say: her bubble, bottom left ---------- */
  function hideSay() {
    const u = Z.ui; clearTimeout(Z.sayTimer); if (!u || !u.say.classList.contains("on")) return;
    u.say.classList.add("maisie-go"); setTimeout(() => { if (u.say.classList.contains("maisie-go")) u.say.classList.remove("on", "maisie-go"); }, 500);
  }
  function applySay(say) {
    if (!say || !say.text) { Z.sayId = null; hideSay(); return; }
    const id = String(say.id || say.text); if (id === Z.sayId) return;
    Z.sayId = id; const u = ensureUI(); if (!u) return;
    u.say.classList.remove("maisie-go", "on"); void u.say.offsetWidth;
    u.say.classList.toggle("maisie-dk", isDark(curI()));
    u.say.querySelector(".maisie-to").textContent = say.to ? "to " + say.to : "";
    u.say.classList.add("on");
    u.say.querySelector(".maisie-ghost").textContent = String(say.text);
    const p = u.say.querySelector(".maisie-typed"); p.textContent = ""; setTimeout(() => { if (Z.sayId === id) type(p, String(say.text), 26); }, 300);
    clearTimeout(Z.sayTimer);
    Z.sayTimer = setTimeout(() => { if (Z.sayId === id) hideSay(); }, Math.max(3, Math.min(60, +say.ttl || 9)) * 1000);
    sayLift();
  }
  /* the bubble keeps clear of his words: it takes the lowest spot in the bottom left where it covers the least text
     (his text lines, plus the band and callout boxes), so a band or a foot line at the bottom is never under it */
  function sayBoxes(el, sr, k, maxX) {
    const out = [], vis = new Map(), ok = x => { if (!vis.has(x)) vis.set(x, shown(x)); return vis.get(x); };
    const add = b => { const l = (b.left - sr.left) / k; if (b.width && b.height && l < maxX) out.push({ t: (b.top - sr.top) / k, b: (b.bottom - sr.top) / k }); };
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, { acceptNode: n => !n.nodeValue.trim() || !n.parentElement
      || n.parentElement.closest(".maisie-ui,.maisie-dock,.maisie-tag,.dfoot,script,style") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
    const r = document.createRange();
    for (let n = w.nextNode(); n; n = w.nextNode()) { if (!ok(n.parentElement)) continue; r.selectNodeContents(n); [...r.getClientRects()].forEach(add); }
    el.querySelectorAll(".band,.co").forEach(x => { if (ok(x)) add(x.getBoundingClientRect()); });
    return out;
  }
  function sayLift() {
    const u = Z.ui; if (!u || !u.say) return;
    const el = secOf(curI()), st = document.getElementById("stage"); let base = 810 - 26;      /* the bubble's bottom edge, stage px */
    if (el && st && u.say.classList.contains("on") && !u.say.classList.contains("maisie-go")) {
      const sr = st.getBoundingClientRect(), k = sr.width / 1440 || 1, w = u.say.offsetWidth || 640, hh = u.say.offsetHeight || 96;
      const boxes = sayBoxes(el, sr, k, 28 + w);
      const cost = b0 => boxes.reduce((a, r) => a + Math.max(0, Math.min(b0, r.b) - Math.max(b0 - hh, r.t)), 0);
      let bc = cost(base);
      if (bc > 0) boxes.map(r => r.t - 10).filter(c => c < 810 - 26 && c - hh >= 90).sort((a, b) => b - a)
        .forEach(c => { const v = cost(c); if (v < bc) { bc = v; base = c; } });
    }
    u.say.style.bottom = Math.round(810 - base) + "px";
  }
  document.addEventListener("step", () => { if (Z.ui && Z.ui.say && Z.ui.say.classList.contains("on")) setTimeout(sayLift, 520); });
  /* pending toasts share the top right corner with the card dock: while they show, the dock steps down below them */
  function dockClear() {
    const u = Z.ui, el = secOf(curI()), d = el && el.querySelector(":scope > .maisie-dock"); if (!d) return;
    const t = u && u.toasts, on = !!(t && t.querySelector(".maisie-toast,.maisie-tmore") && !t.classList.contains("maisie-hide"));
    const dy = on ? Math.round(t.offsetTop + t.offsetHeight + 12 - d.offsetTop) : 0;
    d.style.transform = dy > 0 ? "translateY(" + dy + "px)" : "";
  }

  /* ---------- voice: hold V, release to send as a command for this slide ---------- */
  function startVoice() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { note("Voice is not available in this browser"); return; }
    if (!Z.online) { note(Z.reached ? ERR.down : ERR.offline); return; }
    if (Z.holding) return;
    const u = ensureUI(); if (!u || !u.voice) return;
    togglePop(false); Z.holding = true; Z.heard = "";
    u.voice.querySelector("span").textContent = ""; u.voice.classList.add("on");
    try {
      const r = new SR(); Z.rec = r; r.lang = document.documentElement.lang || "en-US"; r.interimResults = true; r.continuous = true;
      r.onresult = e => { let fin = "", tmp = ""; for (let k = 0; k < e.results.length; k++) { const x = e.results[k]; (x.isFinal ? (fin += x[0].transcript) : (tmp += x[0].transcript)); }
        Z.heard = (fin + " " + tmp).trim(); u.voice.querySelector("span").textContent = Z.heard; };
      r.onerror = ev => { if (ev && ev.error && ev.error !== "no-speech" && ev.error !== "aborted") note("Voice is not available in this browser"); };
      r.onend = () => { const t = Z.heard.trim(); Z.rec = null; u.voice.classList.remove("on");
        if (t && !Z.holding) { togglePop(true); u.pop.querySelector(".maisie-in").value = t; ask("command", t).then(ok => { if (ok) u.pop.querySelector(".maisie-in").value = ""; }); } };
      r.start();
    } catch (e) { Z.holding = false; u.voice.classList.remove("on"); note("Voice is not available in this browser"); }
  }
  function stopVoice() {
    if (!Z.holding) return; Z.holding = false;
    if (Z.rec) { try { Z.rec.stop(); } catch (e) {} } else if (Z.ui && Z.ui.voice) Z.ui.voice.classList.remove("on");
  }
  addEventListener("keyup", e => { if (e.key === "v" || e.key === "V") stopVoice(); });
  addEventListener("blur", stopVoice);

  /* ---------- keys: K ask, V hold to talk, Y approve, X dismiss, Esc closes the popover ---------- */
  window.KEYHOOKS = window.KEYHOOKS || [];
  function onKey(e) {
    if (!PRES) return false;
    const k = e.key;
    if (k === "k" || k === "K") { if (!e.repeat) togglePop(); return true; }
    if (k === "v" || k === "V") { if (!e.repeat) startVoice(); return true; }
    if ((k === "y" || k === "Y") && Z.pending.length) { if (!e.repeat) decide("approve", String(Z.pending[0].id), Z.ui && Z.ui.toasts.querySelector(".maisie-toast")); return true; }
    if ((k === "x" || k === "X") && Z.pending.length) { if (!e.repeat) decide("dismiss", String(Z.pending[0].id), null); return true; }
    if (k === "Escape" && Z.ui && Z.ui.pop && Z.ui.pop.classList.contains("open")) { togglePop(false); return true; }
    return false;
  }
  window.KEYHOOKS.push((e, scene) => onKey(e));
  /* fallback when the engine part is missing: run the same hook ourselves */
  addEventListener("keydown", e => {
    if (window.LiveDeck && LiveDeck.steps) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target; if (t && t.closest && t.closest("input,textarea,[contenteditable]")) return;
    if (document.querySelector(".ovl.open") && e.key !== "Escape") return;
    if (onKey(e)) { e.preventDefault(); e.stopImmediatePropagation(); }
  }, true);

  function helpRow(label, keys) {
    if (window.LiveDeck && typeof LiveDeck.help === "function") { try { LiveDeck.help(label, keys); return; } catch (e) {} }
    const box = document.querySelector("#ovlH .keys"); if (!box) return;
    const a = document.createElement("span"), b = document.createElement("span"); a.textContent = label; b.innerHTML = keys; box.append(a, b);
  }
  if (PRES) {
    helpRow("Ask Maisie about this slide", "<kbd>K</kbd>");
    helpRow("Hold to talk to Maisie (your browser's speech service hears the audio)", "<kbd>V</kbd>");
    helpRow("Approve or dismiss Maisie's top suggestion", "<kbd>Y</kbd><kbd>X</kbd>");
  }

  /* the edge click zones: the engine forwards clicks to .maisie-hit controls under them (4g) */

  /* ---------- lifecycle ---------- */
  let started = false;
  LiveDeck.on("slide", () => {
    const u = ensureUI(); const i = curI();
    finishTypers();
    if (u) {
      const dk = isDark(i);
      [u.say, u.note, u.ask, u.toasts].forEach(x => x && x.classList.toggle("maisie-dk", dk));
      if (u.pop && u.pop.classList.contains("open")) refreshPop();
    }
    if (Z.prev !== i && Z.prev >= 0) { const p = Z.prev; clearTimeout(Z.tuckT[p]); Z.autoTuck[p] = false; delete Z.tuck[p];
      const pd = secOf(p) && secOf(p).querySelector(":scope > .maisie-dock"); if (pd && !pd.querySelector(".maisie-unseen")) pd.classList.add("maisie-tucked"); }
    Z.prev = i;
    const el = secOf(i);
    if (el) typeUnseen(el);
    dockClear(); sayLift();
    if (Z.fresh[i]) { const f = Z.fresh[i]; delete Z.fresh[i]; setTimeout(() => { if (curI() === i) flash(i, f); }, 700); }
    if (!started) { started = true; if (HTTP) poll(); else setOnline(false, false); }
  });
})();

/* boot */
if (VIEW === "watch") $("#bn").remove();                         // speaker notes stay off audience screens
const mark = DECK.logos[0]; if (mark) { $("#mk").src = mark.dark || mark.light; $("#mk").alt = mark.alt || ""; } else $("#mk").remove();
$("#who").textContent = DECK.presenter + (DECK.audience ? "  for " + DECK.audience : "");
document.title = DECK.title + (DECK.audience ? ", " + DECK.audience : "");
/* ---- v3 wall: cards from GET /api/exp/wall, shown with the last build of the "thisweek" slide ---- */
(function v3wall() {
  let cards = [], n = 0, gone = new Set(), busy = false;
  const root = () => document.querySelector(".v3wall");
  function line(k, v) { return v ? `<span><b>${k}:</b> ${esc(v)}</span>` : ""; }
  function fit(w) {                      /* the wall grows until it is full, then the oldest card fades out */
    if (w.clientHeight < 60) return;      /* not laid out yet (build step still hidden): cut nothing */
    const kids = [...w.querySelectorAll(".v3c:not(.out)")];
    for (let k = kids.length - 1; k >= 1 && w.scrollHeight > w.clientHeight + 2; k--) { const x = kids[k]; gone.add(x.dataset.id); x.remove(); }
  }
  function paint() {
    const w = root(); if (!w) return;
    if (!cards.length) { w.innerHTML = '<div class="v3e">Ideas will appear here</div>'; gone = new Set(); return; }
    w.querySelectorAll(".v3e").forEach(e => e.remove());
    const have = new Set([...w.querySelectorAll(".v3c")].map(e => e.dataset.id));
    const fresh = cards.filter(c => !have.has(c.id) && !gone.has(c.id));
    const ids = new Set(cards.map(c => c.id));
    w.querySelectorAll(".v3c").forEach(e => { if (!ids.has(e.dataset.id)) e.remove(); });
    for (const c of fresh.slice().reverse()) {
      const d = document.createElement("div"); d.className = "v3c"; d.dataset.id = c.id;
      d.innerHTML = line("Test", c.test) + line("Check", c.check) + line("Tell", c.tell);
      w.insertBefore(d, w.firstChild);
    }
        fit(w);
  }
  async function pull() {
    if (busy || document.hidden || !root()) return; busy = true;
    try { const r = await fetch("/api/exp/wall", { cache: "no-store", credentials: "same-origin" });
      if (r.ok) { const j = await r.json(); cards = Array.isArray(j.cards) ? j.cards : []; n = j.n | 0; paint(); } } catch (_) { /* keep what is shown */ }
    busy = false;
  }
  SCENE_HOOKS.push((el, s) => {
    if (s.id !== "thisweek" || s.asks) return;   /* round 2: the slide ends on the two questions, so there is no experiment wall under it */
    const box = el.querySelector(".showG-cds"); if (!box) return;
    let top = 0; box.querySelectorAll("[data-step]").forEach(x => { top = Math.max(top, parseInt(x.dataset.step, 10) || 0); });
    box.classList.add("v3w-on");
    const w = document.createElement("div"); w.className = "v3wall"; w.setAttribute("aria-label", "Experiments from the room");
    if (top) w.dataset.step = String(top);
    box.appendChild(w); paint(); pull();
  });
  const soon = () => setTimeout(pull, 250);
  window.addEventListener("live-poll", soon);
  window.addEventListener("message", e => { if (e.origin === location.origin && e.data && (e.data.t === "live-poll" || e.data.t === "poll")) soon(); });
  setInterval(pull, 3000);
  window.__v3wallPaint = (c) => { cards = c; paint(); };
})();
/* ---- end v3 wall ---- */
build(); fit(); refreshDemo();
go(typeof window.__START === "number" ? window.__START : (VIEW === "watch" ? 0 : Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1)));
</script>
